<div class="vertical-layout page_loader" id="sales" style="display: none">
    <!--Start Containerbar-->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0">
                        <lang class="lang_salehistory_title">Sales History</lang>
                    </h4>
                </div>
                <div class="col">

                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar">
                        <span id="sales_sort_host"></span>
                        <button type="button" id="sales_export_filtered" class="btn btn-primary-rgba" aria-label="Export filtered sales to CSV" title="Export filtered sales to CSV"><i class="feather icon-download mr-1"></i><span class="list-file-action-label" data-t="lang_export">Export</span></button>
                        <button type="button" id="sales_filter_btn"
                            class="btn btn-primary-rgba lf-btn"
                            aria-haspopup="dialog" aria-controls="sales_filter_dialog" title="Filter sales" data-t-title="lang_filter_sales">
                            <i class="feather icon-filter mr-2"></i><lang class="lang_search">Search</lang> &amp; <lang class="lang_filter">Filter</lang>
                        </button>
                        <a id="sales_new_button" data-module="sales" data-access="write" href='#/sales/new'
                            class="btn btn-primary-rgba dash_sale_count" data-toggle="tooltip" title="New Sale" data-t-title="lang_addnewsale_title">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>
                    </div>
                </div>
            </div>
            <div id="sales_filter_scope">
            <div class="sales-history-topline">
                <div id="sales_quick_controls" data-lf="sales"></div>
            
            </div>
            <dialog id="sales_filter_dialog" aria-label="Search and filter sales">
                <div id="sales_filter_panel" class="sales-history-filterbar">
<div id="sales_filter_search" class="lf-panel"></div>
            <div id="sales_restaurant_filters" class="flex-wrap align-items-end" style="display:none; gap:10px;">
                <div><label for="sales_history_table" class="mb-1"><lang class="lang_table">Table</lang></label>
                    <select id="sales_history_table" class="form-control"><option value="" data-t="lang_all_sales"><lang class="lang_all_sales">All sales</lang></option><option value="__tables" data-t="lang_tables_only"><lang class="lang_tables_only">Tables only</lang></option></select></div>
                <div><label for="sales_history_period" class="mb-1"><lang class="lang_serving_period">Serving period</lang></label>
                    <select id="sales_history_period" class="form-control"><option value="" data-t="lang_all_day"><lang class="lang_all_day">All day</lang></option></select></div>

                <small id="sales_history_period_hint" class="sr-only" aria-live="polite"></small>
            </div>
                <h6 class="sales-filter-section">Order details</h6>
                <div id="sales_provenance_form" class="sales-history-provenance">
                    <label class="mb-0 sales-history-picker"><span id="sales_history_staff_label"><lang class="lang_staff">Staff</lang></span><input id="sales_history_staff" class="form-control" autocomplete="off" role="combobox" aria-autocomplete="list" type="search" maxlength="120" placeholder="Staff name or email" data-t-placeholder="lang_staff_name_or_email"></label>
                    <label class="mb-0 sales-history-picker"><lang class="lang_device">Device</lang><input id="sales_history_device" class="form-control" autocomplete="off" role="combobox" aria-autocomplete="list" type="search" maxlength="120" placeholder="Device name or ID" data-t-placeholder="lang_device_name_or_id"></label>
                    <label class="mb-0" id="sales_history_source_wrap"><lang class="lang_rd_order_source">Order source</lang><select id="sales_history_source" class="form-control"><option value=""><lang class="lang_all_sources">All sources</lang></option></select></label>
                </div>
                </div>
                <div class="sales-filter-footer">
                    <button type="button" id="sales_provenance_reset" class="btn btn-light"><lang class="lang_clear_all">Clear all</lang></button>
                    <button type="button" data-close-sales-filter class="btn btn-primary">Done</button>
                </div>
            </dialog>
            </div>
            <div class="transaction-filter-summary">
                <div id="sales_active_filters" class="d-flex flex-wrap" style="gap:8px" aria-live="polite"></div>
                <div id="sales_history_summary" class="sales-history-summary" role="status" aria-live="polite"></div>
            </div>
            <!--
                The "filtering by X" badges are gone with the controls that fed
                them - PosnicPro.search was the only thing that ever wrote them,
                and the button's count states the same fact where it can be seen
                with the panel closed.
            -->
        </div>
    </div>

    <!--Start Contentbar-->
    <div class="contentbar">
        <div id="sales_split">
            <div class="card m-b-30 md-rail" id="sales_list_card">
                <div class="card-body">
                    <div id="sales_list_rows" class="md-rail-rows text-muted"><lang class="lang_loading_sales">Loading sales ...</lang></div>
                    <div class="q-pager" id="sales_list_paging"></div>
                </div>
            </div>
            <div class="card m-b-30 md-detail" id="sales_detail_card" style="display:none;">
                <div id="sales_doc"></div>
            </div>
        </div>
    </div>
    <!--End Contentbar-->
</div>
<!--End Containerbar-->
