                                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="receivingreport" onclick="PosnicPro.nextPage(this, 'Table')" aria-label="Next page" data-t-aria-label="lang_next_page"> <i class="fa fa-angle-right font-20"></i> </button>
