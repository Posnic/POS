<div id="infobar-settings-sidebar-category" class="infobar-settings-sidebar scroll_width" style="z-index: 1005">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between">
        <h4 id="exampleModalCenterTitle"><span id="category_title">Add</span>&nbsp;<lang class="lang_category_title">Category</lang></h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="category">
            <img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close" loading="lazy" decoding="async">
        </a>
    </div>
    <div class="infobar-settings-sidebar-body">
        <div class="custom-mode-setting  loader-category">
            <!--<form id='category_add'>-->
            <form class='category_add' name="category_image_upload_form" id="category_image_upload_form" method = "POST" enctype = "multipart/form-data">

                <div class="profilebox text-center">
                    <div class="form-row">
                        <div class="col-md-12 itemImageSize">
                            <ul class="list-inline">
                                <li class="list-inline-item">
                                    <img src="static/images/default/category.svg" class="img_upload_temp_view" id="category_image_upload" alt="NoImg" loading="lazy" decoding="async">
                                    <div class="profilename">
                                        <label for="upload_file_category">
                                            <span class="btn btn-success-rgba font-18 category-image-label-title" style="cursor:pointer"><i class="feather icon-edit"></i></span>
                                         </label>
                                         <label for="delete_file_category">
                                            <a href="javascript:void(0)" class="btn btn-danger-rgba font-18" style="cursor:pointer" onclick="PosnicPro.categories.removeCategoryImage()"><i class="feather icon-trash"></i></a>
                                        </label>
                                    </div>
                                    <input type="file" name="ImageCategory" id="upload_file_category" class="inputfile inputfile-1" onchange="PosnicPro.imageReadURL(this, 'category', '205', '160');"
                                           accept=".gif, .jpg, .png, .jpeg, .bmp" data-placeholder="No file" data-btnclass="btn-light"
                                           tabindex="-1" style="position: absolute; clip: rect(0px, 0px, 0px, 0px);" hidden>
                                    <input type="hidden" name="category_image" id="category_image">
                                    <input type="hidden" name="get_category_image_value" id="get_category_image_value">
                                    <input type="hidden" name="category_value_check" id="category_value_check">
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="category_name">
                            <lang class="lang_name_title"> Name </lang> 
                            <span class="text-danger">*</span> 
                        </label>
                        <input type="text" class="form-control border-control" name="name" id="category_name" minlength="3" maxlength="50" placeholder="Enter the name"  autocomplete="off" required>
                        <label class="form-control-placeholder d-block m-t-10">
                            <lang class="lang_tile_color">Colour on the sale screen</lang>
                        </label>
                        <div id="category_tile_swatches">
                            <span class="tile-swatch" data-color="" title="None" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#fff;border:1px dashed #aab;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#e74c3c" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#e74c3c;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#e91e63" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#e91e63;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#f39c12" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#f39c12;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#a4c400" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#a4c400;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#27ae60" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#27ae60;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#2d9cdb" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#2d9cdb;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#8e44ad" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#8e44ad;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#16a085" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#16a085;border-radius:4px;margin-right:6px;"></span>
                            <span class="tile-swatch" data-color="#d35400" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#d35400;border-radius:4px;margin-right:6px;"></span>
                        </div>
                        <input type="hidden" name="tile_color" id="category_tile_color" value="">
                        <label class="form-control-placeholder d-block m-t-10">
                            <lang class="lang_tile_shape">Shape</lang>
                        </label>
                        <div id="category_tile_shapes">
                            <span class="tile-shape" data-shape="square" title="Square" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#8a94a6;border-radius:3px;margin-right:6px;"></span>
                            <span class="tile-shape" data-shape="rounded" title="Rounded" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#8a94a6;border-radius:10px;margin-right:6px;"></span>
                            <span class="tile-shape" data-shape="circle" title="Circle" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#8a94a6;border-radius:50%;margin-right:6px;"></span>
                            <span class="tile-shape" data-shape="diamond" title="Diamond" style="width:28px;height:28px;display:inline-block;cursor:pointer;background:#8a94a6;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);margin-right:6px;"></span>
                        </div>
                        <input type="hidden" name="tile_shape" id="category_tile_shape" value="">
                        <input type="hidden" name="id" id="category_id">
                        <input type="hidden" name="image" id="category_logo">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-4">
                        <div class="custom-control custom-radio custom-control-inline">
                            <input type="radio" id="radio_category_discount_amount" name="radio_discount" class="custom-control-input" checked="checked">
                            <label class="custom-control-label" for="radio_category_discount_amount">
                                <lang class="lang_discount_title">Discount</lang> <span class="display-currency"></span>
                            </label>
                        </div>
                    </div>
                    <div class="form-group col-md-5">
                        <div class="custom-control custom-radio custom-control-inline">
                            <input type="radio" id="radio_category_discount_percentage" name="radio_discount" class="custom-control-input">
                            <label class="custom-control-label" for="radio_category_discount_percentage">
                                <lang class="lang_discount_title">Discount</lang> %
                            </label>
                        </div>
                    </div>
                    <div class="form-group col-md-3" id="category_discount" style="text-align:right;"> 
                       <span class="summary_toolsize" data-toggle="tooltip" data-placement="top" title="" data-original-title="This changes does not apply to Existing products">
                          <i class="feather icon-help-circle"></i>
                       </span>
                </div>  
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <div class="floating-label">
                            <input name="discount_amount" id="category_discount_amount" type="text"
                                   aria-describedby="basic-addon1" class="form-control border-control allow_decimal text-right" min="0"
                                   minlength="1" maxlength="10" value="0" >

                            <input name="discount_percentage" id="category_discount_percentage"
                                   type="number" aria-describedby="basic-addon1"
                                   class="form-control border-control text-right" min="0" max="100" maxlength="4"
                                   onkeyup="this.value = PosnicPro.minmax(this.value, 0, 100)"
                                   onkeypress="return PosnicPro.isNumber(event)" value="0">
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="category_description">
                            <lang class="lang_description_title"> Description </lang>
                        </label>
                        <textarea name="description" id="category_description" class="form-control border-control" minlength="3" maxlength="500" placeholder="Enter the Description"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <div class="pull-right">
                            <button type="button" class="btn btn-outline-secondary infobar-settings-reset" id="category_reset" onclick="PosnicPro.categories.categoryClearForm();"><i class="feather icon-refresh-ccw mr-2"></i><lang class="lang_clear_title"> Clear</lang></button>
                            <button type="button" class="btn btn-outline-secondary infobar-settings-reset category_edit_reset" id="category_edit_reset" onclick="PosnicPro.categories.resetEditButton(this.id);"><i class="feather icon-refresh-ccw mr-2"></i><lang class="lang_reset_title"> Reset</lang></button>
                            <button type="button" class="btn btn-outline-danger infobar-settings-close" data-id="category"><i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title"> Close</lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary" id="categorySubmitForm"><i class="feather icon-save mr-2"></i><span id="category_button_title"><lang class="lang_save_title">Save</lang></span></button>
                        </div>
                    </div>
                </div>
                <div class="form-row" id="show_last_created_category" style="display:none;">
                    <div class="form-group col-md-12">
                        <div class="pull-right">
                            <h6>Saved a category. <a href="#" id="last_created_category">Open it</a></h6>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
