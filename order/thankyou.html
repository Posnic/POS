<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff">
    <!--
        WHERE EVERY RELATIVE PATH ON THIS PAGE POINTS.
        A printed code can be three segments deep - /order/AZ100/venue/RC/123
        for a hotel room - and without this the browser looks for each asset
        under /order/AZ100/venue/, a directory that does not exist. The page
        loads and shows nothing, which is the worst kind of broken: a blank
        screen with no error anybody sees.
        Pinned to the mount rather than left to the arriving URL, so one file
        serves the shop address, a table and a venue alike.
    -->
    <base href="/order/" />
    <title>Order placed</title>
    <link href="assets/order.css?v=20260912-design" rel="stylesheet">
    <script src="assets/i18n.js?v=20260912-design"></script>
    <script src="assets/jquery-3.7.1.min.js?v=20260912-design"></script>
    <!-- The receipt's PDF library, served by the shop like everything else
         on this page: the page's own policy allows no other host, and a
         kiosk on the shop's wifi may have no other host to reach. -->
    <script src="assets/html2pdf.bundle.min.js?v=20260912-design"></script>
    <script src="config.js?v=20260912-design"></script>
    <link href="assets/channel-state.css?v=20260912-design" rel="stylesheet">
    <script src="assets/channel-state.js?v=20260912-design"></script>
    <script src="assets/service-point.js?v=20260912-design"></script>
    <script src="assets/shop-address.js?v=20260912-design"></script>
</head>

<body>
    <!--
        THE TOKEN IS THE PAGE. It is the one thing the customer has to carry
        to the counter, so it is the largest thing on the screen; everything
        else is quieter than it. "Payment Successful" in red is gone - red is
        for things that went wrong.
    -->
    <main class="done">
        <div class="done-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg>
        </div>
        <h1 id="done-title">Order placed</h1>
        <p class="lead" id="done-lead">The kitchen has it. Show this at the counter.</p>
        <p class="lead" id="done-pay" hidden></p>

        <div class="token">
            <span class="token-label">Your token</span>
            <span class="token-number" id="tokenId">--</span>
        </div>
        <p class="order-time">Placed <span id="orderTime">--</span></p>

        <!-- A bill is a record of money that has changed hands. This appears
             when the shop has marked the order paid, and not before. -->
        <button type="button" class="btn-primary done-bill" id="done-bill" hidden>Download the bill</button>

        <div class="button-group">
            <button type="button" class="btn-primary" onclick="clearReceiptAndGo('products.html')">Order more</button>
            <button type="button" class="btn-secondary" onclick="window.location.href='history.html'">Your orders</button>
        </div>
    </main>

    <!--
        The receipt, built but not shown: no money has changed hands yet, so
        there is nothing to give a customer a bill for. It is filled in as
        the page loads so that the shop marking the order paid has something
        to offer immediately.
    -->
    <section class="receipt-section" aria-label="Receipt" hidden>
        <div class="center" id="branch-name"><strong>POS</strong></div>
        <div class="center">Token <strong><span id="token-id"></span></strong></div>
        <div class="center">Date <strong><span id="orderDate">--</span></strong></div>
        <div class="receipt-line"></div>
        <div class="center">
            <div>Order <strong id="orderTypePrint">DINE IN</strong> &middot; Paid by <strong id="paymentTypePrint">Upi</strong></div>
        </div>
        <div class="receipt-line"></div>

        <div id="items"></div>

        <div class="receipt-line"></div>

        <div class="totals">
            <div class="item"><span>Subtotal</span><span><strong id="subtotal"></strong></span></div>
            <div class="item"><span>Discount</span><span><strong id="discount"></strong></span></div>
            <div class="item"><span>Tax</span><span><strong id="tax"></strong></span></div>
            <div class="item" id="fee-row" hidden><span id="fee-label">Delivery</span><span><strong id="fee"></strong></span></div>
            <div class="item"><span>Total</span><span><strong id="total"></strong></span></div>
        </div>

        <div class="receipt-line"></div>
        <div class="center">Thank you. Visit again.</div>
        <div class="powered">Powered by Posnic &middot; www.posnic.com</div>
    </section>

    <script src="assets/thankyou/script.js?v=20260912-design"></script>
</body>
</html>
