<div class="vertical-layout page_loader" id="variants" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title"><lang class="lang_itemvariant_title"> Variant List</lang></h4>
                </div>               
                <div class="col-md-8 col-lg-8 show-button-action"></div>                  
                <div class="col-lg-3 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_variants_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_variants_fields" aria-label="View variants fields">
                        <option value="name" selected><lang class="lang_name_title">Name</lang></option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_variants_input"
                           placeholder="Enter Name" data-id="variants" maxlength="25" autocomplete="name">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 adjuce_left tb_search hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="variants" onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="variants" onclick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left add_new_tooltip" data-toggle="tooltip" title="Filter"><i class="feather icon-filter" aria-hidden="true"></i></button>
                        <a data-module="item" data-access="write" href='#/variants/new' onClick="PosnicPro.variants.addVariantButton();" class="btn btn-primary-rgba dash_sale_count add_new_tooltip" data-toggle="tooltip" title="New Variant">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>                       
                    </div>
                </div>                        
            </div> 
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 mobile-hide tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;"><span class="view_variants_date_filter_value"></span></span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;"><span class="view_variants_filter_value"></span></span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header variant_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_variants_per_page" data-id="variants" onChange="PosnicPro.setPerPage(this, 'Table');" aria-label="View variants per page">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item email_320">
                                                <a data-module="item" data-access="read" href="#/variants" id="variants_exportbtn" class="sale_color" onClick="PosnicPro.variants.exportVarients();" data-toggle="tooltip" title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item email_320">
                                                <a data-module="item" data-access="delete" href="#/variants" id="variants_deletebtn" class="sale_color" onclick="PosnicPro.variants.deleteSelectedVariants();" data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item email_320">
                                                <a href="javascript:PosnicPro.refreshDatatable('variants')" data-id="variants" class="add_new_tooltip" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-variant">
                        <div class="table-responsive">
                            <table class="table table-borderless m-cards" id="view_variants">
                                 <div class="col-sm-6 col-md-12 col-lg-12" id="variant_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="" loading="lazy" decoding="async">
                                </div>
                                <div class="variant_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                <thead class="datatable-thead-tbody table-header variant_header"></thead>
                                <tbody class="datatable-thead-tbody table-body variant_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 variant_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_variants_page_total"></span></b> 
                                    to 
                                    <b><span id="view_variants_page_perpage_total"></span></b> 
                                    of 
                                    <b><span id="view_variants_total"></span></b> 
                                    entries 
                                    <span class="showing-hide-show-variants" style="display:none;">&nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-variants text-dark">0</span>&nbsp; 
                                        rows selected  
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="variants" onclick="PosnicPro.previousPage(this, 'Table')" aria-label="Previous page"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="variants" onclick="PosnicPro.nextPage(this, 'Table')" aria-label="Next page"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->


<div class="modal fade close_on_esc" id="variants_view" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content loader-view-variant">
            <div class="modal-header">
                <h5 class="modal-title"><lang class="lang_variantdetail"> Variant Details </lang></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row justify-content-center">
                    <div class="row">
                        <div class="col-lg-12">
                            <h4><span id="variant_view_name" class="text-primary"></span></h4>
                            <div class="table-responsive">
                                <table class="table table-borderless mb-0">
                                    <tbody id="view_variant_fields"></tbody>
                                    <tbody>
                                    <tr>
                                        <th scope="row"><lang class="lang_createdate_title"> Created Date </lang> :</th>
                                    <td>
                                        <span id="variant_view_created_date"></span>
                                    </td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_update_title"> Updated Date </lang> :</th>
                                    <td>
                                        <span id="variant_view_updated_date"></span>
                                    </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" data-dismiss="modal">
                    <i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title"> Close</lang>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- end  -->
