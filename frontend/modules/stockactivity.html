<div class="vertical-layout page_loader" id="stocklogs" style="display: none">
    <!-- Inventory Logs, built to LIST_PAGE_UX_STANDARD.md: the stock ledger
         the transition machinery writes, read-only by design. A row is a
         movement; clicking it opens the ITEM's dossier (#/items/<id>) where
         the full movement trail lives - a ledger line has no document of its
         own, so the standard's cross-link rule applies instead of a pane. -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0"><lang class="lang_invenlog_title">Inventory Logs</lang></h4>
                </div>
                <div class="col">
                    <div class="lf-panel" id="stocklogs_filter_panel" style="display:none;"></div>
                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar" id="stocklogs_controls">
                        <div class="btn-group">
                        <button type="button" class="btn btn-primary-rgba dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" title="Export CSV" aria-label="Export CSV">
                            <i class="feather icon-share"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="javascript:void(0)" onclick="PosnicPro.stocklogs.exportCsv(); return false;">This page (what is shown)</a>
                            <a class="dropdown-item" href="javascript:void(0)" onclick="PosnicPro.stocklogs.exportAllCsv(); return false;">Everything matching the filter</a>
                        </div>
                        </div>
                        <button type="button" class="btn btn-primary-rgba lf-btn" id="stocklogs_filter_btn"
                            data-toggle="tooltip" title="Filter movements">
                            <i class="feather icon-filter mr-2"></i>Filter
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="contentbar">
        <div id="stocklogs_split">
        <div class="card m-b-30 md-rail" id="stocklogs_list_card">
            <div class="card-body">
                <!-- Movement as a labeled dropdown (LIST_PAGE_UX_STANDARD §2:
                     quick filters are dropdowns, never chips). -->
                <div class="m-b-10 d-flex align-items-center flex-wrap" style="gap:8px;" id="stocklogs_quick_filters">
                    <span class="p-qf-label">Movement</span>
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" id="stocklogs_move_dd">All</button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item il-move-opt" href="javascript:void(0)" data-move="">All</a>
                            <a class="dropdown-item il-move-opt" href="javascript:void(0)" data-move="purchases">Purchases</a>
                            <a class="dropdown-item il-move-opt" href="javascript:void(0)" data-move="sales">Sales</a>
                            <a class="dropdown-item il-move-opt" href="javascript:void(0)" data-move="items">Item edits</a>
                        </div>
                    </div>
                </div>
                <div id="stocklogs_list_rows" class="md-rail-rows text-muted">Loading movements ...</div>
                <div class="q-pager" id="stocklogs_list_paging"></div>
            </div>
        </div>
            <div class="card m-b-30 md-detail" id="stocklogs_detail_card" style="display:none;">
                <div id="stocklogs_doc"></div>
            </div>
        </div>
    </div>
</div>

<!-- Stock log detail modal. The LIST no longer opens this (a row cross-links
     into the item dossier); it stays because the settings Recycle Bin previews
     a deleted log through PosnicPro.stocklogs.viewStockData, and a deleted
     log's item may no longer exist to link to. -->
<div class="modal fade close_on_esc" id="view_stock_log" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content" loader-view-stocklog>
            <div class="modal-header">
                <h5 class="modal-title">
                    <lang class="lang_stocklogdetail_title">Stock Log Details </lang>
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row justify-content-center">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive">
                                <table class="table table-borderless mb-0">
                                    <tbody>
                                    <tr>
                                        <th scope="row"><lang class="lang_itemname_title"> Item Name </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_item_name"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_itemquantity_title">Item Quantity</lang>:</th>
                                    <td><span id="view_stock_item_quantity"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_process_title"> Process </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_process"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_reference_title"> Reference </lang> :</th>
                                    <td><span id="view_stock_reference"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_stockdate_title">Stock Date </lang> :</th>
                                    <td><span id="view_stock_date"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_action_title"> Action </lang> :</th>
                                    <td><span id="view_stock_action"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_openingbalance_title"> Opening Stock </lang> :</th>
                                    <td><span id="view_stock_opening_balance"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_closingbalance_title">Closing Stock </lang> :</th>
                                    <td><span id="view_stock_closing_balance"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_changedby_title"> Changed By </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_changed_by"></span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" data-dismiss="modal">
                    <i class="feather icon-x-circle mr-2"></i>
                    <lang class="lang_close_title"> Close</lang>
                </button>
            </div>
        </div>
    </div>
</div>
