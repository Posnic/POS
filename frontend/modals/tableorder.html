<div id="infobar-settings-sidebar-tableorder" class="infobar-settings-sidebar">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between infobar_tableordercalss">
        <h4 id="exampleModalCenterTitle"><span id="tableorder-heading"><lang class="lang_nav_add">Add</lang></span>&nbsp;<lang class="lang_table_order_field">
                Table Order Field</lang>
        </h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="tableorder"><img
                src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close" loading="lazy" decoding="async"></a>
    </div>
    <div class="infobar-settings-sidebar-body loader-tax">
        <div class="custom-mode-setting">
            <form id='tableorder_add_form'>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="tableorder_value">
                            <lang class="lang_value_title"> Value </lang> <span class="text-danger">*</span>
                        </label>

                        <input id="tableorder_value" type="text" name="tableorder_value"
                            class="form-control border-control text-right" style="display: block;" minlength="1"
                            maxlength="6" pattern="[A-Za-z0-9]{1,6}"
                            title="Max 6 characters. Only letters and numbers allowed." data-t-title="lang_max_6_characters_only_letters_and_numbers" required>
                        <input type="hidden" id="tableorder_id" name="tableorder_id">
                        <label for="table_capacity" class="mt-3"><lang class="lang_table_capacity">Seat capacity</lang></label>
                        <input class="form-control border-control" id="table_capacity" name="capacity" type="number" min="1" max="1000" step="1">
                        <label for="table_max_capacity" class="mt-3"><lang class="lang_table_max_capacity">Maximum seats</lang></label>
                        <input class="form-control border-control" id="table_max_capacity" name="max_capacity" type="number" min="1" max="1000" step="1">
                        <label for="table_area" class="mt-3"><lang class="lang_table_area">Dining area</lang></label>
                        <input class="form-control border-control" id="table_area" name="area" maxlength="60">
                        <label for="table_shape" class="mt-3"><lang class="lang_table_shape">Table shape</lang></label>
                        <select class="form-control border-control" id="table_shape" name="shape">
                            <option value="square" ><lang class="lang_table_square">Square</lang></option>
                            <option value="round" ><lang class="lang_table_round">Round</lang></option>
                            <option value="rectangle" ><lang class="lang_table_rectangle">Rectangle</lang></option>
                        </select>
                        <fieldset class="mt-3" id="table_neighbours_field">
                            <legend class="h6"><lang class="lang_table_combine_with">Can combine with</lang></legend>
                            <div id="table_neighbours"></div>
                        </fieldset>


                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <div class="pull-right">
                            <button type="button" class="btn btn-outline-secondary infobar-settngs-reset"
                                id="tableorder_reset" onclick="PosnicPro.tableOrders.tableOrdersClearForm();"><i
                                    class="feather icon-refreshi-ccw mr-2"></i>
                                <lang class="lang_clear_title"> Clear</lang>
                            </button>
                            <button type="button"
                                class="btn btn-outline-secondary infobar-settings-reset tableorder_edit_reset"
                                id="tableorder_edit_reset" onclick="PosnicPro.tableOrders.resetEditButton(this.id);"><i
                                    class="feather icon-refresh-ccw mr-2"></i>
                                <lang class="lang_reset_title"> Reset</lang>
                            </button>

                            <button type="button"
                                class="btn btn-outline-danger infobar-settings-close infobar_tableordercalss"
                                data-id="tableorder"><i class="feather icon-x-circle mr-2"></i>
                                <lang class="lang_close_title"> Close</lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="feather icon-save mr-2"></i><span id="tableorder_text_change">
                                    <lang class="lang_save_title">Save</lang>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Table Order Tab End -->
