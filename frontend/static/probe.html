<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posnic boot probe</title>
<!-- TEMPORARY diagnostic harness, v2: SELF-DRIVING CSS BISECT.
     v1 convicted the stylesheet: an almost empty page died seconds after
     style/dashboard.<hash>.css applied on iOS 18.7. This version splits the
     sheet's top-level rules and binary-searches for the killer: apply a
     half; survive 6s = that half is innocent (auto-advance + self reload);
     die = iOS reloads us and the next boot reads the unfinished range as
     guilty. ~14 crashes from ~10k rules to ONE. Every step beacons.
     Remove with the flight recorder (OWNER_QUEUE row 193). -->
</head>
<body>
<h3 id="s">bisect: starting</h3>
<pre id="log" style="white-space:pre-wrap"></pre>
<script>
(function () {
    'use strict';
    var SK = 'posnic_css_bisect';
    function say(m) {
        try {
            document.getElementById('s').textContent = m.slice(0, 90);
            document.getElementById('log').textContent += m + '\n';
            var p = JSON.stringify({ message: '[boot-flight] BISECT ' + m, at: 'boot-flight' });
            if (navigator.sendBeacon) { navigator.sendBeacon('/client-errors', new Blob([p], { type: 'application/json' })); }
        } catch (e) { }
    }
    /* split css into top-level rules (brace walker; @media blocks count as
       ONE rule so the search descends into them by text-splitting later) */
    function splitRules(css) {
        var rules = [], depth = 0, start = 0;
        for (var i = 0; i < css.length; i++) {
            var c = css[i];
            if (c === '{') { depth += 1; }
            else if (c === '}') {
                depth -= 1;
                if (depth === 0) { rules.push(css.slice(start, i + 1)); start = i + 1; }
            }
        }
        return rules;
    }
    fetch('/dashboard.html', { credentials: 'omit' }).then(function (r) { return r.text(); }).then(function (html) {
        var m1 = html.match(/style\/dashboard\.[0-9a-f]{8}\.css/);
        return fetch('/' + m1[0]).then(function (r) { return r.text(); });
    }).then(function (css) {
        var rules = splitRules(css);
        var st = null;
        try { st = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { }
        if (!st || st.total !== rules.length) {
            st = { lo: 0, hi: rules.length, total: rules.length, pending: null };
        }
        if (st.pending) {
            /* the last boot applied [pending.lo, pending.mid) and never
               reported survival: that half is GUILTY - narrow into it */
            st.hi = st.pending.mid;
            st.lo = st.pending.lo;
            say('range ' + st.pending.lo + '-' + st.pending.mid + ' KILLED the last boot; narrowing');
            st.pending = null;
        }
        if (st.hi - st.lo <= 1) {
            var rule = rules[st.lo] || '(none)';
            say('VERDICT rule #' + st.lo + ' of ' + st.total + ': ' + rule.slice(0, 500));
            localStorage.setItem(SK, JSON.stringify(st));
            return;
        }
        var mid = Math.floor((st.lo + st.hi) / 2);
        st.pending = { lo: st.lo, mid: mid };
        localStorage.setItem(SK, JSON.stringify(st));
        say('testing rules ' + st.lo + '-' + mid + ' of ' + st.total + ' (span ' + (st.hi - st.lo) + ')');
        var styleEl = document.createElement('style');
        styleEl.textContent = rules.slice(st.lo, mid).join('\n');
        document.head.appendChild(styleEl);
        setTimeout(function () {
            /* alive: this half is innocent - the killer is in the other */
            st.lo = mid;
            st.pending = null;
            localStorage.setItem(SK, JSON.stringify(st));
            say('survived rules up to ' + mid + ' - advancing');
            setTimeout(function () { location.reload(); }, 800);
        }, 6000);
    }).catch(function (e) { say('setup failed: ' + String(e && e.message).slice(0, 80)); });
})();
</script>
</body>
</html>
