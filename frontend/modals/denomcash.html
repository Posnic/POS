<div id="infobar-settings-sidebar-denomcash" class="infobar-settings-sidebar">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between infobar_denomcalss">
        <h4 id="exampleModalCenterTitle"><span id="denom-heading">Add</span>&nbsp;<lang class="lang_tax_title">Denomination Field</lang> </h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="denomcash"><img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close" loading="lazy" decoding="async"></a>
    </div>
    <div class="infobar-settings-sidebar-body loader-tax">
        <div class="custom-mode-setting">            
            <form id='denom_add_form'> 
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="denom_value"><lang class="lang_value_title"> Value </lang> <span class="text-danger">*</span> </label>
                                                         
                            <input id="denom_value" type="text" minlength="1" name="denom_value" class="form-control border-control text-right" 
                                   style="display: block;" onkeypress="return PosnicPro.isNumber(event)" required>
                            <input type="hidden" id="denom_id" name="denom_id">
                       
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <div class="pull-right">
                            <button type="button" class="btn btn-outline-secondary infobar-settngs-reset" id="denom_reset" onclick="PosnicPro.denom.denomClearForm();"><i class="feather icon-refreshi-ccw mr-2"></i><lang class="lang_clear_title"> Clear</lang></button>
                            <button type="button" class="btn btn-outline-secondary infobar-settings-reset denom_edit_reset" id="denom_edit_reset" onclick="PosnicPro.denom.resetEditButton(this.id);"><i class="feather icon-refresh-ccw mr-2"></i><lang class="lang_reset_title"> Reset</lang></button>
                           
                            <button type="button" class="btn btn-outline-danger infobar-settings-close infobar_denomcalss" data-id="denomcash"><i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title"> Close</lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="feather icon-save mr-2"></i><span id="denom_text_change"> <lang class="lang_save_title">Save</lang></span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- Tax Tab End -->
