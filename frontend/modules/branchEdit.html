<!-- Branch edit, merged and full-page (user call 2026-08-18): the old Config
     "Branch / Outlet Info" form (moved here wholesale, ids intact so every
     loader keeps working), the branch logo card, and the register editor -
     one page, one save, works for ANY branch of the license. -->
<div class="vertical-layout page_loader" id="branchedit_new" style="display: none">
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-6 col-xl-6">
                    <h4 class="page-title break_title"><lang class="lang_editbranch_title">Edit Branch</lang>
                        &mdash; <span id="be_page_branch_name"></span></h4>
                </div>
            </div>
        </div>
    </div>
    <div class="contentbar">
        <div class="row m-t-5">
            <div class="col-lg-4 col-xl-3">
                <div class="card m-b-30">
                    <div class="card-body">
                        <form enctype="multipart/form-data" method="post" name="setting_image_add"
                            id="setting_image_add">
                            <div class="profilebox py-4 text-center">
                                <div class="button-list">
                                    <input type="file" name="file" id="file" accept=".gif, .jpg, .png, .jpeg, .bmp"
                                        class="inputfile inputfile-1" hidden>
                                    <label for="file" class="btn btn-success-rgba font-18"><i
                                            class="feather icon-edit"></i></label>
                                    <input type="hidden" name="setting_image_value" id="setting_image_value">
                                    <a href="javascript:void(0)" class="btn btn-danger-rgba font-18"
                                        onclick="PosnicPro.settings.removePopupBranchImage()">
                                        <i class="feather icon-trash"></i>
                                    </a>
                                    <input type="hidden" id="setting_logo_value" name="setting_logo_value">
                                    <input type="hidden" id="be_logo_target" name="target_branch_id">
                                </div>
                                <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" id="previewing" class="img-fluid" alt="branch logo">
                                <div class="profilename">
                                    <h5>&nbsp;</h5>
                                </div>
                                <button type="submit" class="btn btn-outline-primary btn-lg btn-block">
                                    <i class="feather icon-save mr-2"></i> <lang class="lang_updatebtn_title">Update</lang>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 col-xl-9">
                <form class="form-validate" method="post" name="setting_add" id="setting_add">
                    <input type="hidden" id="edit_branch_target" name="target_branch_id">
                    <div class="card m-b-30 loader-view-generalsetting">
                        <div class="card-header">
                            <h5 class="card-title mb-0">
                                <lang class="lang_shopinfo">Branch / Outlet Info</lang>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="store_name">
                                        <lang class="lang_storename_title">Name</lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control border-control" name="store_name"
                                        id="store_name" minlength="3" maxlength="250"
                                        placeholder="Enter the store name" autocomplete="off" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="store_email">
                                        <lang class="lang_email_title">Email </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <input type="email" class="form-control border-control"
                                        name="store_email" id="store_email" maxlength="50"
                                        placeholder="Enter the email address" autocomplete="off" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="store_telephone">
                                        <lang class="lang_mobile">Mobile Number </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <input type="tel"
                                        class="form-control border-control allow_phone_validate"
                                        name="store_telephone" id="store_telephone" minlength="3"
                                        maxlength="20" placeholder="Enter the phone number"
                                        autocomplete="off" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="store_alternativephone">
                                        <lang class="lang_mobile">Alternative Number </lang>
                                    </label>
                                    <input type="tel"
                                        class="form-control border-control allow_phone_validate"
                                        name="store_alternativephone" id="store_alternativephone"
                                        minlength="3" maxlength="20" placeholder="Enter the phone number"
                                        autocomplete="off">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-lg-12 col-xl-6">
                                    <label for="store_address">
                                        <lang class="lang_storeadd_title">Address </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <textarea name="store_address"
                                        class="form-control border-control scroll_width" id="store_address"
                                        minlength="3" maxlength="500" placeholder="Enter the store address"
                                        required></textarea>
                                </div>
                                <div class="form-group col-lg-12 col-xl-6">
                                    <label for="printing_address">
                                        <lang class="lang_printadd_title">Printing Address </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <textarea name="printing_address"
                                        class="form-control border-control scroll_width"
                                        id="printing_address" minlength="3" maxlength="500"
                                        placeholder="Enter the print address" required></textarea>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="setting_country">
                                        <lang class="lang_country_title">Country </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <select class="select2 setCountry" name="setting_country"
                                        data-page="setting_country" id="setting_country"
                                        required=""></select>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="setting_state">
                                        <lang class="lang_state_title">State </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <select class="select2 setState" name="setting_state"
                                        data-page="setting_state" id="setting_state" required=""></select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="city">
                                        <lang class="lang_city_title">City </lang>
                                    </label>
                                    <input type="text" class="form-control border-control" name="city"
                                        id="city" maxlength="50" placeholder="Enter the city"
                                        autocomplete="off">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="pincode">
                                        <lang class="lang_pincode_title">Pincode </lang>
                                    </label>
                                    <input type="text" class="form-control border-control" name="pincode"
                                        id="pincode" onkeypress="return PosnicPro.isNumber(event)"
                                        maxlength="15" placeholder="Enter the pincode" autocomplete="off">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="currency_setting">
                                        <lang class="lang_currency_title">Currency </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <select class="select2" name="currency_setting"
                                        id="currency_setting"></select>
                                    <input type="hidden" name="currencyText" id="currencyText">
                                    <input type="hidden" name="currencyTextname" id="currencyTextname">
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="currency_type">
                                        <lang class="lang_choosesize_title">Currency Type</lang>
                                    </label>
                                    <select name="currency_type" id="currency_type"
                                        class="form-control border-control">
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="time_zone">
                                        <lang class="lang_timezone_title">Time Zone </lang> <span
                                            class="text-danger">*</span>
                                    </label>
                                    <select class="select2" name="time_zone" id="time_zone"></select>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="storedate">
                                        <lang class="lang_dateformat_title">Date Format </lang><span
                                            class="text-danger">*</span>
                                    </label>
                                    <select class="select2" data-page="storedate" id="storedate"
                                        name="storedate" required="">
                                        <option name="01/01/2018" value="dd/mm/yyyy" data-id="d/m/Y"
                                            selected>01/01/2018 - dd/mm/yyyy</option>
                                        <option name="2018/01/01" value="yyyy/mm/dd" data-id="Y/m/d">
                                            2018/01/01 - yyyy/mm/dd</option>
                                        <option name="01/01/2018" value="mm/dd/yyyy" data-id="m/d/Y">
                                            01/01/2018 - mm/dd/yyyy</option>
                                        <option name="Sun 01/18" value="D mm/dd" data-id="D m/d">Sun 01/18 -
                                            Day mm/dd</option>
                                        <option name="January 01 2018" value="MM dd yyyy" data-id="M d y">
                                            January 01 2018 - MM dd yyyy</option>
                                        <option name="01 January 18" value="d MM yy" data-id="d M y">01
                                            January 18 - d MM yy</option>
                                        <option name="Thu 01 January 18" value="D d MM yy"
                                            data-id="D d M y">Thu 01 January 18 - Day d MM yy</option>
                                    </select>
                                    <input type="hidden" id="serverdate" name="serverdate">
                                    <input type="hidden" id="dateText" name="dateText">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="website">
                                        <lang class="lang_website_title">Website </lang>
                                    </label>
                                    <input type="text" class="form-control border-control" name="website"
                                        id="website" minlength="3" maxlength="50"
                                        placeholder="Enter the website" autocomplete="off">
                                </div>
                                <div class="form-group col-md-6 branch-gstin-hide-show">
                                    <label for="branch_gstin_number" data-toggle="tooltip"
                                        title="Gstrin number" class="label-text-color">
                                        <lang class="lang_gstr_number">GSTIN Number</lang>
                                    </label>
                                    <input type="text" class="form-control border-control"
                                        name="branch_gstin_number" id="branch_gstin_number" minlength="15"
                                        maxlength="15" placeholder="Enter the GSTIN" autocomplete="off">
                                </div>
                            </div>
                            <div class="form-row">
                                <fieldset class="col-12 form-group border p-3 field-general-setting">
                                    <legend class="w-auto px-2"><lang class="lang_registers_title">Registers</lang></legend>
                                    <div id="be_register_rows"></div>
                                    <button type="button" class="btn btn-sm btn-primary-rgba"
                                        onclick="PosnicPro.branches.beAddRegisterRow('');">
                                        <i class="feather icon-plus mr-1"></i><lang class="lang_addregister_title">Add register</lang>
                                    </button>
                                    <small class="form-text text-muted">Renaming keeps a register's history.
                                        Register names need at least 3 characters.</small>
                                </fieldset>
                            </div>
                        </div>
                        <div class="card-footer text-right">
                            <a href="#/branches" class="btn btn-outline-secondary">
                                <i class="feather icon-arrow-left mr-2"></i><lang class="lang_back_title">Back</lang>
                            </a>
                            <button type="button"
                                class="btn btn-outline-secondary"
                                onclick="PosnicPro.branches.showEdit($('#edit_branch_target').val());"><i
                                    class="feather icon-refresh-ccw mr-2"></i>
                                <lang class="lang_reset_title"> Reset</lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary"><i
                                    class="feather icon-save mr-2"></i>
                                <lang class="lang_save_title">Save</lang>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
