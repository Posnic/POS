<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen screen</title>
<!--
  THE SCREEN ON THE END OF THE CABLE.

  Read at a distance, by somebody moving, often glancing sideways, through
  steam, with a knife in hand. Every decision here follows from that:

    - Light text on a dark ground. Kitchens are lit brightly from above, and
      dark-on-light throws glare straight back at the cook. It also draws less
      attention in peripheral vision when nothing has changed.
    - No interaction. Nothing to click, nothing to scroll. A screen a cook has
      to touch with wet hands is a screen they stop using.
    - Age is carried by POSITION, SIZE and SHAPE as well as colour. Roughly one
      man in twelve cannot separate red from green reliably, and this is
      exactly the audience.
    - Every size comes from the configuration, not from this stylesheet. The
      shop says how far away the cook stands and how big the panel is; the
      arithmetic in kitchen-screen-fit.js says what the font must be. See that
      file for why doubling the distance quarters what fits.
-->
<style>
  :root {
    /* Overwritten at run time from the fit calculation. These are only what
       gets painted in the instant before the configuration is read. */
    --font: 42px;
    --line: 53px;
    --gap: 18px;
    --safe: 3%;

    --ground: #000000;
    --card: #1b1d22;
    --ink: #ffffff;
    --muted: #cbd5e1;
    --rule: #2c3038;

    /* Age. Deliberately not red/green: amber to red, and each step also
       changes the border weight and the bar, so hue is never the only signal. */
    --calm: #4b5563;
    --warm: #d98324;
    --late: #e5484d;
  }

  [data-theme="light"] {
    --ground: #f7f8fa;
    --card: #ffffff;
    --ink: #14171a;
    --muted: #5b6570;
    --rule: #dfe3e8;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: var(--font);
    line-height: 1.25;
    overflow: hidden;
    /* Nothing here is selectable or draggable. It is a sign, not a document. */
    user-select: none;
    cursor: none;
  }

  /* Televisions crop 2 to 5 percent of every edge, so a card at the edge loses
     its border and the bottom row loses its last line. */
  #screen {
    height: 100%;
    padding: var(--safe);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: calc(var(--gap) / 2);
    border-bottom: 2px solid var(--rule);
    color: var(--muted);
    font-size: calc(var(--font) * 0.55);
  }

  #count { color: var(--ink); font-weight: 700; }

  #board {
    flex: 1;
    display: grid;
    gap: var(--gap);
    grid-template-columns: repeat(var(--columns, 4), minmax(0, 1fr));
    align-content: start;
    padding-top: var(--gap);
    min-height: 0;
    overflow-y: auto;
  }

  .ticket {
    background: var(--card);
    border-left: calc(var(--font) * 0.18) solid var(--calm);
    border-radius: calc(var(--font) * 0.12);
    padding: calc(var(--gap) * 0.7);
    display: flex;
    flex-direction: column;
    gap: calc(var(--gap) * 0.25);
    overflow: hidden;
  }

  /* Warm and late also thicken the rule and fill the bar, so the state reads
     without colour vision. */
  .ticket.calm { border-left-color:#4ade80; }
  .ticket.warm { border-left-color: var(--warm); border-left-width: calc(var(--font) * 0.26); }
  .ticket.late { border-left-color: var(--late); border-left-width: calc(var(--font) * 0.34); }
  /* Old active tickets still need to be read across the kitchen. */
  .ticket.grey { opacity: 1; }
  .ticket.urgent { border-left: calc(var(--font) * 0.34) solid var(--late); }
  .ticket.urgent .age { color: var(--late); font-weight: 800; }
  .ticket.urgent .bar > i { background: var(--late); }
  .delay-label { font-size: .55em; font-weight: 800; color: var(--warm); }
  .late .delay-label, .urgent .delay-label { color: var(--late); }
  .urgent .delay-label.pulse { animation: urgency-pulse 2s ease-in-out infinite; }
  @keyframes urgency-pulse { 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .urgent .delay-label.pulse { animation: none; } }
  .ticket.table-only { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:0; border:4px solid #4ade80; background:#14532d; color:#fff; }
  .ticket.table-only.warm { border-color:#fb923c; background:#7c2d12; }
  .ticket.table-only.late, .ticket.table-only.urgent { border-color:#f87171; background:#7f1d1d; }
  .table-icon { width:1.6em; height:1.6em; flex-shrink:0; }
  .table-only .table { text-align:center; max-width:100%; }
  .ticket.urgent.pulse { animation:table-alert 2s ease-in-out infinite; }
  @keyframes table-alert { 50% { box-shadow:inset 0 0 0 5px #fca5a5; } }
  @media (prefers-reduced-motion:reduce) { .ticket.urgent.pulse { animation:none; } }
  .top { flex-wrap: wrap; }
  .table { overflow-wrap: anywhere; min-width: 0; }


  .top { display: flex; align-items: baseline; justify-content: space-between; gap: var(--gap); }

  /* The table number is the thing being matched, so it is the biggest thing
     on the card. A cook finds the ticket by table, not by dish. */
  .table { font-size: calc(var(--font) * 1.55); font-weight: 800; letter-spacing: -0.01em; }

  .age { font-size: calc(var(--font) * 0.78); color: var(--muted); font-variant-numeric: tabular-nums; }
  .ticket.warm .age { color: var(--warm); font-weight: 700; }
  .ticket.late .age { color: var(--late); font-weight: 800; }

  .bar { height: calc(var(--font) * 0.14); background: var(--rule); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--calm); }
  .ticket.warm .bar > i { background: var(--warm); }
  .ticket.late .bar > i { background: var(--late); }

  .items { display: flex; flex-direction: column; gap: calc(var(--gap) * 0.15); }
  .preparation-amount { font-weight: 800; color: #fff; }
  .item { display: flex; gap: calc(var(--gap) * 0.5); align-items: baseline; }
  .qty { font-weight: 800; min-width: 2.1em; font-variant-numeric: tabular-nums; }
  .name { flex: 1; overflow-wrap: anywhere; font-weight: 700; }
  .name { min-width: 0; }
  .ticket { min-width: 0; }
  .item-progress { display: flex; flex-wrap: wrap; gap: .35em; margin: .15em 0 .45em; font-size: .6em; font-weight: 750; }
  .item-progress span { padding: .15em .45em; border-radius: .3em; }
  .progress-cooking { color: #fff; background: #374151; }
  .progress-ready { color: #d8ffe7; background: #14532d; }
  .progress-picked { color: #dceeff; background: #173b65; }
  .item.line-ready { color: #b3ffd0; }
  .item.line-picked { color: #b9dcff; }
  .ticket.ready-state { border-left-color: #4ade80; }
  .ticket.ready-state .age { color: #b3ffd0; }
  .ticket.ready-state .bar > i { background: #4ade80; }
  .ticket.cancelled { border-color: #ff737b; background: #321418; color: #fff; }
  .ticket.cancelled .item { text-decoration: line-through; text-decoration-thickness: 3px; }
  .cancellation-label { color: #ffb4b9; font-weight: 800; font-size: .7em; }
  .ticket.cancelled.cancel-pulse { animation: cancel-pulse 2s ease-in-out infinite; }
  @keyframes cancel-pulse { 50% { box-shadow: inset 0 0 0 4px #ff737b; } }
  @media (prefers-reduced-motion: reduce) { .ticket.cancelled.cancel-pulse { animation: none; } }
  html[data-glow="true"]:not([data-theme="light"]) .name,
  html[data-glow="true"]:not([data-theme="light"]) .qty,
  html[data-glow="true"]:not([data-theme="light"]) .table {
    text-shadow: 0 0 2px rgba(255,255,255,.35);
  }

  /* A note is the line that costs money when missed. Never dimmed, never
     dropped when space runs short. */
  .note {
    color: var(--warm);
    font-size: calc(var(--font) * 0.8);
    font-weight: 700;
    padding-left: 2.6em;
  }

  .more { color: var(--muted); font-size: calc(var(--font) * 0.75); }

  .ticket.compact .items, .ticket.compact .bar { display: none; }
  .ticket.compact .count { font-size: calc(var(--font) * 0.8); color: var(--muted); }

  #empty {
    flex: 1;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: calc(var(--font) * 0.8);
    text-align: center;
  }

  #pager { color: var(--muted); font-size: calc(var(--font) * 0.5); }

  /* The setup banner. Shown only while the screen is being placed, so somebody
     standing in the kitchen can read the verdict from where the cook stands -
     which is the only place the question can actually be answered. */
  #setup {
    border: 2px dashed var(--rule);
    border-radius: calc(var(--font) * 0.12);
    padding: calc(var(--gap) * 0.6);
    margin-bottom: var(--gap);
    color: var(--muted);
    font-size: calc(var(--font) * 0.5);
  }
  #setup b { color: var(--ink); }
  #setup.bad { border-color: var(--late); }
.allergy{font-weight:800;color:#8d2800;background:#fff0d6;padding:6px;border:2px solid currentColor;border-radius:5px}
</style>
</head>
<body>
  <div id="screen">
    <div id="setup" hidden></div>
    <header>
      <span id="title">Kitchen</span>
      <span><span id="count">0</span> <span id="word">orders</span></span>
      <span id="pager"></span>
      <div id="wall-clock" style="margin-left:auto;text-align:right;white-space:nowrap;color:var(--ink)"><time id="current-time"></time><div id="current-date" style="font-size:.7em;color:var(--muted)"></div></div>
    </header>
    <div id="connection" role="status" style="font-size:0.55em;padding-top:8px">Connecting to kitchen orders...</div>
    <div id="board"></div>
    <div id="empty" hidden>Nothing cooking.</div>
  </div>

<script>
/*
 * The page reads its own configuration and re-reads it when it changes, so a
 * shop adjusting the font or the distance sees the effect immediately instead
 * of being told to restart the till.
 */
(function () {
  'use strict';

  var displayId = new URLSearchParams(location.search).get('display') || '';
  var config = null;
  var tickets = [];
  var page = 0;
  var cancellationSeen = new Map();
  var cancellationExpiry = new Map();

  function cancelledSeconds() {
    var seconds = Number((config || {}).cancelledDisplaySeconds);
    return Number.isFinite(seconds) && seconds > 0 ? Math.max(1, Math.min(300, seconds)) : 30;
  }
  var rotationTimer = null;
  var rotationMs = 0;

  function updateRotation() {
    var seconds = Number((config || {}).pageDwellSeconds);
    var nextMs = (Number.isFinite(seconds) && seconds > 0 ? Math.max(1, Math.min(300, seconds)) : 8) * 1000;
    if (rotationTimer !== null && rotationMs === nextMs) return;
    if (rotationTimer !== null) clearInterval(rotationTimer);
    rotationMs = nextMs;
    rotationTimer = setInterval(function () {
      page += 1;
      render();
    }, rotationMs);
  }

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------------------------------------------------------- sizing */

  /*
   * Every size on the screen comes from here.
   *
   * The main process does the optics (kitchen-screen-fit.js) because it knows
   * the panel's physical size; the page is told the answer. Doing it here from
   * pixels alone is exactly the mistake that produces a screen nobody can read:
   * pixels say nothing about how big a letter is on the eye.
   */
  function applyFit(fit, cfg) {
    if (!fit) return;
    var root = document.documentElement.style;
    root.setProperty('--font', fit.fontPx + 'px');
    root.setProperty('--line', fit.lineHeightPx + 'px');
    root.setProperty('--columns', Math.max(1, fit.columns));
    root.setProperty('--safe', (cfg && cfg.safeAreaPercent != null ? cfg.safeAreaPercent : 3) + '%');
    document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'dark');
    document.documentElement.setAttribute('data-glow', String(!!(cfg && cfg.textGlow)));
  }

  /* ---------------------------------------------------------------- render */

  function minutesSince(iso) {
    var t = Date.parse(iso);
    if (!isFinite(t)) return 0;
    return Math.max(0, Math.floor((Date.now() - t) / 60000));
  }

  function stateFor(mins, cfg) {
    var amber = Math.max(1, Number(cfg.amberAfterMin) || 5);
    var red = Math.max(amber, Number(cfg.redAfterMin) || 10);
    var urgent = Math.max(red, Number(cfg.pulseAfterMin) || 15);
    if (mins >= urgent) return 'urgent';
    if (mins >= red) return 'late';
    if (mins >= amber) return 'warm';
    return 'calm';
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(ticket, cfg, compact) {
    if (ticket.cancelled) {
      var cancelledCard = el('div', 'ticket cancelled' + (cfg.cancelledPulse !== false ? ' cancel-pulse' : ''));
      cancelledCard.appendChild(el('div', 'cancellation-label', 'CANCELLED — do not prepare'));
      if (ticket.table) cancelledCard.appendChild(el('div', 'table', ticket.table));
      (ticket.items || []).forEach(function (item) {
        var cancelledRow = el('div', 'item');
        cancelledRow.appendChild(el('span', 'qty', item.qty + '×'));
        cancelledRow.appendChild(el('span', 'name', item.name || ''));
        cancelledCard.appendChild(cancelledRow);
      });
      return cancelledCard;
    }
    var mins = minutesSince(ticket.placedAt);
    var state = stateFor(mins, cfg);
    var complete = (ticket.items || []).length > 0 && ticket.items.every(function (i) { return i.preparing === 0; });
    if (complete) state = 'ready-state';
    var node = el('div', 'ticket ' + state + (compact ? ' compact' : ''));

    if (cfg.tableOnly) {
      node.classList.add('table-only');
      if (cfg.pulseAlerts !== false) node.classList.add('pulse');
      var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 48 48');
      icon.setAttribute('class', 'table-icon');
      icon.setAttribute('aria-hidden', 'true');
      var shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      shape.setAttribute('d', 'M8 18h32v8H8zM12 26v14m24-14v14M16 8h16v6H16z');
      shape.setAttribute('fill', 'none');
      shape.setAttribute('stroke', 'currentColor');
      shape.setAttribute('stroke-width', '4');
      shape.setAttribute('stroke-linejoin', 'round');
      icon.appendChild(shape);
      node.appendChild(icon);
      node.appendChild(el('span', 'table', ticket.table || ''));
      node.setAttribute('aria-label', (ticket.table || '') + ', ' + state);
      return node;
    }

    var top = el('div', 'top');
    if (cfg.showTable !== false && String(ticket.table || '').trim()) {
      var heading = el('span', 'table');
      var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 48 48');
      icon.setAttribute('aria-hidden', 'true');
      icon.style.cssText = 'width:.7em;height:.7em;margin-right:.25em';
      var shape = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      shape.setAttribute('d', 'M8 18h32v8H8zM12 26v14m24-14v14M16 8h16v6H16z');
      shape.setAttribute('fill', 'none');
      shape.setAttribute('stroke', 'currentColor');
      shape.setAttribute('stroke-width', '4');
      icon.appendChild(shape);
      heading.appendChild(icon);
      heading.appendChild(document.createTextNode(ticket.table || ''));
      top.appendChild(heading);
    }
    if (cfg.showAge !== false) {
      top.appendChild(el('span', 'age', mins < 60 ? mins + 'm' : Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm'));
    }
    node.appendChild(top);
    if (complete) node.appendChild(el('div', 'item-progress', ticket.items.some(function (i) { return i.readyToCollect > 0; }) ? '✓ Ready to collect' : '↗ Picked up'));
    var arrived = new Date(ticket.placedAt);
    if (isFinite(arrived.getTime())) {
      var arrival = el('div', 'arrival', arrived.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true}));
      arrival.style.cssText = 'font-size:.55em;color:var(--muted)';
      node.appendChild(arrival);
    }
    if (state === 'urgent' && cfg.pulseAlerts !== false) node.classList.add('pulse');

    if (compact) {
      var n = (ticket.items || []).reduce(function (s, i) { return s + (Number(i.qty) || 1); }, 0);
      node.appendChild(el('div', 'count', n + (n === 1 ? ' item' : ' items')));
      return node;
    }

    /* The bar repeats the age as a shape, so the state survives a cook who
       cannot separate the hues. */
    var bar = el('div', 'bar');
    var fillPct = Math.min(100, (mins / Math.max(1, cfg.redAfterMin || 10)) * 100);
    var fill = el('i');
    fill.style.width = fillPct + '%';
    bar.appendChild(fill);
    node.appendChild(bar);

    if (cfg.showItems !== false) {
      var list = el('div', 'items');
      var max = Number(cfg.maxItemsPerCard) || 3;
      (ticket.items || []).slice(0, max).forEach(function (item) {
        var row = el('div', 'item');
        if (item.preparing === 0) row.classList.add(item.readyToCollect > 0 ? 'line-ready' : 'line-picked');
        row.appendChild(el('span', 'qty', (item.qty || 1) + '×'));
        row.appendChild(el('span', 'name', item.name || ''));
        list.appendChild(row);
        var progress = el('div', 'item-progress');
        var cooking = item.preparing == null ? Number(item.qty) || 1 : item.preparing;
        if (cooking > 0) progress.appendChild(el('span', 'progress-cooking', cooking + (item.started ? ' Cooking' : ' To prepare')));
        if (item.readyToCollect > 0) progress.appendChild(el('span', 'progress-ready', '✓ ' + item.readyToCollect + ' Ready to collect'));
        if (item.pickedUp > 0) progress.appendChild(el('span', 'progress-picked', '↗ ' + item.pickedUp + ' Picked up'));
        list.appendChild(progress);
        if (Number.isFinite(Number(item.priced_at_table)) && Number(item.priced_at_table) > 0) {
          list.appendChild(el('div', 'note preparation-amount', 'Amount: ' + Number(item.priced_at_table).toLocaleString(undefined, { maximumFractionDigits: 3 }) + ' each'));
        }
        /* NEVER dropped to save space. "less spicy" is the line that costs a
           plate of food when it is missed. */
        if (item.seat || item.course) list.appendChild(el('div', 'note', [item.seat ? 'Seat ' + item.seat : '', item.course || ''].filter(Boolean).join(' · ')));
        var allergies = (item.allergies || []).concat(item.allergy_note || '').filter(Boolean);
        if (allergies.length) list.appendChild(el('div', 'allergy', 'ALLERGY: ' + allergies.join(', ')));
        if (item.note && cfg.showItemNotes !== false) {
          list.appendChild(el('div', 'note', item.note));
        }
      });
      var rest = (ticket.items || []).length - max;
      if (rest > 0) list.appendChild(el('div', 'more', '+' + rest + ' more'));
      node.appendChild(list);
    }

    return node;
  }

  function updateClock() {
    var now = new Date();
    $('current-time').textContent = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
    $('current-time').dateTime = now.toISOString();
    $('current-date').textContent = now.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
  }
  updateClock();
  setInterval(updateClock, 1000);

  function render() {
    var cfg = config || {};
    var fitInfo = cfg._fit || {};
    var board = $('board');
    board.textContent = '';

    function compareArrival(a, b, newest) {
      var left = Date.parse(a.placedAt), right = Date.parse(b.placedAt);
      if (!Number.isFinite(left)) return Number.isFinite(right) ? 1 : 0;
      if (!Number.isFinite(right)) return -1;
      return newest ? right - left : left - right;
    }
    // Group tables by their oldest waiting ticket, regardless of display order.
    var cancelled = tickets.filter(function (t) { return t.cancelled && cancellationExpiry.get(t.id) > Date.now(); });
    var live = tickets.filter(function (t) { return !t.cancelled; }).sort(function (a, b) { return compareArrival(a, b, false); });

    if (cfg.tableOnly) {
      var seenTables = new Set();
      live = live.filter(function(ticket) {
        if (!ticket.table) return true;
        var key = String(ticket.table).trim();
        if (seenTables.has(key)) return false;
        seenTables.add(key);
        return true;
      });
    }
    if (cfg.orderSort === 'newest') live.sort(function (a, b) { return compareArrival(a, b, true); });
    $('count').textContent = live.length;
    $('word').textContent = cfg.tableOnly ? (live.length === 1 ? 'table' : 'tables') : (live.length === 1 ? 'order' : 'orders');
    $('empty').hidden = live.length > 0 || cancelled.length > 0 || !!cfg._feedStatus;
    board.hidden = live.length === 0 && cancelled.length === 0;
    live = cancelled.concat(live);

    // Rotate every dish into view instead of permanently hiding it under +more.
    var maxItems = Math.max(1, Number(cfg.maxItemsPerCard) || 3);
    live = live.flatMap(function (ticket) {
      if (cfg.tableOnly && !ticket.cancelled) return [ticket];
      var parts = [];
      var items = ticket.items || [];
      for (var offset = 0; offset < items.length; offset += maxItems) {
        parts.push(Object.assign({}, ticket, {items: items.slice(offset, offset + maxItems)}));
      }
      return parts.length ? parts : [ticket];
    });
    var compact = cfg.showItems === false && live.length > (Number(cfg.compactAfter) || 8);
    var font = Math.max(24, Math.min(Number(fitInfo.fontPx) || 40, (window.innerWidth || 1100) / 18));
    var customFont = Number(cfg.fontSizePx);
    if (Number.isFinite(customFont) && customFont > 0) font = Math.max(24, Math.min(96, customFont));
    document.documentElement.style.setProperty('--font', font + 'px');
    var width = board.clientWidth || window.innerWidth || 1100;
    var ceiling = Math.max(1, Math.min(Number(fitInfo.columns) || 4, Math.floor(width / (font * (cfg.tableOnly ? 7 : 12)))));
    var height = board.clientHeight || window.innerHeight || 700;
    var portraitColumns = Number(cfg.portraitColumns);
    var fixedColumns = window.innerHeight > window.innerWidth && (portraitColumns === 1 || portraitColumns === 2);
    if (fixedColumns) ceiling = portraitColumns;
    var rows = Math.max(1, Math.floor(height / (font * (cfg.tableOnly ? 6 : maxItems * 2 + 4))));
    var perPage = Math.max(1, ceiling * rows);
    if (cfg.tableOnly) {
      // Size from both dimensions, not a monitor's saved orientation or dish layout.
      if (!fixedColumns) ceiling = Math.max(1, Math.floor(width / Math.max(220, font * 6)));
      rows = Math.max(1, Math.floor(height / Math.max(190, font * 5)));
      perPage = ceiling * rows;
    }
    var pages = Math.max(1, Math.ceil(live.length / perPage));
    if (page >= pages) page = 0;

    /*
     * Paging, done so it cannot hide an order.
     *
     * The oldest always occupy the first slots and never rotate; only the
     * overflow pages. And the pager is always visible, so an empty-looking
     * screen is never mistaken for an empty kitchen.
     */
    var shown = pages > 1 ? live.slice(page * perPage, page * perPage + perPage) : live;
    shown.forEach(function (t) { board.appendChild(card(t, cfg, compact)); });

    /*
     * A QUIET KITCHEN GETS WIDE CARDS.
     *
     * The grid was a fixed number of columns however many orders were on it,
     * so one order sat in a quarter-width card: "Chicken Tikka 1 plate"
     * wrapped onto three lines, and the card clips what it cannot fit, so the
     * third dish disappeared off the bottom. The owner photographed exactly
     * that - a single ticket, its own items cut off, on an otherwise empty
     * screen.
     *
     * The fit gives the MOST columns this screen can carry at a readable
     * size; it is a ceiling, not a quota. With fewer orders than that, the
     * cards spread into the room they already have and the names fit on one
     * line. The moment the kitchen fills up the ceiling applies again and
     * nothing about the busy case changes.
     */

    var columns = ceiling;
    board.style.gridTemplateRows = '';
    board.style.alignContent = 'start';
    board.style.removeProperty('font-size');
    if (cfg.tableOnly && shown.length) {
      var best = Infinity, tileRows = 1;
      for (var c = fixedColumns ? ceiling : 1; c <= (fixedColumns ? ceiling : Math.min(ceiling, shown.length)); c++) {
        var r = Math.ceil(shown.length / c);
        if (r > rows) continue;
        var score = Math.abs(Math.log((width / c) / (height / r) / 1.2)) + (c * r - shown.length) * .15;
        if (score < best) { best = score; columns = c; tileRows = r; }
      }
      board.style.gridTemplateRows = 'repeat(' + tileRows + ', minmax(0, 1fr))';
      board.style.alignContent = 'stretch';
      var tileFont = Math.max(24, Math.min(96, (width / columns - 36) / 5, (height / tileRows - 40) / 4.5));
      if (customFont > 0 && Number.isFinite(customFont)) tileFont = font;
      board.style.fontSize = tileFont + 'px';
      board.style.setProperty('--font', tileFont + 'px');
    } else {
      board.style.removeProperty('--font');
    }
    board.style.setProperty('--columns', String(columns));

    $('pager').textContent = pages > 1 ? (page + 1) + ' of ' + pages : '';
  }

  /* ------------------------------------------------------------------ data */

  function setConfig(cfg) {
    if (config && cfg && config.branchId !== cfg.branchId) {
      cancellationSeen.clear(); cancellationExpiry.clear(); tickets = [];
    }
    if (((config || {}).orderSort || 'oldest') !== ((cfg || {}).orderSort || 'oldest')) page = 0;
    config = cfg || {};
    cancellationSeen.forEach(function (at, id) { cancellationExpiry.set(id, at + cancelledSeconds() * 1000); });
    updateRotation();
    $('connection').textContent = config.setupMode ? 'Preview - sample orders' : (config._feedStatus || '');
    applyFit(config._fit, config);
    $('title').textContent = config.name || 'Kitchen';

    /*
     * While the screen is being placed, say what it can and cannot do - here,
     * on the screen itself, where somebody standing at the range can read it.
     * A verdict shown only on the till is a verdict read in the wrong room.
     */
    var setup = $('setup');
    if (config.setupMode && config._fit) {
      var f = config._fit;
      setup.hidden = false;
      setup.className = f.verdict === 'comfortable' ? '' : 'bad';
      setup.innerHTML =
        'Placing this screen. At <b>' + (config.viewingDistanceM || '?') + ' m</b> on a <b>' +
        (config.diagonalInches || '?') + '&Prime;</b> panel, text is <b>' + f.capHeightMm +
        ' mm</b> tall and <b>' + f.cards + '</b> order' + (f.cards === 1 ? '' : 's') +
        ' fit (' + f.verdict + ').<br>If you cannot read the card below from where the cook ' +
        'stands, the screen is too small or too far.';
    } else {
      setup.hidden = true;
    }
    render();
  }

  function setTickets(list) {
    tickets = Array.isArray(list) ? list : [];
    var now = Date.now(), newCancellation = false;
    tickets.forEach(function (ticket) {
      if (!ticket.cancelled || cancellationSeen.has(ticket.id)) return;
      cancellationSeen.set(ticket.id, now);
      cancellationExpiry.set(ticket.id, now + cancelledSeconds() * 1000);
      newCancellation = true;
    });
    var present = new Set(tickets.map(function (t) { return t.id; }));
    cancellationSeen.forEach(function (at, id) {
      if (!present.has(id) && now - at > 300000) { cancellationSeen.delete(id); cancellationExpiry.delete(id); }
    });
    if (newCancellation) page = 0;
    render();
  }

  /* Exposed so the main process can drive the screen, and so a test can. */
  window.kitchenScreen = { setConfig: setConfig, setTickets: setTickets, render: render };

  if (window.posnicKitchenScreen && window.posnicKitchenScreen.onConfig) {
    window.posnicKitchenScreen.onConfig(setConfig);
    window.posnicKitchenScreen.onTickets(setTickets);
    window.posnicKitchenScreen.ready(displayId).catch(function () {
      $('connection').textContent = 'Kitchen display could not connect. Close and reopen it in Hardware Manager.';
    });
  }

  /* The clock moves even when nothing arrives, and a ticket going from amber
     to red is the whole point of the colour. */
  setInterval(render, 15000);
  setInterval(function () {
    var expired = false;
    cancellationExpiry.forEach(function (at, id) {
      if (at > 0 && at <= Date.now()) { cancellationExpiry.set(id, 0); expired = true; }
    });
    if (expired) render();
  }, 250);
  window.addEventListener('resize', render);

  /* Page rotation, only ever reached when there is more than one page. */
  updateRotation();
}());
</script>
</body>
</html>
