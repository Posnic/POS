<div class="vertical-layout page_loader" id="lowstockitems" style="display: none">
    <!-- Low Stock, built to LIST_PAGE_UX_STANDARD.md: a read-only watchlist.
         A row click opens the ITEM's dossier (#/items/<id>); the Restock
         button jumps straight into a new purchase with the item and its
         supplier already on the form. -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0"><lang class="lang_lowstockdetail_title">Low Stock</lang></h4>
                </div>
                <div class="col">
                    <div class="lf-panel" id="lowstockitems_filter_panel" style="display:none;"></div>
                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar" id="lowstockitems_controls">
                        <button type="button" class="btn btn-primary-rgba" onclick="PosnicPro.lowstockitems.exportCsv();"
                            data-toggle="tooltip" title="Export the filtered rows" aria-label="Export CSV">
                            <i class="feather icon-share"></i>
                        </button>
                        <button type="button" class="btn btn-primary-rgba lf-btn" id="lowstockitems_filter_btn"
                            data-toggle="tooltip" title="Filter low stock">
                            <i class="feather icon-filter mr-2"></i>Filter
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="contentbar">
        <div class="card m-b-30 md-rail" id="lowstockitems_list_card">
            <div class="card-body">
                <div id="lowstockitems_list_rows" class="md-rail-rows text-muted">Loading low stock ...</div>
                <div class="q-pager" id="lowstockitems_list_paging"></div>
            </div>
        </div>
    </div>
</div>
