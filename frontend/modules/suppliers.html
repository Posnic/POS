<div class="vertical-layout page_loader" id="suppliers" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title break_title"> <lang class="lang_supply_title">Supplier List</lang></h4>
                </div>               
                <div class="col-md-8 col-lg-8 show-button-action"></div>                  
                <div class="col-lg-3 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_suppliers_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_suppliers_fields" data-id="suppliers" onchange="PosnicPro.changePlaceholder(this)">
                        <option value="name" selected>
                        <lang class="lang_name_title">Name</lang>
                        </option>
                        <option value="phone">
                        <lang class="lang_phone_title">Phone</lang>
                        </option>
                        <option value="email">
                        <lang class="lang_email_title">Email</lang>
                        </option>
                        <option value="address">
                        <lang class="lang_address_title">Address</lang>
                        </option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_suppliers_input"
                           placeholder="Enter Name" data-id="suppliers" maxlength="25"  autocomplete="off">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 adjuce_left tb_search hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="suppliers" onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="suppliers" onclick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left add_new_tooltip" data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                        <a data-module="supplier" data-access="write" href='#/suppliers/new' onClick="PosnicPro.suppliers.addSupplierButton();" class="btn btn-primary-rgba dash_sale_count add_new_tooltip" data-toggle="tooltip" title="New Supplier">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>                       
                    </div>
                </div>                        
            </div> 
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 mobile-hide tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;">
                            <span class="view_suppliers_date_filter_value"></span>
                        </span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;">
                            <span class="view_suppliers_filter_value"></span>
                        </span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header supplier_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_suppliers_per_page" data-id="suppliers" onChange="PosnicPro.setPerPage(this, 'Table');">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item email_320">
                                                <a data-module="supplier" data-access="write" href="#/suppliers" id="supplier_import" class="sale_color" onclick="PosnicPro.importTableFile('suppliers');" data-toggle="tooltip" title="Import">
                                                    <i class="feather icon-download font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item email_320">
                                                <a data-module="supplier" data-access="read" href="#/suppliers" id="suppliers_exportbtn" class="sale_color" onClick="PosnicPro.suppliers.exportSuppliers();" data-toggle="tooltip" title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item email_320">
                                                <a data-module="supplier" data-access="delete" href="#/suppliers" id="suppliers_deletebtn" class="sale_color" onclick="PosnicPro.suppliers.deleteSelectedSuppliers();" data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item email_320">
                                                <a href="javascript:PosnicPro.refreshDatatable('suppliers')" class="add_new_tooltip" data-id="suppliers" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-supplier">
                        <div class="table-responsive">
                            <table class="table table-borderless" id="view_suppliers">
                                <div class="col-sm-6 col-md-12 col-lg-12 text-center" id="supplier_img_hide" style="display:none; padding:56px 20px;">
                                    <!--
                                        Nothing here yet.

                                        This used to be a 200px download icon labelled "Import CSV" and
                                        nothing else, so an empty list looked like a page that had failed
                                        to load, and the only thing on offer was a bulk import to somebody
                                        who almost certainly wanted to add one record. The primary action
                                        is now the obvious one, with the import kept as the quieter second
                                        option it should always have been.
                                    -->
                                    <i class="feather icon-inbox" style="font-size:56px; opacity:.25;"></i>
                                    <p style="margin:14px 0 4px; font-size:16px; font-weight:600;">No suppliers yet</p>
                                    <p class="text-muted" style="margin:0 0 18px; font-size:13px;">
                                        Add your first supplier with the New button above.
                                    </p>
                                    <a data-module="supplier" data-access="write" href="javascript:void(0)"
                                       class="sale_color" style="font-size:13px;" onclick="PosnicPro.importTableFile('suppliers');">
                                        or import suppliers from a CSV file
                                    </a>
                                </div>
                                <div class="supplier_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                <thead class="datatable-thead-tbody table-header supplier_header"></thead>
                                <tbody class="datatable-thead-tbody table-body supplier_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 supplier_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_suppliers_page_total"></span></b>
                                    to 
                                    <b><span id="view_suppliers_page_perpage_total"></span></b> 
                                    of 
                                    <b><span id="view_suppliers_total"></span></b>
                                    entries 
                                    <span class="showing-hide-show-suppliers" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-suppliers"> 0 </span>&nbsp; 
                                        rows selected 
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="suppliers" onclick="PosnicPro.previousPage(this, 'Table')"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="suppliers" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->
