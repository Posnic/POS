        <!--
            The shop's theme, before the first paint.

            themeManager applies it too, but it runs after five scripts and a
            stylesheet have loaded - long enough that a dark till flashed the
            default light theme on every navigation. The attribute is all the
            CSS needs, and it is one synchronous read of a value that is
            already on this machine.

            Deliberately does nothing but set an attribute. themeManager
            remains the only thing that decides what a theme means; this only
            stops the wrong one being visible while it gets there.
        -->
        <script>
            (function () {
                try {
                    var saved = JSON.parse(localStorage.getItem('posnic_theme_settings') || '{}');
                    if (saved && saved.preset && saved.preset !== 'default' && saved.preset !== 'custom') {
                        document.documentElement.setAttribute('data-theme', saved.preset);
                    }
                } catch (e) { /* the app applies it a moment later */ }
            }());
        </script>

        <!--
            Cover the till before it draws anything.

            The lock used to go up after the page had loaded, so whoever picked
            the machine up saw the dashboard - takings, customer names, the last
            sale - for as long as the scripts took to run, and only then got
            asked who they were. A lock you can read behind is not a lock.

            This runs first, before any stylesheet or script, and decides from
            localStorage alone: no network, no IPC, nothing to wait for. It is
            deliberately pessimistic - it hides on what it knew last time and
            lets lock-screen.js uncover once it has decided properly.

            The timeout is the important part. If lock-screen.js never runs -
            an error, a missing file, a shop that turned the lock off on
            another machine - the cover comes off by itself. A till that will
            not draw is worse than one that draws too early.
        -->
        <script>
            (function () {
                if (navigator.userAgent.indexOf('Electron') === -1) return;
                try {
                    var settings = JSON.parse(localStorage.getItem('general_settings') || '{}');
                    if (settings.till_lock_enable !== true) return;
                    if (localStorage.getItem('lock.enrolled') !== 'yes') return;
                } catch (e) {
                    return;
                }
                document.documentElement.className += ' lock-pending';
                var style = document.createElement('style');
                style.id = 'lock_pending_style';
                style.textContent =
                    'html.lock-pending body > *:not(#posnic-lock){visibility:hidden !important;}'
                    + 'html.lock-pending{background:#101725;}';
                document.head.appendChild(style);
                window.__posnicUncover = function () {
                    document.documentElement.className =
                        document.documentElement.className.replace(/\s*lock-pending\b/, '');
                };
                setTimeout(window.__posnicUncover, 5000);
            }());
        </script>

        <script>
            // Desktop tools quick-access (Electron only). Same actions as the
            // File menu and tray - this is the discoverable, in-app door.
            (function () {
                if (!window.electronAPI || !window.electronAPI.desktop) return;
                const style = document.createElement('style');
                // Colors ride the app's theme variables (Config -> Appearance)
                // with brand-blue fallbacks for pages without a theme.
                style.textContent =
                    '#posnic-desktop-fab{position:fixed;bottom:18px;right:18px;z-index:99990;font-family:inherit}' +
                    '#posnic-desktop-fab .fab-btn{background:var(--theme-primary-color,#3D85C6);' +
                    'color:var(--theme-btn-primary-text,#fff);border:none;border-radius:24px;' +
                    'height:46px;min-width:46px;padding:0 14px;display:flex;align-items:center;justify-content:center;' +
                    'font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}' +
                    '#posnic-desktop-fab .fab-label{max-width:0;overflow:hidden;white-space:nowrap;' +
                    'transition:max-width .25s ease,margin-left .25s ease;margin-left:0}' +
                    '#posnic-desktop-fab:hover .fab-label,#posnic-desktop-fab.open .fab-label{max-width:70px;margin-left:8px}' +
                    '#posnic-desktop-fab .fab-btn:hover{background:var(--theme-primary-hover,var(--theme-primary-color,#2F6EA8))}' +
                    '#posnic-desktop-fab .fab-menu{display:none;position:absolute;bottom:48px;right:0;' +
                    'background:var(--theme-card-bg,#fff);border:1px solid var(--theme-border-color,#e6e6e6);' +
                    'border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden;min-width:190px}' +
                    '#posnic-desktop-fab.open .fab-menu{display:block}' +
                    '#posnic-desktop-fab .fab-menu button{display:block;width:100%;text-align:left;background:none;' +
                    'border:none;padding:11px 16px;font-size:13px;color:var(--theme-menu-text,#333);cursor:pointer}' +
                    '#posnic-desktop-fab .fab-menu button:hover{background:var(--theme-menu-active-bg,#f0f2ff);' +
                    'color:var(--theme-menu-active-text,inherit)}';
                document.head.appendChild(style);

                const fab = document.createElement('div');
                fab.id = 'posnic-desktop-fab';
                fab.innerHTML = '<div class="fab-menu"></div><button class="fab-btn" title="Desktop tools">🖥️<span class="fab-label">Desktop</span><span id="posnic-sync-dot"></span></button>';
                document.body.appendChild(fab);

                const dotStyle = document.createElement('style');
                dotStyle.textContent =
                    '#posnic-sync-dot{display:none;width:9px;height:9px;border-radius:50%;margin-left:8px;' +
                    'vertical-align:middle;display:inline-block}' +
                    '#posnic-sync-dot.on{background:#4ade80;box-shadow:0 0 5px #4ade80}' +
                    '#posnic-sync-dot.off{background:#f87171;box-shadow:0 0 5px #f87171}' +
                    '#posnic-sync-dot.none{display:none}';
                document.head.appendChild(dotStyle);

                // Live cloud sync indicator on the button (only when activated)
                const syncDot = fab.querySelector('#posnic-sync-dot');
                const refreshSyncDot = async () => {
                    try {
                        const status = await window.electronAPI.cloud.status();
                        if (!status.connected) { syncDot.className = 'none'; return; }
                        syncDot.className = status.sync && status.sync.online ? 'on' : 'off';
                    } catch (e) { syncDot.className = 'none'; }
                };
                refreshSyncDot();
                setInterval(refreshSyncDot, 30000);

                const menu = fab.querySelector('.fab-menu');
                const addItem = (label, target) => {
                    const b = document.createElement('button');
                    b.textContent = label;
                    b.addEventListener('click', () => {
                        fab.classList.remove('open');
                        window.electronAPI.desktop.open(target);
                    });
                    menu.appendChild(b);
                };

                window.electronAPI.desktop.capabilities().then((caps) => {
                    addItem('🖨️ Hardware Manager', 'hardware');
                    if (caps.backup) addItem('💾 Backup Manager', 'backup');
                    addItem('🔄 Software Update', 'update');
                    addItem('☁️ Cloud Sync', 'cloud');
                }).catch(() => {});

                fab.querySelector('.fab-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    fab.classList.toggle('open');
                });
                document.addEventListener('click', () => fab.classList.remove('open'));

                // --- Tray branch switching ---------------------------------
                // Mirror the header's branch dropdown into the tray menu, and
                // run the app's own switch flow (incl. open-register guard)
                // when a branch is picked from the tray.
                if (window.electronAPI.tray) {
                    const harvestBranches = () => {
                        const items = document.querySelectorAll('#change_branch_list a[data-id]');
                        if (!items.length) return;
                        const branches = Array.from(items).map((a) => ({
                            id: a.getAttribute('data-id'),
                            name: (a.textContent || '').trim()
                        })).filter((b) => b.id && b.name);
                        const currentName = (document.querySelector('.branch-name, #current_branch_name')?.textContent || '').trim() || null;
                        if (branches.length) {
                            window.electronAPI.tray.setBranches({ branches, currentName });
                        }
                    };
                    const list = () => document.getElementById('change_branch_list');
                    const arm = () => {
                        const el = list();
                        if (!el) return setTimeout(arm, 2000);
                        new MutationObserver(harvestBranches).observe(el, { childList: true, subtree: true });
                        harvestBranches();
                    };
                    arm();

                    window.electronAPI.tray.onSwitchBranch((id) => {
                        if (window.PosnicPro?.branches?.showChange) {
                            PosnicPro.branches.showChange(id);
                        } else {
                            window.location.hash = '#/branches/' + id + '/change';
                        }
                    });
                }
            })();
        </script>
        <script>
        /* Static-asset service worker (web / LAN counters only). The desktop
           shell is skipped: its assets are local files owned by the installer
           and asset-updater. Cache invalidation is the worker's own contract -
           its cache name carries the build hash, so a server deploy replaces
           every cached bundle on the next navigation. */
        if ('serviceWorker' in navigator && navigator.userAgent.indexOf('Electron') === -1) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
            });
        }
    </script>
