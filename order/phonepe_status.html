<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <!--
        WHERE EVERY RELATIVE PATH ON THIS PAGE POINTS.
        A printed code can be three segments deep - /order/AZ100/venue/RC/123
        for a hotel room - and without this the browser looks for each asset
        under /order/AZ100/venue/, a directory that does not exist. The page
        loads and shows nothing, which is the worst kind of broken: a blank
        screen with no error anybody sees.
        Pinned to the mount rather than left to the arriving URL, so one file
        serves the shop address, a table and a venue alike.
    -->
    <base href="/order/" />
    <title>Payment status</title>
    <link href="assets/order.css?v=20260912-design" rel="stylesheet">
    <script src="assets/i18n.js?v=20260912-design"></script>
    <script src="assets/jquery-3.7.1.min.js?v=20260912-design"></script>
    <script src="config.js?v=20260912-design"></script>
    <link href="assets/channel-state.css?v=20260912-design" rel="stylesheet">
    <script src="assets/channel-state.js?v=20260912-design"></script>
    <script src="assets/service-point.js?v=20260912-design"></script>
    <script src="assets/shop-address.js?v=20260912-design"></script>
    <script src="assets/kiosk-core.js?v=20260912-design"></script>
    <script src="indexedDB.js?v=20260912-design"></script>
</head>

<body>
    <!--
        Where a PhonePe payment comes back to. The same card as every other
        wait on these pages; it used to be its own page with its own gradient,
        Bootstrap from one CDN, jQuery from another and an icon font from a
        third, to show one line of text.
    -->
    <main class="done" id="statusContainer">
        <div class="loader" id="loading" role="status" aria-label="Checking the payment" style="margin: 24px auto;"></div>
        <div id="statusMessage" hidden>
            <div class="done-mark" id="statusIcon" aria-hidden="true"></div>
            <h1 id="statusText">Checking the payment</h1>
        </div>
        <div class="button-group">
            <button type="button" class="btn-secondary" onclick="window.location.href='cart.html'">Back to your order</button>
        </div>
    </main>

    <script>
        async function PhonepeStatus() {
            await loadEnvConfig();

            document.getElementById("loading").hidden = false;
            document.getElementById("statusMessage").hidden = true;

            try {
                const branches = await getData(BRANCH_STORE);
                const brancheId = branches[0]?.id;

                if (!brancheId) {
                    throw new Error("Branch ID is missing");
                }

                const transactionId = await getFirstPhonePeId();
                if (!transactionId) {
                    displayStatus("ERROR", "No payment to check.");
                    return;
                }

                const response = await fetch(`${CONFIG.API_BASE_URL}/sales/phonepeQrStatus`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        transactionId: transactionId,
                        brancheId: brancheId
                    }),
                });

                const result = await readJsonResponse(response, "PhonePe payment status");

                displayStatus(result.data.code);

                if (result.data.code === "PAYMENT_SUCCESS" && result.data.data.state === "COMPLETED") {
                    checkout(result.data.transectionId);
                }

            } catch (error) {
                console.error("Error checking payment status:", error);
                displayStatus("ERROR", error.message);
            }
        }

        /* One mark and one line. A tick for paid, nothing for pending, and
           the reason when it failed. */
        function displayStatus(status, errorMessage = "") {
            document.getElementById("loading").hidden = true;
            document.getElementById("statusMessage").hidden = false;

            const mark = document.getElementById("statusIcon");
            const text = document.getElementById("statusText");
            const TICK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg>';
            const CROSS = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>';

            switch (status) {
                case "PAYMENT_SUCCESS":
                    mark.innerHTML = TICK;
                    mark.style.color = "";
                    mark.style.borderColor = "";
                    text.textContent = "Payment received";
                    break;
                case "PAYMENT_PENDING":
                    mark.innerHTML = "";
                    text.textContent = "Payment still pending";
                    break;
                default:
                    mark.innerHTML = CROSS;
                    mark.style.color = "#b91c1c";
                    mark.style.borderColor = "#b91c1c";
                    text.textContent = errorMessage || "Payment failed";
                    break;
            }
        }

        PhonepeStatus();
    </script>
</body>
</html>
