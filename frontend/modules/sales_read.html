<div class="vertical-layout page_loader" id="sales" style="display: none">
    <!--Start Containerbar-->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title">
                        <lang class="lang_salehistory_title">Sales History</lang>
                    </h4>
                </div>
                <div class="col-md-8 col-lg-8 show-button-action"></div>
                <div class="col-lg-3 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_sales_daterange"
                        class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_sales_fields" data-id="sales"
                        onchange="PosnicPro.changePlaceholder(this)">
                        <option value="sales_id" selected>
                            <lang class="lang_id_title">Id</lang>
                        </option>
                        <option value="customer_name">
                            <lang class="lang_customer_title">Customer</lang>
                        </option>
                        <option value="customer_phone">
                            <lang class="lang_phone_title">Phone</lang>
                        </option>
                        <option value="sale_process">
                            <lang class="lang_process_title">Process</lang>
                        </option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_sales_input"
                        placeholder="Enter Id" data-id="sales" maxlength="25" autocomplete="off">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 tb_search hide-button-action adjuce_left" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="sales"
                        onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="sales"
                        onclick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button"
                            class="btn btn-round btn-primary-rgba click-action-button adjuce_left add_new_tooltip"
                            data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                        <a id="sales_new_button" data-module="sales" data-access="write" href='#/sales/new'
                            class="btn btn-primary-rgba dash_sale_count" data-toggle="tooltip" title="New Sale">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>

                    </div>
                </div>

            </div>
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 mobile-hide tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;">
                            <span class="view_sales_date_filter_value"></span>
                        </span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;">
                            <span class="view_sales_filter_value"></span>
                        </span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!--Start Contentbar-->
    <div class="contentbar">
        <!--Start row-->
        <div class="row">
            <!--Start col-->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header sales_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_sales_per_page"
                                                data-id="sales" onChange="PosnicPro.setPerPage(this, 'Table');">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item">
                                                <a data-module="sales" data-access="read" href="#/sales"
                                                    id="sales_exportbtn" class="sale_color"
                                                    onClick="PosnicPro.sales.view.exportSales();" data-toggle="tooltip"
                                                    title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a data-module="sales" data-access="delete" href="#/sales"
                                                    id="sales_deletebtn" class="sale_color"
                                                    onclick="PosnicPro.sales.view.deleteSelectedSales();"
                                                    data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a href="javascript:PosnicPro.refreshDatatable('sales')" data-id="sales"
                                                    class="add_new_tooltip" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-sale">
                        <div class="table-responsive">
                            <table class="table table-borderless" id="view_sales">
                                <div class="col-sm-6 col-md-12 col-lg-12" id="sales_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid"
                                        style="opacity: 0.6;width: 100%;height: 250px;" alt="">
                                </div>
                                <div class="sales_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>

                                <thead class="datatable-thead-tbody table-header sales_header"></thead>
                                <tbody class="datatable-thead-tbody table-body sales_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 sales_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing
                                    <b><span id="view_sales_page_total"></span></b>
                                    to
                                    <b><span id="view_sales_page_perpage_total"></span></b>
                                    of
                                    <b><span id="view_sales_total"></span></b>
                                    entries
                                    <span class="showing-hide-show-sales" style="display:none;">
                                        &nbsp;&nbsp;&nbsp;&nbsp;
                                        <span class="showing-value-sales text-dark"> 0 </span>&nbsp;
                                        rows selected
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="sales"
                                            onclick="PosnicPro.previousPage(this, 'Table')"> <i
                                                class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="sales"
                                            onclick="PosnicPro.nextPage(this, 'Table')"> <i
                                                class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--End col-->
        </div>
        <!--End row-->
    </div>
    <!--End Contentbar-->
</div>
<!--End Containerbar-->
