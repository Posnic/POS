<div class="vertical-layout page_loader" id="expensesreport_new" style="display: none">

    <div id="containerbar">

                    <div id="view_expenses_report_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendarfeather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-5 col-xl-5 hide-button-action tb_filter" style="display:none;">
                    <select class="floating-input select2 load-branch display-current-branch" multiple="multiple"

                    </select>
                </div>
                <div class="col-md-2 col-lg-2 adjuce_left hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="expenses" onclick="PosnicPro.dateRangeAllfilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="tableView" onclick="PosnicPro.expenseroot.viewPage(this);">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-1 col-xl-1 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left add_new_tooltip" data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>                       
                    </div>
                </div>  
            </div>
        </div>

                <div class="card m-b-30">
                    <div class="card-body">
                        <ul class="nav nav-tabs custom-tab-line mb-3" id="defaultTabLine" role="tablist">
                            <li class="nav-item">
                                <a class="nav-link active report_tab_font" id="expense-tab-line" data-toggle="tab" href="#expense-line" role="tab" aria-controls="expense-line" aria-selected="true" onClick="PosnicPro.expensesreport.expensesreportTable();"><i class="feather icon-file-text mr-1"></i>Expense Details</a>
                            </li>
                        </ul>
                        <div class="tab-content" id="defaultTabContentLine">
                            <div id="expense_upgrade" class="text-center mt-4">
                                <p class="font-weight-bold">You're currently on the Free Plan. Upgrade to Premium for full access to all features.</p>
                                <a href="javascript:void(0)" onclick="return PosnicPro.users.accountGoToWebsiteURL(this);" class="btn btn-primary">Upgrade to Premium</a>
                            </div>
                            <div class="tab-pane fade show active" id="expense-line" role="tabpanel" aria-labelledby="expense-tab-line">

                                            <option value="100">100</option>

                                    </div>

                                        <div class="email-rightbar">
                                            <div class="card-header header_icon">
                                                <ul class="list-inline mb-0 pl-0 float-right">
                                                    <li class="list-inline-item email_320">

                                                        </a>
                                                    </li>
                                                    <li class="list-inline-item email_320">
                                                        <a href="javascript:void(0);" data-module="report" data-access="read" id="expensesreport_exportbtn"

                                                            <i class="feather icon-share font-20"></i>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body card-box no-padding loader-expenses-report">

                                    <div class="table-responsive">

                                               width="100%">

                                                <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="" loading="lazy" decoding="async">
                                            </div>
                                            <div class="reportexpenses_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                            </div>
                                            <thead class="report-thead-tfoot table-header reportexpenses_header"></thead>
                                            <tbody class="report-thead-tfoot table-body reportexpenses_header"></tbody>
                                        </table>

                                <div class="card m-b-30 reportexpenses_header">

                                                    Showing 
                                                    <b><span id="view_expensesreport_page_total"></span></b> 
                                                    to 
                                                    <b><span id="view_expensesreport_page_perpage_total"></span></b>

                                                    entries 
                                                    <span class="showing-hide-show-expensesreport" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp;

                                                        rows selected

                                            </div>

                                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="expensesreport" onclick="PosnicPro.nextPage(this, 'Table')" aria-label="Next page"> <i class="fa fa-angle-right font-20"></i> </button>
                                                    </ul>
                                                </nav>
                                            </div>
                                        </div>                                
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
    </div>
</div>
