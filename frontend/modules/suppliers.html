<div class="vertical-layout page_loader" id="suppliers" style="display: none">
    <!-- Suppliers, built to LIST_PAGE_UX_STANDARD.md: the second page to
         speak it after purchases. Full-width list first; a row click enters
         the split; the document pane carries the supplier's profile and
         their recent purchases, cross-linked to #/purchaseorders/<id>. -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0"><lang class="lang_supply_title">Suppliers</lang></h4>
                </div>
                <div class="col">
                    <div class="lf-panel" id="suppliers_filter_panel" style="display:none;"></div>
                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar" id="suppliers_controls">
                        <a data-module="supplier" data-access="write" href="#/suppliers" class="btn btn-primary-rgba"
                            onclick="PosnicPro.importTableFile('suppliers'); return false;"
                            data-toggle="tooltip" title="Import from CSV/Excel" aria-label="Import suppliers">
                            <i class="feather icon-download"></i>
                        </a>
                        <div class="btn-group">
                        <button type="button" class="btn btn-primary-rgba dropdown-toggle" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false" title="Export CSV" aria-label="Export CSV">
                            <i class="feather icon-share"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-right">
                            <a class="dropdown-item" href="javascript:void(0)" onclick="PosnicPro.suppliers.exportCsv(); return false;">This page (what is shown)</a>
                            <a class="dropdown-item" href="javascript:void(0)" onclick="PosnicPro.suppliers.exportAllCsv(); return false;">Everything matching the filter</a>
                        </div>
                        </div>
                        <button type="button" class="btn btn-primary-rgba lf-btn" id="suppliers_filter_btn"
                            data-toggle="tooltip" title="Filter suppliers">
                            <i class="feather icon-filter mr-2"></i>Filter
                        </button>
                        <a data-module="supplier" data-access="write" href="#/suppliers/new"
                            class="btn btn-primary-rgba supplier_new_shortcut" data-toggle="tooltip" title="New supplier">
                            <i class="feather icon-plus mr-2"></i><lang class="lang_addvariant_title">New</lang>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="contentbar">
            <div id="suppliers_split">
                <div class="card m-b-30 md-rail" id="suppliers_list_card">
                    <div class="card-body">
                        <div id="suppliers_list_rows" class="md-rail-rows text-muted">Loading suppliers ...</div>
                        <div class="q-pager" id="suppliers_list_paging"></div>
                    </div>
                </div>
                <div class="card m-b-30 md-detail" id="suppliers_detail_card" style="display:none;">
                    <div id="suppliers_doc"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="infobar-settings-sidebar-supplierreport-details" class="infobar-settings-sidebar scroll_width">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between">
        <h4 id="exampleModalCenterTitle"><span class="supplier_product_view_name"> </span></h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="supplierreport">
            <img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close" loading="lazy" decoding="async">
        </a>
    </div>
    <div class="infobar-settings-sidebar-body">
        <div class="custom-mode-setting loader-item">            

            <div class="slider-modal-body">
                <div class="row">
                    <div class="col-xs-12 col-sm-4">
                        <div class="portlet light slider-portlet-vh">
                            <div class="portlet-body">
                                <div class="row">

                                    <div class="col-lg-12 col-xl-12">

                                        <div class="card bg-secondary-rgba m-b-30">
                                            <div class="card-body">
                                                <div class="row align-items-center">
                                                    <div class="col-12 text-center">
                                                        <h5 class="card-title text-primary mb-1 font-16">Total Selling Amount</h5>
                                                    </div>
                                                    <div class="col-12 text-center">
                                                        <span class="display-currency"></span> &nbsp;<span class="supplier_product_details_selling font-18">0</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="card bg-secondary-rgba m-b-30">
                                            <div class="card-body">
                                                <div class="row align-items-center">
                                                    <div class="col-12 text-center">
                                                        <h5 class="card-title text-primary mb-1 font-16">Total Products</h5>
                                                    </div>
                                                    <div class="col-12 text-center">
                                                        <span class="supplier_product_details_count font-18">0</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>                                        
                                    </div>                                    

                                </div> 
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-8">
                        <div class="portlet light slider-portlet-vh">
                            <div class="portlet-title margin-bottom-0">
                                <div class="caption caption-basic font-green-meadow">
                                    <span class="caption-subject bold uppercase">Product history</span>
                                </div>
                                <div class="actions">
                                    <div class="inline-block text-left">
                                        <div class="form-md-line-input form-md-floating-label custom-select2-ui">

                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="portlet-body padding-top-0">
                                <div class="row">
                                    <div class="col-lg-2 col-md-2 form-group mb-0 amount-spent-select selecct-align">
                                        <select class="form-control select_page" id="view_supplierproductdetails_per_page" data-id="supplierproductdetails" onChange="PosnicPro.setPerPage(this, 'Table');" aria-label="View supplierproductdetails per page">
                                            <option value="5" selected>5</option>
                                            <option value="10">10</option>
                                            <option value="25">25</option>
                                            <option value="50">50</option>
                                            <option value="100">100</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-10 col-md-10">                                                                                       
                                        <button data-module="report" data-access="read" 
                                                data-id="supplierproductreportexport" onclick="PosnicPro.supplierproductdetails.viewReportSupplierProductExport(this);" class="btn btn-primary-rgba pull-right">
                                            <lang class="lang_exportcsv_title">Export All To CSV</lang>
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body card-box no-padding loader-item-report">
                                    <!-- Start table -->
                                    <div class="table-responsive">
                                        <table id="view_supplierproductdetails" class="table table-borderless" cellspacing="0"
                                               width="100%">
                                            <thead class="report-thead-tfoot table-header"></thead>
                                            <tbody class="report-thead-tfoot table-body"></tbody>
                                        </table>
                                    </div>
                                    <!-- End table -->
                                </div>
                                <div class="card m-b-30">
                                    <div class="card-body ecommerce-pagination">
                                        <div class="row align-items-center">
                                            <div class="col-8">
                                                <div class="hint-text">
                                                    Showing 
                                                    <b><span id="view_supplierproductdetails_page_total"></span></b> 
                                                    to 
                                                    <b><span id="view_supplierproductdetails_page_perpage_total"></span></b> 
                                                    of 
                                                    <b><span id="view_supplierproductdetails_total"></span></b>
                                                    entries 
                                                    <span class="showing-hide-show-supplierproductdetails" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                                        <span class="showing-value-supplierproductdetails text-dark"> 0 </span>&nbsp;
                                                        rows selected  
                                                    </span>
                                                </div>
                                            </div>
                                            <div class="col-4">
                                                <nav aria-label="Page navigation example">
                                                    <ul class="pagination mb-0">
                                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="supplierproductdetails" onclick="PosnicPro.previousPage(this, 'Table')" aria-label="Previous page"> <i class="fa fa-angle-left font-20"></i> </button>
                                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="supplierproductdetails" onclick="PosnicPro.nextPage(this, 'Table')" aria-label="Next page"> <i class="fa fa-angle-right font-20"></i> </button>
                                                    </ul>
                                                </nav>
                                            </div>
                                        </div>                                
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
