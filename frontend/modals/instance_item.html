<div id="infobar-settings-sidebar-instance" class="infobar-settings-sidebar">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between">
        <h4 id="exampleModalCenterTitle"><span id="add_new_item_body"><lang class="lang_instant">Instant</lang></span>&nbsp;<lang class="lang_item_title">Item</lang></h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="instance">
            <img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close">
        </a>
    </div>
    <div class="infobar-settings-sidebar-body">
        <div class="custom-mode-setting loader-instance">
            <!--<form id='category_add'>-->
            <form class='instance_item_form' name="instance_item_form" id="instance_item_form">
                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="instance_items_name">
                            <lang class="lang_name_title">Item Name</lang><span class="text-danger">*</span> 
                        </label>
                        <input type="text" class="form-control border-control clear-instance-name" name="instance_items_name" id="instance_items_name" minlength="3" maxlength="500" placeholder="Enter the item name" value="" required autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-12">
                        <label for="instance_items_selling_price">
                            <lang class="lang_sellingamount_title">Price</lang> <span class="text-danger">*</span> 
                        </label>
                        <input type="text" class="form-control border-control clear-instance-value allow_decimal text-right hide_price_digit" name="instance_items_selling_price" id="instance_items_selling_price" minlength="1" maxlength="10" placeholder="Sale Price" value="" autocomplete="off" required>
                    </div>                    
                </div>
                
                <div class="form-row">
                    <div class="col-md-12 mb-2">
                        <a href="javascript:void(0)" id="toggle_instance_advanced" class="text-primary" onclick="$('#instance_advanced_fields').slideToggle();">
                            <i class="feather icon-settings"></i> <lang class="lang_advanced">Advanced</lang>
                        </a>
                    </div>
                </div>

                <div id="instance_advanced_fields" style="display:none;">
                    <div class="form-row">
                        <div class="form-group col-md-5">
                            <label for="instance_items_category">
                                <lang class="lang_choose_category">Choose Category</lang><span class="text-danger">*</span> 
                            </label> 
                            <select id='instance_items_category' style='width: 200px;' class="select2 items_category instance_items_choose_error" name="instance_items_category" required>
                            </select>                                                                 
                        </div>
                        <div class="form-group col-md-1">
                            <a data-module="category" data-access="write" href="#/sales/categories/new" class="btn btn-payment-mode active" style="margin-top:32px;height:38px;width:28px!important;padding:7px!important;margin-left:-10px;border: transparent;border-radius: 0px;">
                                <i class="feather icon-plus" data-toggle="tooltip" title="Add new category easily"></i>    
                            </a>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="instance_items_quantity">
                                <lang class="lang_qty_title">Qty</lang><span class="text-danger">*</span> 
                            </label>
                            <input type="text" class="form-control border-control allow_decimal clear-instance-qty" name="instance_items_quantity" id="instance_items_quantity" min="1" minlength="1" maxlength="7" placeholder="Enter the Qty" value="1" required autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="form-control-placeholder" for="instance_items_itemid">
                                <lang class="lang_sku_title"> SKU </lang>
                                <span class="tool" data-tip="sku number is unique code that is assigned to each product" tabindex="6">
                                    <i class="mdi mdi mdi-help-circle"></i>
                                </span>
                            </label>
                            <input type="text" class="form-control clear-instance-name" id="instance_items_itemid" name="instance_items_itemid" minlength="1" maxlength="20" placeholder="Enter SKU Code"  autocomplete="off" onkeyup="PosnicPro.items.loadOnchangeSku();"/>
                        </div> 
                        <div class="form-group col-md-6">
                              <label for="instance_items_unit">
                                    Item Units
                              </label>
                              <select class="form-control select2 pricing-field items_unit items_choose_error" name="instance_items_unit" id="instance_items_unit" style="width: 100%;">
                              </select>     
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="instance_items_mrp_price">
                                <lang class="lang_mrp_title">M.R.P</lang>
                            </label>
                            <input type="text" class="form-control border-control clear-instance-value allow_decimal text-right hide_price_digit" name="instance_items_mrp_price" id="instance_items_mrp_price" minlength="1" maxlength="10" placeholder="M.R.P." value="0.00" autocomplete="off">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="instance_items_company_price">
                                <lang class="lang_company_title">Company</lang>
                            </label>
                            <input type="text" class="form-control border-control clear-instance-value allow_decimal text-right hide_price_digit" name="instance_items_company_price" id="instance_items_company_price" minlength="1" maxlength="10" placeholder="Purchase Rate" value="0.00" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12">
    
                            <div class="form-group discount_form" style="float:left;">
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="instance_item_radio_discount_amount" name="radio_discount" class="custom-control-input" checked="checked">
                                    <label class="custom-control-label" for="instance_item_radio_discount_amount">
                                        <lang class="lang_discount_title">Disc</lang> <span class="display-currency"></span>
                                    </label>
                                </div>
                            </div>
    
                            <div class="form-group discount_form">
                                <div class="custom-control custom-radio custom-control-inline">
                                    <input type="radio" id="instance_item_radio_discount_percentage" name="radio_discount" class="custom-control-input">
                                    <label class="custom-control-label" for="instance_item_radio_discount_percentage">
                                        <lang class="lang_discount_title">Disc</lang><span> %</span>
                                    </label>
                                </div>
                            </div>
    
                            <div class="floating-label">
                                <input name="instance_items_discount_amount" id="instance_items_discount_amount" type="text"
                                       aria-describedby="basic-addon1" class="form-control border-control text-right clear-instance-value" min="0"
                                       maxlength="10" value="0.00" onkeypress='PosnicPro.validate(event)' value="0">
    
                                <input name="instance_items_discount_percentage" id="instance_items_discount_percentage"
                                       type="text" aria-describedby="basic-addon1"
                                       class="form-control border-control allow_decimal text-right clear-instance-value" min="0" max="100" maxlength="10"
                                       value="0" onkeyup="this.value = PosnicPro.minmax(this.value, 0, 100)" onkeypress="return PosnicPro.isNumber(event)">
                            </div>
                        </div>
    
                        <div class="form-group col-md-12">
                            <label for="instance_items_tax">
                                <lang class="lang_taxrate_title">Tax Rate</lang> 
                            </label>
                            <!--                        <input type="text" class="form-control border-control clear-instance-value text-right" name="instance_items_tax" id="instance_items_tax" min="0" max="100" maxlength="3" placeholder="Tax Value" onkeyup="this.value = PosnicPro.minmax(this.value, 0, 100)" value="0">-->
                            <select class="form-control select2 pricing-field items_tax" name="instance_items_tax" id="instance_items_tax" style="width: 100%;">
                            </select>
                        </div>
    
                        <div class="form-group col-md-12">
                            <div class="custom-control custom-radio custom-control-inline"> 
                                <input type="radio" id="item_tax_instant_inclusive" name="tax_instant_radio_value" class="custom-control-input" value="inclusive" checked="checked"> 
                                <label class="custom-control-label" for="item_tax_instant_inclusive"><lang class="lang_inclusive_title">Inclusive</lang></label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="item_tax_instant_exclusive" name="tax_instant_radio_value" class="custom-control-input" value="exclusive"> 
                                <label class="custom-control-label" for="item_tax_instant_exclusive"><lang class="lang_exclusive_title">Exclusive</lang></label>
                            </div>                                                
                        </div>
    
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-12">
                        <div class="pull-right">
                            <button type="button" class="btn btn-outline-secondary infobar-settings-reset" id="instance_reset" onclick="PosnicPro.sales.instanceClearForm();"><i class="feather icon-refresh-ccw mr-2"></i><lang class="lang_clear_title"> Clear</lang></button>
                            <button type="button" class="btn btn-outline-danger infobar-settings-close" data-id="instance">
                                <i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title">  <lang class="lang_close_title"> Close</lang></lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="feather icon-save mr-2"></i>
                                <span id="category_button_title"> <lang class="lang_instance_add"> Add</lang>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div id="infobar-settings-sidebar-instant-details" class="infobar-settings-sidebar">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between">
        <h4 id="exampleModalCenterTitle"><span class="instant_view_name"> </span></h4>
        <a href="javascript:void(0)" class="infobar-settings-close" data-id="instant">
            <img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close">
        </a>
    </div>
    <div class="infobar-settings-sidebar-body">
        <div class="custom-mode-setting loader-instant">            

            <div class="slider-modal-body">
                <div class="row">
                    <div class="col-xs-12 col-sm-4">
                        <div class="portlet light slider-portlet-vh">
                            <div class="portlet-body">

                                <div class="row">                                    
                                    <div class="col-lg-12 col-xl-12">                                        
                                        <div class="card bg-secondary-rgba m-b-30">
                                            <div class="card-body">
                                                <div class="row align-items-center">
                                                    <div class="col-12 text-center">
                                                        <h5 class="card-title text-primary mb-1 font-16"> Total sale  </h5>
                                                    </div>
                                                    <div class="col-12 text-center"><span class="instantcurrency_symbol font-18">0</span>
                                                        &nbsp;<span class="instant_details_totalsale font-18">0</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="card bg-secondary-rgba m-b-30">
                                            <div class="card-body">
                                                <div class="row align-items-center">
                                                    <div class="col-12 text-center">
                                                        <h5 class="card-title text-primary mb-1 font-16"> No. of qty  </h5>
                                                    </div>
                                                    <div class="col-12 text-center">
                                                        <span class="instant_details_noofsale font-18">0</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>                                        
                                    </div>


                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-xs-12 col-sm-8">
                        <div class="portlet light slider-portlet-vh">
                            <div class="portlet-title margin-bottom-0">
                                <div class="caption caption-basic font-green-meadow">
                                    <span class="caption-subject bold uppercase">Purchase history</span>
                                </div>
                                <div class="actions">
                                    <div class="inline-block text-left">
                                        <div class="form-md-line-input form-md-floating-label custom-select2-ui">

                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="portlet-body padding-top-0">
                                <div class="row">
                                    <div class="col-lg-2 col-md-2 form-group mb-0 amount-spent-select selecct-align">
                                        <select class="form-control select_page" id="view_instantdetails_per_page" data-id="instantdetails" onChange="PosnicPro.setPerPage(this, 'Table');">
                                            <option value="5" selected>5</option>
                                            <option value="10">10</option>
                                            <option value="25">25</option>
                                            <option value="50">50</option>
                                            <option value="100">100</option>
                                        </select>
                                    </div>
                                    <div class="col-lg-10 col-md-10">                                                                                       

                                    </div>
                                </div>
                                <div class="card-body card-box no-padding loader-instant-report">
                                    <!-- Start table -->
                                    <div class="table-responsive">
                                        <table id="view_instantdetails" class="table table-borderless" cellspacing="0"
                                               width="100%">
                                            <thead class="report-thead-tfoot table-header"></thead>
                                            <tbody class="report-thead-tfoot table-body"></tbody>
                                        </table>
                                    </div>
                                    <!-- End table -->
                                </div>
                                <div class="card m-b-30">
                                    <div class="card-body ecommerce-pagination">
                                        <div class="row align-items-center">
                                            <div class="col-8">
                                                <div class="hint-text">
                                                    Showing 
                                                    <b><span id="view_instantdetails_page_total"></span></b> 
                                                    to 
                                                    <b><span id="view_instantdetails_page_perpage_total"></span></b> 
                                                    of 
                                                    <b><span id="view_instantdetails_total"></span></b>
                                                    entries 
                                                    <span class="showing-hide-show-instantdetails" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                                        <span class="showing-value-instantdetails text-dark"> 0 </span>&nbsp;
                                                        rows selected  
                                                    </span>
                                                </div>
                                            </div>
                                            <div class="col-4">
                                                <nav aria-label="Page navigation example">
                                                    <ul class="pagination mb-0">
                                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="instantdetails" onclick="PosnicPro.previousPage(this, 'Table')"> <i class="fa fa-angle-left font-20"></i> </button>
                                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="instantdetails" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
                                                    </ul>
                                                </nav>
                                            </div>
                                        </div>                                
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
