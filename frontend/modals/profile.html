<!-- profile modal -->
<div id="infobar-settings-sidebar-profile-details" class="infobar-settings-sidebar">
    <div class="infobar-settings-sidebar-head d-flex w-100 justify-content-between">
        <h4 id="exampleModalCenterTitle"><lang class="lang_vieweditprofile_title"> Profile Details </lang></h4>
        <a href="javascript:void(0)" class="infobar-tender-close">
            <img src="static/images/svg-icon/close.svg" class="img-fluid menu-hamburger-close" alt="close" loading="lazy" decoding="async">
        </a>
    </div>
    <div class="infobar-settings-sidebar-body">
        <div class="custom-mode-setting loader-profile">            
            <div class="slider-modal-body scroll_width">

                        <div class="col-lg-12 col-xl-12">
                            <div class="row justify-content-center">
                                <div class="col-md-6" style="border-right: 1px solid #ddd;">
                                    <div class="user-slider-item">
                                        <div class="card-body text-center">
                                            <div class="profilebox pt-4 text-center">
                                                <ul class="list-inline">
                                                    <li class="list-inline-item"> 
                                                        <input type="file" id="profile_file" class="inputfile inputfile-1" onchange="PosnicPro.imageReadURL(this, 'profile', '205', '160');" 
                                                               accept=".gif, .jpg, .png, .jpeg, .bmp" data-placeholder="No file" data-btnclass="btn-light"
                                                               tabindex="-1" style="position: absolute; clip: rect(0px, 0px, 0px, 0px);"  hidden>
                                                        <label for="profile_file" class="btn btn-success-rgba font-18"><i class="feather icon-edit"></i></label>
                                                        <input type="hidden" name="get_profile_image_value" id="get_profile_image_value">
                                                        <input type="hidden" name="profile_value_check" id="profile_value_check">
                                                    </li>
                                                    <li class="list-inline-item">
                                                        <img src="static/images/default/user.svg" id="profile_image_upload" class="img-fluid" alt="profile" loading="lazy" decoding="async">
                                                    </li>
                                                    <li class="list-inline-item">
                                                        <a href="javascript:void(0)" class="btn btn-danger-rgba font-18" onclick="PosnicPro.users.removePopupUserImage()">
                                                            <i class="feather icon-trash"></i>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </div>
                                            <h5>

                                                    <label for="editableusername" class="usersnamelabel">
