<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
        WHERE EVERY RELATIVE PATH ON THIS PAGE POINTS.

        A printed code can be three segments deep - /order/AZ100/venue/RC/123
        for a hotel room - and without this the browser looks for each asset
        under /order/AZ100/venue/, a directory that does not exist. The page
        loads and shows nothing, which is the worst kind of broken: a blank
        screen with no error anybody sees.

        Pinned to the mount rather than left to the arriving URL, so one file
        serves the shop address, a table and a venue alike.
    -->
    <base href="/order/" />
  <title>Kiosk Home</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet" />
  <script src="assets/jquery-3.7.1.min.js"></script>
  <script src="config.js"></script>
    <link href="assets/channel-state.css" rel="stylesheet">
    <script src="assets/channel-state.js"></script>
    <script src="assets/service-point.js"></script>
  <script src="assets/kiosk-core.js"></script>
  <script src="indexedDB.js?v=20260709-fastrefresh"></script>
  <link href="assets/home/style.css" rel="stylesheet" />
</head>

<body class="home-page">
  <div class="overlay">
    <div class="option-card" onclick="selectOrderType('DINE IN')">
      <img src="images/dinein.png" alt="Dine In" />
      <p>Dine In</p>
    </div>
    <div class="option-card" onclick="selectOrderType('PARCEL')">
      <img src="images/parcel.png" alt="Parcel" />
      <p>Take Away</p>
    </div>
  </div>

  <script>
    clearOrderAttemptId();
    Object.keys(sessionStorage)
      .filter(key => key.startsWith('printed_'))
      .forEach(key => sessionStorage.removeItem(key));
    sessionStorage.removeItem('kioskReceipt');
    sessionStorage.removeItem('kioskReceiptPrinted');
    sessionStorage.removeItem('kiosk_mobile_number');
    sessionStorage.removeItem('qr_id');
    localStorage.removeItem('kioskReceipt');
    localStorage.removeItem('kiosk_mobile_number');
    localStorage.removeItem('qr_id');

    function selectOrderType(type) {
      localStorage.setItem('orderType', type);
      window.location.href = 'products.html';
    }
  </script>

  <script src="assets/home/script.js?v=20260709-fastrefresh"></script>

</body>

</html>
