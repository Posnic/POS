# The develop sandbox. Public, disposable, running code nobody has reviewed.
#
# The banner is injected here rather than built into the application, on
# purpose. The app has no business carrying a warning it must never show a real
# shop - a flag for that is one bad default away from appearing on a customer's
# till. This file exists only on the sandbox, so there is no path by which it
# reaches production.
limit_req_zone $binary_remote_addr zone=develop:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name develop.posnic.io _;

    # Let's Encrypt renews over HTTP. Cloudflare deliberately does not redirect
    # this path even with "Always Use HTTPS" on, which is what let the
    # certificate be issued through the orange cloud in the first place.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name develop.posnic.io _;

    # A real certificate, so Cloudflare's Full (STRICT) works as it should.
    # The alternative - relaxing the zone to Full for this hostname - would
    # have Cloudflare accept ANY certificate from a box that runs unreviewed
    # contributor code. Weakening the zone to accommodate the least trusted
    # machine on it is the wrong way round.
    ssl_certificate     /etc/letsencrypt/live/develop.posnic.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/develop.posnic.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 25m;

    # A sandbox in search results is worse than no sandbox.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        limit_req zone=develop burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;

        # Nothing to substitute into if the app compresses it first.
        proxy_set_header Accept-Encoding "";

        # Fixed to the BOTTOM. The top of these screens is a working till, and
        # covering it is how a banner becomes something people learn to ignore.
        #
        # The replacement is ONE argument: nginx does not join adjacent strings,
        # and splitting it across lines is a config error that takes the site
        # down rather than a formatting choice.
        # The demo logins, on the page that asks for them.
        #
        # A separate page - a wiki, a Notion doc, a section of the README - is
        # one more place to look, one more thing to keep in step, and the first
        # thing to go stale. These are on the login screen because that is
        # where somebody needs them, at the moment they need them.
        #
        # Safe to show: the box is public, holds demo data, and is wiped
        # nightly. Pretending these are secret would make them harder to use
        # without making anything safer.
        #
        # Wrapped in <!--email_off-->: Cloudflare'''s Email Address Obfuscation
        # rewrites any address it finds into a [email protected] link that needs
        # JavaScript to read - on the one page where the address is the point.
        #
        # sub_filter_once is ON. It applies PER STRING, and with it off this
        # panel appeared four times - once for every <form> on the page.
        sub_filter_once on;
        sub_filter '<form' '<!--email_off--><div style="max-width:520px;margin:0 auto 18px;padding:12px 14px;border:1px solid #cfd9ea;border-radius:8px;background:#f5f8fc;color:#1f2937;font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:left"><div style="font-weight:600;margin-bottom:7px">Demo logins <span style="font-weight:400;color:#5b6473">&mdash; password <code style="background:#fff;border:1px solid #dbe3f0;border-radius:4px;padding:1px 5px;font-size:12px">Develop@123</code> for all four</span></div><table style="border-collapse:collapse;font-size:13px"><tr><td style="padding:3px 10px 3px 0;white-space:nowrap"><b>Admin</b></td><td style="padding:3px 10px 3px 0"><code style="background:#fff;border:1px solid #dbe3f0;border-radius:4px;padding:1px 5px;font-size:12px">admin@develop.posnic.io</code></td><td style="padding:3px 0;color:#5b6473;white-space:nowrap">everything</td></tr><tr><td style="padding:3px 10px 3px 0;white-space:nowrap"><b>Manager</b></td><td style="padding:3px 10px 3px 0"><code style="background:#fff;border:1px solid #dbe3f0;border-radius:4px;padding:1px 5px;font-size:12px">manager@develop.posnic.io</code></td><td style="padding:3px 0;color:#5b6473;white-space:nowrap">no staff or branch admin</td></tr><tr><td style="padding:3px 10px 3px 0;white-space:nowrap"><b>Cashier</b></td><td style="padding:3px 10px 3px 0"><code style="background:#fff;border:1px solid #dbe3f0;border-radius:4px;padding:1px 5px;font-size:12px">cashier@develop.posnic.io</code></td><td style="padding:3px 0;color:#5b6473;white-space:nowrap">the till</td></tr><tr><td style="padding:3px 10px 3px 0;white-space:nowrap"><b>Staff</b></td><td style="padding:3px 10px 3px 0"><code style="background:#fff;border:1px solid #dbe3f0;border-radius:4px;padding:1px 5px;font-size:12px">staff@develop.posnic.io</code></td><td style="padding:3px 0;color:#5b6473;white-space:nowrap">least access</td></tr></table></div><!--/email_off--><form';

        sub_filter '</body>' '<div style="position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#7f1d1d;color:#fff;font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:9px 14px;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.35)"><b>Test sandbox</b> &mdash; Posnic <b>develop</b> build, not a real shop. Data here is demo data, is wiped nightly, and is public. <b>Do not enter real customer details.</b></div></body>';
    }
}
