<div class="vertical-layout page_loader" id="sales" style="display: none">
    <!--Start Containerbar-->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0">
                        <lang class="lang_salehistory_title">Sales History</lang>
                    </h4>
                </div>
                <div class="col">

                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar">
                        <span id="sales_sort_host"></span>
                        <button type="button" id="sales_filter_btn"
                            class="btn btn-primary-rgba lf-btn"
                            data-toggle="tooltip" title="Filter sales" data-t-title="lang_filter_sales">
                            <i class="feather icon-filter mr-2"></i><lang class="lang_filter">Filter</lang>
                        </button>
                        <a id="sales_new_button" data-module="sales" data-access="write" href='#/sales/new'
                            class="btn btn-primary-rgba dash_sale_count" data-toggle="tooltip" title="New Sale" data-t-title="lang_addnewsale_title">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>
                    </div>
                </div>
            </div>
            <div class="sales-history-topline">
            <div id="sales_quick_dates" class="d-flex flex-wrap my-2" style="gap:8px" role="group" aria-label="Filter sales" data-t-aria-label="lang_filter_sales">
                <button type="button" class="btn btn-outline-primary" style="min-height:44px" data-sales-date="today" aria-pressed="false"><lang class="lang_this_day">Today</lang></button>
                <button type="button" class="btn btn-outline-primary" style="min-height:44px" data-sales-date="yesterday" aria-pressed="false"><lang class="lang_yesterday">Yesterday</lang></button>
                <button type="button" class="btn btn-outline-primary" style="min-height:44px" data-sales-date="lastweek" aria-pressed="false"><lang class="lang_last_week">Last week</lang></button>
                <button type="button" class="btn btn-outline-primary" style="min-height:44px" data-sales-date="all" aria-pressed="true"><lang class="lang_all_time_2">All time</lang></button>
            </div>
            <div id="sales_history_summary" class="sales-history-summary" role="status" aria-live="polite"></div>
            </div>
            <div id="sales_filter_panel" class="sales-history-filterbar" style="display:none">
<div id="sales_filter_search" class="lf-panel"></div>
            <div id="sales_restaurant_filters" class="flex-wrap align-items-end" style="display:none; gap:10px;">
                <div><label for="sales_history_table" class="mb-1"><lang class="lang_table">Table</lang></label>
                    <select id="sales_history_table" class="form-control"><option value="" data-t="lang_all_sales"><lang class="lang_all_sales">All sales</lang></option><option value="__tables" data-t="lang_tables_only"><lang class="lang_tables_only">Tables only</lang></option></select></div>
                <div><label for="sales_history_period" class="mb-1"><lang class="lang_serving_period">Serving period</lang></label>
                    <select id="sales_history_period" class="form-control"><option value="" data-t="lang_all_day"><lang class="lang_all_day">All day</lang></option></select></div>

                <small id="sales_history_period_hint" class="sr-only" aria-live="polite"></small>
            </div>
                <form id="sales_provenance_form" class="sales-history-provenance">
                    <label class="mb-0 sales-history-picker"><span id="sales_history_staff_label"><lang class="lang_staff">Staff</lang></span><input id="sales_history_staff" class="form-control" autocomplete="off" role="combobox" aria-autocomplete="list" type="search" maxlength="120" placeholder="Staff name or email" data-t-placeholder="lang_staff_name_or_email"><button type="button" class="sales-history-picker-toggle" data-picker="staff" aria-label="Choose staff" data-t-aria-label="lang_choose_staff">▾</button></label>
                    <label class="mb-0 sales-history-picker"><lang class="lang_device">Device</lang><input id="sales_history_device" class="form-control" autocomplete="off" role="combobox" aria-autocomplete="list" type="search" maxlength="120" placeholder="Device name or ID" data-t-placeholder="lang_device_name_or_id"><button type="button" class="sales-history-picker-toggle" data-picker="device" aria-label="Device" data-t-aria-label="lang_device">▾</button></label>
                    <label class="mb-0" id="sales_history_source_wrap"><lang class="lang_rd_order_source">Order source</lang><select id="sales_history_source" class="form-control"><option value=""><lang class="lang_all_sources">All sources</lang></option></select></label>
                    <button type="submit" class="btn btn-primary" style="min-height:44px"><lang class="lang_filter_title">Apply</lang></button>
                    <button type="button" id="sales_provenance_reset" class="btn btn-light" style="min-height:44px"><lang class="lang_clear_all">Clear all</lang></button>

                </form>
            </div>
            <div id="sales_active_filters" class="d-flex flex-wrap" style="gap:8px" aria-live="polite"></div>
            <!--
                KEPT DELIBERATELY, and not a filter control any more.

                Twenty other modules - branches, lowstock, receiving_add and
                every report - read THIS element to label their own empty
                states: $('#view_sales_daterange span span[data-toggle=tooltip]')
                .attr('data-original-title'), rendered as "No Records on <range>".
                It became the shared date label because it carries
                .daterange-timepicker-all, which PosnicPro.dashboard.datePicker
                keeps in step across pages.

                So deleting it with the rest of the old filter row would not have
                broken this screen - it would have put "No Records on undefined"
                on twenty others, none of which are being touched here. That is
                a worse trade than keeping one hidden element, and untangling it
                (each screen should label with its OWN range, or say nothing) is
                its own piece of work rather than a side effect of this one.

                Hidden rather than removed for exactly that reason. The bar owns
                the date filtering on this page now; this only carries the label.
            -->
            <div id="view_sales_daterange"
                 class="daterange-timepicker-all daterange-style" style="display:none;">
                <span></span>
            </div>
            <!--
                The "filtering by X" badges are gone with the controls that fed
                them - PosnicPro.search was the only thing that ever wrote them,
                and the button's count states the same fact where it can be seen
                with the panel closed.
            -->
        </div>
    </div>

    <!--Start Contentbar-->
    <div class="contentbar">
        <div id="sales_split">
            <div class="card m-b-30 md-rail" id="sales_list_card">
                <div class="card-body">
                    <div id="sales_list_rows" class="md-rail-rows text-muted"><lang class="lang_loading_sales">Loading sales ...</lang></div>
                    <div class="q-pager" id="sales_list_paging"></div>
                </div>
            </div>
            <div class="card m-b-30 md-detail" id="sales_detail_card" style="display:none;">
                <div id="sales_doc"></div>
            </div>
        </div>
    </div>
    <!--End Contentbar-->
</div>
<!--End Containerbar-->
