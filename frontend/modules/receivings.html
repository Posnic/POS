<div class="vertical-layout page_loader" id="receivings" style="display: none">

                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="receivings" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
