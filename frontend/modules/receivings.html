<div class="vertical-layout page_loader" id="receivings" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title break_title"><lang class="lang_purchasehistory_title">Purchase History</lang></h4>
                </div>               
                <div class="col-md-8 col-lg-8"></div>

                <!--
                    The shared filter bar (list-filter.js), same as the item
                    list and Sales History. It replaces a date range, a field
                    selector, a search box and an Apply/Clear pair that the
                    Filter button revealed as a group.

                    That arrangement could not say a filter was ON: the panel
                    closes and takes the controls with it, so a history narrowed
                    to one supplier looks like a shop with one supplier. The
                    count on the button shows whether or not the panel is open.

                    The old ids are REMOVED, not hidden - a selector still
                    reading from an input nobody can see is the quotes search
                    bug.
                -->
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" id="receivings_filter_btn"
                                class="btn btn-round btn-primary-rgba adjuce_left add_new_tooltip lf-btn"
                                data-toggle="tooltip" title="Filter"><i class="feather icon-filter" aria-hidden="true"></i></button>
                        <a data-module="receiving" data-access="write" href='#/receivings/new' class="btn btn-primary-rgba dash_sale_count" data-toggle="tooltip" title="New Purchase"><i class="feather icon-plus mr-2"></i><lang class="lang_addvariant_title">New</lang></a>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div id="receivings_filter_panel" class="lf-panel" style="display:none;"></div>
                </div>
            </div>
            <!--
                The "filtering by X" badges are gone with the controls that fed
                them - PosnicPro.search was their only writer, and the button's
                count says the same thing where it stays visible.
            -->
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header purchase_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_receivings_per_page" data-id="receivings" onChange="PosnicPro.setPerPage(this, 'Table');">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item"><a data-module = "receiving" data-access = "read" href="#/receivings" id="receivings_exportbtn" class="sale_color" onClick="PosnicPro.receivings.view.exportReceivings();" data-toggle="tooltip" title="Export Selected"><i class="feather icon-share font-20"></i></a></li>
                                            <li class="list-inline-item"><a data-module = "receiving" data-access = "delete" href="#/receivings" id="receivings_deletebtn" class="sale_color" onclick="PosnicPro.receivings.view.deleteSelectedReceivings();" data-toggle="tooltip" title="Delete"><i class="feather icon-trash font-20"></i></a></li>
                                            <li class="list-inline-item"><a href="javascript:PosnicPro.refreshDatatable('receivings')" data-id="receivings" class="add_new_tooltip" data-toggle="tooltip" title="Refresh"><i class="feather icon-refresh-cw font-20"></i></a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-receiving">
                        <div class="table-responsive">
                            <table class="table table-borderless" id="view_receivings">
                                 <div class="col-sm-6 col-md-12 col-lg-12" id="purchase_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="">
                                </div>
                                <div class="purchase_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                <thead class="datatable-thead-tbody table-header purchase_header"></thead>
                                <tbody class="datatable-thead-tbody table-body purchase_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 purchase_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_receivings_page_total"></span></b>
                                    to 
                                    <b><span id="view_receivings_page_perpage_total"></span></b> 
                                    of 
                                    <b><span id="view_receivings_total"></span></b>
                                    entries 
                                    <span class="showing-hide-show-receivings" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-receivings text-dark"> 0 </span>&nbsp; 
                                        rows selected  
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="receivings" onclick="PosnicPro.previousPage(this, 'Table')"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="receivings" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->
