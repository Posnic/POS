<div class="vertical-layout page_loader" id="branches" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title break_title"><lang class="lang_branchoutlet_title">Branches / Outlet</lang></h4>
                </div>
                <div class="col-2 col-md-2 col-lg-2 col-md-3 hide-button-action text-dark text-right">
               <lang class="lang_branchoutlet">Current Branch/Outlet</lang>
                </div>
                <div class="col-md-3 col-lg-3 hide-button-action">
                    <div class="single-dropdown d-inline-block align-middle">
                        <div class="dropdown">
                            <a class="btn btn-primary dropdown-toggle dropdown-cursor-pointer" href="#" role="button" id="dropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <span class="branch-name"></span>
                            </a>
                            <div id="change_branch_list" class="dropdown-menu scroll_branch" aria-labelledby="dropdownMenuLink" x-placement="bottom-start" style="position: absolute; will-change: transform; top: 0px; left: 0px; transform: translate3d(0px, 37px, 0px);">

                            </div>
                        </div>
                    </div>
                    <!-- Straight into editing the branch you are ON - shown
                         only to branch-write holders (ACL scan). -->
                    <a href="javascript:void(0)" id="edit_current_branch_btn"
                        data-module="branch" data-access="write"
                        class="btn btn-primary-rgba ml-1 align-middle" data-toggle="tooltip" title="Edit current branch"
                        onclick="hasher.setHash('branches/' + PosnicPro.local.get('branch_id_set') + '/edit');">
                        <i class="feather icon-edit"></i>
                    </a>
                </div>
                <div class="col-md-4 col-lg-4 show-button-action"></div>                  
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_branches_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_branches_fields" data-id="branches" onchange="PosnicPro.changePlaceholder(this)">
                        <option value="branch_name" selected>
                        <lang class="lang_name_title">Name</lang>
                        </option>
                        <option value="store_telephone">
                        <lang class="lang_phone_title">Phone</lang>
                        </option>
                        <option value="store_email">
                        <lang class="lang_email_title">Email</lang>
                        </option>
                        <option value="store_address">
                        <lang class="lang_address_title">Address</lang>
                        </option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_branches_input"
                           placeholder="Enter Name" data-id="branches" maxlength="25" autocomplete="off">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 adjuce_left tb_search hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="branches" onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="branches" onclick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-2 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left" data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                        <a data-module="branch" data-access="write" href='#/branches/new' onclick="return PosnicPro.branches.addbranchButton();" class="btn btn-primary-rgba dash_sale_count add_new_tooltip" data-toggle="tooltip" title="New Branch">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>                       
                    </div>
                </div>                        
            </div> 
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 mobile-hide tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;">
                            <span class="view_branches_date_filter_value"></span>
                        </span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;">
                            <span class="view_branches_filter_value"></span>
                        </span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header branch_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_branches_per_page" data-id="branches" onChange="PosnicPro.setPerPage(this, 'Table');">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item">
                                                <a data-module="branch" data-access="read" href="#/branches" id="branches_exportbtn" class="sale_color" onClick="PosnicPro.branches.exportBranches();" data-toggle="tooltip" title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a data-module="branch" data-access="delete" href="#/branches" id="branches_deletebtn" class="sale_color" onclick="PosnicPro.branches.deleteSelectedBranches();" data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a href="javascript:PosnicPro.refreshDatatable('branches')" data-id="branches" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-branch">
                        <div class="table-responsive">
                            <table class="table table-borderless" id="view_branches">
                                <div class="col-sm-6 col-md-12 col-lg-12" id="branch_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="" >
                                </div>
                                <div class="branch_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                
                                <thead class="datatable-thead-tbody table-header branch_header"></thead>
                                <tbody class="datatable-thead-tbody table-body branch_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 branch_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_branches_page_total"></span></b>
                                    to 
                                    <b><span id="view_branches_page_perpage_total"></span></b> 
                                    of
                                    <b><span id="view_branches_total"></span></b>
                                    entries 
                                    <span class="showing-hide-show-branches" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-branches text-dark"> 0 </span>&nbsp;
                                        rows selected 
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="branches" onclick="PosnicPro.previousPage(this, 'Table')"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="branches" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->
