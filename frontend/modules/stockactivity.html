<div class="vertical-layout page_loader" id="stocklogs" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-3 col-xl-3">
                    <h4 class="page-title"><lang class="lang_invenlog_title">Inventory Log (Stock) History</lang></h4>
                </div>               
                <div class="col-md-8 col-lg-8 show-button-action"></div>                  
                <div class="col-lg-3 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_stocklogs_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_stocklogs_fields" data-id="stocklogs" onchange="PosnicPro.changePlaceholder(this)">
                        <option value="item_name">
                            <lang class="lang_name_title">Name </lang>
                        </option>
                        <option value="process">
                            <lang class="lang_process_title">Activity </lang>
                        </option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_stocklogs_input"
                           placeholder="Enter Name" data-id="stocklogs" maxlength="25"  autocomplete="off">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 adjuce_left tb_search hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="stocklogs" onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="stocklogs" onclick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-12 col-xl-1 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left add_new_tooltip" data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>                        
            </div>              
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;">
                            <span class="view_stocklogs_date_filter_value"></span>
                        </span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;">
                            <span class="view_stocklogs_filter_value"></span>
                        </span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header stock_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_stocklogs_per_page" data-id="stocklogs" onChange="PosnicPro.setPerPage(this, 'Table');">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item">
                                                <a data-module="item" data-access="write" onClick="PosnicPro.stocklogs.exportStocklogs();" id="stocklogs_exportbtn" class="sale_color"  data-toggle="tooltip" title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
<!--                                            <li class="list-inline-item email_320">
                                                <a data-module="user" data-access="delete" href="#/stocklogs" id="stocklogs_deletebtn" class="sale_color" onclick="PosnicPro.stocklogs.deleteSelectedStocklogs();" data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>-->
                                            <li class="list-inline-item">
                                                <a href="javascript:PosnicPro.refreshDatatable('stocklogs')" data-id="stocklogs" class="add_new_tooltip" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-stocklog">
                        <div class="table-responsive">
                            <table class="table table-borderless" id="view_stocklogs">
                                <div class="col-sm-6 col-md-12 col-lg-12" id="stock_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="">
                                </div>
                                <div class="stock_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                <thead class="datatable-thead-tbody table-header stock_header"></thead>
                                <tbody class="datatable-thead-tbody table-body stock_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 stock_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_stocklogs_page_total"></span></b>
                                    to 
                                    <b><span id="view_stocklogs_page_perpage_total"></span></b> 
                                    of  
                                    <b><span id="view_stocklogs_total"></span></b>
                                    entries 
                                    <span class="showing-hide-show-stocklogs" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-stocklogs text-dark"> 0 </span>&nbsp; 
                                        rows selected  
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="stocklogs" onclick="PosnicPro.previousPage(this, 'Table')"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="stocklogs" onclick="PosnicPro.nextPage(this, 'Table')"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->

<!--Start view_stock_log modal-->      
<div class="modal fade close_on_esc" id="view_stock_log" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content" loader-view-stocklog>
            <div class="modal-header">
                <h5 class="modal-title">
                    <lang class="lang_stocklogdetail_title">Stock Log Details </lang>
                </h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row justify-content-center">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="table-responsive">
                                <table class="table table-borderless mb-0">
                                    <tbody>
                                    <tr>
                                        <th scope="row"><lang class="lang_itemname_title"> Item Name </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_item_name"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_itemquantity_title">Item Quantity</lang>:</th>
                                    <td><span id="view_stock_item_quantity"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_process_title"> Process </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_process"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_reference_title"> Reference </lang> :</th>
                                    <td><span id="view_stock_reference"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_stockdate_title">Stock Date </lang> :</th>
                                    <td><span id="view_stock_date"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_action_title"> Action </lang> :</th>
                                    <td><span id="view_stock_action"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_openingbalance_title"> Opening Stock </lang> :</th>
                                    <td><span id="view_stock_opening_balance"></span></td>
                                    </tr>
                                    <tr class="hiddenText row100" style="display: none;">
                                        <th scope="row"><lang class="lang_closingbalance_title">Closing Stock </lang> :</th>
                                    <td><span id="view_stock_closing_balance"></span></td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_changedby_title"> Changed By </lang> :</th>
                                    <td class="address-text-wrap"><span id="view_stock_changed_by"></span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" data-dismiss="modal">
                    <i class="feather icon-x-circle mr-2"></i>
                    <lang class="lang_close_title"> Close</lang> 
                </button>
            </div>
        </div>
    </div>
</div>
<!--End view_stock_log modal -->
