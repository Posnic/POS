<div class="vertical-layout page_loader" id="variants" style="display: none">
    <!-- Variant List, built to LIST_PAGE_UX_STANDARD.md: standard header,
         one list card with the shared rhythm, numbered pagination. A row
         click opens the variant's edit sidebar (the most-wanted action on a
         config list); the eye stays for the read-only view modal. -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <h4 class="page-title break_title mb-0"><lang class="lang_itemvariant_title">Variants</lang></h4>
                </div>
                <div class="col">
                    <div class="lf-panel" id="variants_filter_panel" style="display:none;"></div>
                </div>
                <div class="col-auto text-right">
                    <div class="widgetbar" id="variants_controls">
                        <button type="button" class="btn btn-primary-rgba" onclick="PosnicPro.variants.exportCsv();"
                            data-toggle="tooltip" title="Export the filtered rows" aria-label="Export CSV">
                            <i class="feather icon-share"></i>
                        </button>
                        <button type="button" class="btn btn-primary-rgba lf-btn" id="variants_filter_btn"
                            data-toggle="tooltip" title="Filter variants">
                            <i class="feather icon-filter mr-2"></i>Filter
                        </button>
                        <a data-module="item" data-access="write" href="#/variants/new"
                            class="btn btn-primary-rgba variant_new_shortcut" data-toggle="tooltip" title="New variant">
                            <i class="feather icon-plus mr-2"></i><lang class="lang_addvariant_title">New</lang>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="contentbar">
        <div class="card m-b-30 md-rail" id="variants_list_card">
            <div class="card-body">
                <div id="variants_list_rows" class="md-rail-rows text-muted">Loading variants ...</div>
                <div class="q-pager" id="variants_list_paging"></div>
            </div>
        </div>
    </div>
</div>
<!-- End Containerbar -->


<div class="modal fade close_on_esc" id="variants_view" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content loader-view-variant">
            <div class="modal-header">
                <h5 class="modal-title"><lang class="lang_variantdetail"> Variant Details </lang></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row justify-content-center">
                    <div class="row">
                        <div class="col-lg-12">
                            <h4><span id="variant_view_name" class="text-primary"></span></h4>
                            <div class="table-responsive">
                                <table class="table table-borderless mb-0">
                                    <tbody id="view_variant_fields"></tbody>
                                    <tbody>
                                    <tr>
                                        <th scope="row"><lang class="lang_createdate_title"> Created Date </lang> :</th>
                                    <td>
                                        <span id="variant_view_created_date"></span>
                                    </td>
                                    </tr>
                                    <tr>
                                        <th scope="row"><lang class="lang_update_title"> Updated Date </lang> :</th>
                                    <td>
                                        <span id="variant_view_updated_date"></span>
                                    </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" data-dismiss="modal">
                    <i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title"> Close</lang>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- end  -->
