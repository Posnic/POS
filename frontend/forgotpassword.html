<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>
        <lang class="lang_posnic_title"> Posnic - POS </lang>
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta content="Posnic - Point of Sale" name="description" />
    <meta content="Posnic" name="author" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="shortcut icon" href="static/images/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" href="static/images/favicon/favicon.ico" type="image/x-icon">
    <link crossorigin="anonymous" media="all" rel="stylesheet" href="style/forgotpassword.css" />

    <script>
        if (window.location.hostname === 'frontend-ace.pages.dev') {
            window.location.replace("https://www.posnic.io");
        }
    </script>
    <script>
        // Posnic (desktop/self-hosted): the API is always the origin that
            // served this page - Electron window, LAN device, or self-hosted server.
            // Cloud sync runs in a separate background process, never in the browser.
            let API_URL = window.location.protocol.startsWith('http')
                ? window.location.origin + '/'
                : 'http://localhost:5555/';
    </script>
    <style>
        .error {
            color: #f9616d;
            float: left;
            padding-bottom: 10px;
            padding-top: 5px;
        }

        .border-control {
            border: 1px solid #eae8e8;
        }
    </style>
</head>

<body class="vertical-layout">

    <div id="containerbar" class="containerbar authenticate-bg">
        <!-- Start Container -->
        <div class="container">
            <div class="auth-box login-box">
                <!-- Start row -->
                <div class="row no-gutters align-items-center justify-content-center">
                    <!-- Start col -->
                    <div class="col-md-6 col-lg-5">
                        <!-- Start Auth Box -->
                        <div class="auth-box-right">
                            <div class="card">
                                <div class="card-body">
                                    <div class="form-head">
                                        <a href="javascript:void(0)" class="logo"><img
                                                src="static/images/logo/posnic.svg" class="img-fluid" alt="logo"></a>
                                    </div>
                                    <form id="forgotpassword_form">
                                        <h4 class="text-primary my-4">Reset password ! </h4>
                                        <div class="form-group">
                                            <input type="hidden" name="forgot_key_value" id="forgot_key_value">
                                            <input class="form-control border-control" type="password"
                                                id="update_new_password" name="update_new_password" minlength="5"
                                                maxlength="20" placeholder="Enter New Password" required
                                                autocomplete="off">
                                        </div>
                                        <div class="form-group">
                                            <input type="password" class="form-control border-control"
                                                id="retype_new_password" name="retype_new_password" minlength="5"
                                                maxlength="20" placeholder="Enter Confirm Password" required
                                                autocomplete="off">
                                        </div>
                                        <div class="form-row mb-3">
                                            <div class="col-sm-6">
                                            </div>
                                            <div class="col-sm-6">
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-success btn-lg btn-block font-18">Update
                                            Password</button>
                                    </form>

                                </div>
                            </div>
                        </div>
                        <!-- End Auth Box -->
                    </div>
                    <!-- End col -->
                </div>
                <!-- End row -->
            </div>
        </div>
        <!-- End Container -->
    </div>
    <!-- End Containerbar -->
    <script type="application/javascript" src="script/forgotpassword.js"></script>
    <script type="text/javascript">
        let url = window.location.href;
        let id = url.substring(url.lastIndexOf('=') + 1);
        id = decodeURIComponent(id); // decode in case browser encoded it automatically

        var params = {
            url: 'users/getUserKeyDetails',
            data: {
                user_key: id
            }
        };
        PosnicPro.get(params, function (response) {
            if (response.type === 'success') {
                $("#forgot_key_value").val(response.data);
            } else {
                location.href = "error-404.html";
            }
        });


        $("#forgotpassword_form").validate({
            highlight: function (element, errorClass) {
                $(element).css("border-color", "#f9616d");
            },
            unhighlight: function (element, errorClass) {
                $(element).css("border-color", "#eae8e8");
            },
            rules: {
                update_new_password: {
                    required: true,
                    minlength: 5,
                    strong_password: true,
                    maxlength: 20
                },
                retype_new_password: {
                    required: true,
                    minlength: 5,
                    maxlength: 20,
                    equalTo: "#update_new_password"
                }
            },
            messages: {
                update_new_password: {
                    required: "Enter new password",
                    minlength: "Password must be at least 5 characters",
                    maxlength: "Password should not be more than 20 characters"
                },
                retype_new_password: {
                    required: "Enter confirm password",
                    minlength: "Password must be at least 5 characters",
                    maxlength: "Password should not be more than 20 characters",
                    equalTo: "Not match confirm Password"
                }
            }
        });
        $("#forgotpassword_form").submit(function (event) {
            event.preventDefault();
            if ($('#forgotpassword_form').valid()) {            // checks form for validity
                PosnicPro.users.changeUserPassword();
            }
        });
    </script>

</body>

</html>
