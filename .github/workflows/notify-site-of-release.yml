# Tell the website when a release is published, so the download page follows.
#
# The download page names the version in about a dozen places, and those names
# come from a manifest in the web-frontend repo that somebody updates by
# running a script. Nobody remembers every time, and the failure is silent -
# every link still works, it just hands new customers an older build than the
# one we shipped.
#
# This fires on `release: published`, which is the moment the decision is made,
# rather than on the tag push that starts the build. A tag exists long before
# the artefacts do, and pointing the download page at a release whose installers
# have not finished uploading is worse than pointing it at the previous one.
#
# Deliberately narrow: pre-releases and drafts are skipped. The site tool
# refuses them anyway - it reads GitHub's own /releases/latest, which never
# returns either - so dispatching for them would only produce a run that fails
# for a reason that is not a fault.
#
# The site also checks daily on its own, so a missed dispatch costs a day
# rather than costing the update.

name: Tell the site about a published release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    # `prerelease` is false for a stable publish; drafts never reach this event.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to web-frontend
        env:
          # A token that can dispatch into the other repo. Without it this step
          # is skipped rather than failed: the site's daily check still catches
          # up, and a release must never be held up by a notification.
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set - skipping."
            echo "The site checks for new releases daily, so it will catch up on its own."
            exit 0
          fi

          tag="${{ github.event.release.tag_name }}"
          echo "telling web-frontend about ${tag:-a new release}"

          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Posnic/web-frontend/dispatches \
            -d "{\"event_type\":\"stable-release-published\",\"client_payload\":{\"tag\":\"$tag\"}}")

          if [ "$code" != "204" ]; then
            echo "dispatch returned HTTP $code"
            cat /tmp/dispatch.out || true
            echo "The site's daily check will still pick this release up."
            exit 1
          fi
          echo "dispatched."
