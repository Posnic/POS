<div class="vertical-layout page_loader" id="items_new" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <!-- Start Breadcrumbbar -->
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto">
                    <!-- items.js swaps the verb: Add / Edit / Clone -->
                    <h4 class="page-title break_title mb-0"><span id="item_title_data">Add</span>
                        <lang class="lang_item_title">Item</lang></h4>
                </div>
            </div>
        </div>
    </div>
    <div class="contentbar">
        <!-- Start row -->
        <form class='item_add' name="image_upload_form" id="item_image_upload_form">
            <div class="row">
                <!-- Start col -->
                <div class="col-lg-8 col-xl-8 loader-item">
                    <div class="card m-b-30">
                        <div class="card-header">
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="product_without_variant" name="product_radio_variant"
                                    class="custom-control-input" checked>
                                <label class="custom-control-label" for="product_without_variant">
                                    <lang class="lang_without_variant">Item without variant</lang>
                                </label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline" id="item_variant_header">
                                <input type="radio" id="product_with_variant" name="product_radio_variant"
                                    class="custom-control-input">
                                <label class="custom-control-label" for="product_with_variant">
                                    <lang class="lang_with_variant">Item with variant</lang>
                                </label>
                            </div>
                        </div>
                        <div class="card-body">
                            <!-- Variant family strip (V1): the item's siblings, editable at last. -->
                            <div id="item_family_strip" class="mb-3 p-2 rounded border d-flex align-items-center flex-wrap" style="display:none; gap:4px;">
                                <span class="family-chips d-flex align-items-center flex-wrap" style="gap:4px;"></span>
                            </div>
                            <!-- Modifier groups (V2): which option sets this item offers.
                                 Restaurant-mode only; managed under Manage > Restaurant. -->
                            <div id="item_modifier_wrap" class="mb-3 p-2 rounded border" style="display:none;">
                                <label class="mb-1" style="font-weight:600; font-size:.85rem;"><lang class="lang_modifier_groups">Modifiers</lang></label>
                                <div id="item_modifier_groups" class="d-flex flex-wrap" style="gap:4px 18px;"></div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <label class="form-control-placeholder" for="items_name">
                                        <lang class="lang_itemname_title">Item Name </lang>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control border-control" id="items_name"
                                        name="items_name" placeholder="Enter Item Name" minlength="3" maxlength="500"
                                        autocomplete="off" required>
                                    <input type="hidden" name="id" id="itemid">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card m-b-30" id="show_variant_fields" style="display:none;">
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <label class="form-control-placeholder" for="items_variant">
                                        <lang class="lang_selectvariant_title">Select Variant </lang>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <select id='items_variant' name="items_variant" style='width: 200px;'
                                        class="select2 items_choose_error" required>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <label for="item_variant_list">
                                        <lang class="lang_variantfield_title"> Variant Fields </lang>
                                        <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-control select2 border-control items_choose_error"
                                        name="item_variant_list[]" id="item_variant_list" multiple="multiple"
                                        data-placeholder="Select variant fields" style="width: 100%;" required>
                                        <option></option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <button type="button" class="btn btn-outline-warning" id="load_variant"
                                        onclick="PosnicPro.items.loadVariant();">
                                        <lang class="lang_applyvariant"> Apply Variants</lang>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card m-b-30" id="show_price_fields" style="display:none;">
                        <div class="card-body">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_itemid">
                                            <lang class="lang_sku_title"> SKU </lang>
                                            <span class="summary_toolsize" data-toggle="tooltip" data-placement="top"
                                                title=""
                                                data-original-title="Simplify your product search, find with ease."
                                                style="margin-left: 7px;">
                                                <i class="feather icon-help-circle"></i>
                                            </span>
                                        </label>
                                        <input type="text" class="form-control clear_text_item" id="items_itemid"
                                            name="items_itemid" minlength="1" maxlength="20"
                                            placeholder="Enter SKU Code" autocomplete="off"
                                            onkeyup="PosnicPro.items.loadOnchangeSku();" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_barcodeid">
                                            <lang class="lang_barcode_title"> Barcode </lang>


                                            <span style="padding-left:50px">
                                                <input type="checkbox" class="custom-control-input" id="same_as_sku"
                                                    name="same_as_sku"
                                                    onclick="PosnicPro.items.sameAsSku(this.checked);" />
                                                <label class="custom-control-label" for="same_as_sku">
                                                    <span class="text-dark" style="font-size:11px;">
                                                        <lang class="lang_same_sku"> Same as SKU </lang>
                                                    </span>
                                                </label>
                                            </span>

                                        </label>
                                        <input type="text" class="form-control clear_text_item" id="items_barcodeid"
                                            name="items_barcodeid" minlength="1" maxlength="100"
                                            placeholder="Scan From Bar Code Reader" autocomplete="off">
                                        <!-- V3: manufacturer / extra codes; scanning any of them finds this item. -->
                                        <input type="text" class="form-control clear_text_item mt-2" id="items_barcodes_alt"
                                            name="items_barcodes_alt" maxlength="400"
                                            placeholder="Alternate barcodes (comma separated, optional)" autocomplete="off">
                                        <!-- V3: purchase-unit assist - "box of 24". Stock stays in base units. -->
                                        <div class="form-row mt-2">
                                            <div class="col-7">
                                                <input type="text" class="form-control clear_text_item" id="items_purchase_unit"
                                                    name="items_purchase_unit" maxlength="30"
                                                    placeholder="Purchase unit (e.g. box, optional)" autocomplete="off">
                                            </div>
                                            <div class="col-5">
                                                <input type="number" min="0" step="any" class="form-control clear_text_item" id="items_conversion_factor"
                                                    name="items_conversion_factor" placeholder="Units per pack" autocomplete="off">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_company_price">
                                            <lang class="lang_company_title"> Company </lang>
                                        </label>
                                        <input type="text"
                                            class="form-control allow_decimal text-right clear_text_item hide_price_digit"
                                            id="items_company_price" name="items_company_price" minlength="1"
                                            maxlength="7" value="0.00" placeholder="Company Price" autocomplete="off">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_mrp_price">
                                            <lang class="lang_mrp_title"> M.R.P </lang>
                                        </label>
                                        <input type="text"
                                            class="form-control allow_decimal text-right clear_text_item hide_price_digit"
                                            id="items_mrp_price" name="items_mrp_price" minlength="1" maxlength="7"
                                            value="0.00" placeholder="M.R.P" autocomplete="off">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_selling_price">
                                            <lang class="lang_sales_title"> Selling </lang><span class="text-danger">*</span>
                                        </label>
                                        <input type="text"
                                            class="form-control allow_decimal text-right clear_text_item hide_price_digit"
                                            id="items_selling_price" name="items_selling_price" minlength="1"
                                            maxlength="7" value="0.00" placeholder="Sale Price" autocomplete="off">
                                        <!-- The honest open-price state (IC1): a deliberate
                                             ask-at-the-till choice instead of an accidental 0.00. -->
                                        <div class="custom-control custom-checkbox mt-1">
                                            <input type="checkbox" class="custom-control-input" id="item_open_price"
                                                name="item_open_price">
                                            <label class="custom-control-label" for="item_open_price">
                                                <lang class="lang_open_price">Price at sale (open price)</lang>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_available_quantity">
                                            <lang class="lang_openquantity_title"> Quantity (Opening Stock) </lang>
                                        </label>
                                        <input type="text" class="form-control allow_decimal text-right clear_text_item"
                                            id="items_available_quantity" name="items_available_quantity" min="0"
                                            minlength="1" maxlength="10" value="0" placeholder="Available Quantity"
                                            autocomplete="off">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_sort">
                                            <lang class="lang_showitemposition_title"> Item Position </lang>
                                        </label>
                                        <input type="number"
                                            class="form-control allow_decimal text-right clear_text_item"
                                            id="items_sort" name="items_sort" minlength="1" maxlength="10" value="99"
                                            placeholder="Item list position" autocomplete="off">
                                    </div>

                                    <div class="col-md-6 m-t-9">
                                        <label class="form-control-placeholder" for="items_unit">
                                            Item Units
                                        </label>
                                        <select class="form-control select2 pricing-field items_unit items_choose_error"
                                            name="items_unit" id="items_unit">
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_mfg_date">
                                            <lang class="lang_mfg_title">Items MFG Date </lang>
                                        </label>
                                        <input type="text" class="form-control text-right" id="items_mfg_date"
                                            name="items_mfg_date" placeholder="Enter MFG 2001-01-01" autocomplete="off">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-control-placeholder" for="items_expiry_date">
                                            <lang class="lang_expiry_title">Items Expiry Date </lang>
                                        </label>
                                        <input type="text" class="form-control text-right" id="items_expiry_date"
                                            name="items_expiry_date" placeholder="Enter Expiry 2011-01-01"
                                            autocomplete="off">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card m-b-30" id="load_price_fields" style="display:none;">

                    </div>

                    <div class="card m-b-30">
                        <div class="card-body">
                            <div class="form-row">
                                <div class="col-md-12">
                                    <label class="form-control-placeholder" for="items_description">
                                        <lang class="lang_description_title"> Description </lang>
                                    </label>
                                    <textarea class="form-control" id="items_description" name="items_description"
                                        rows="4">

                                    </textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card m-b-30">
                        <div class="card-body">
                            <div class="form-row">

                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <div class="Neon Neon-theme-dragdropbox">
                                            <input type="hidden" id="item_upload_image_status" value="no">
                                            <input type="file" name="ImageItemMultiple[]" id="item_upload_image"
                                                onchange="PosnicPro.items.item_image_preview(this)"
                                                accept=".gif, .jpg, .png, .jpeg, .bmp" multiple>
                                            <div class="Neon-input-dragDrop">
                                                <div class="Neon-input-inner">
                                                    <div class="Neon-input-icon">
                                                        <i class="fa fa-file-image-o"></i>
                                                    </div>
                                                    <div class="Neon-input-text m-b-20">
                                                        <h3>
                                                            <lang class="lang_maxfile_title"> Maximum 12 files here
                                                            </lang>
                                                        </h3>
                                                    </div>
                                                    <a class="Neon-input-choose-btn blue">
                                                        <lang class="lang_filebrowse_title"> Browse</lang>
                                                    </a>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="form-row">
                                        <input type="hidden" name="item_logo" id="item_logo" value="item.svg">
                                        <div id="item-display-preview"></div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="card m-b-30">
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-3">
                                    <input type="checkbox" class="custom-control-input" id="item_track_inventory"
                                        name="item_track_inventory" checked>
                                    <label class="custom-control-label" for="item_track_inventory">
                                        <lang class="lang_tracknontrack_title">Tracking inventory </lang>
                                    </label>
                                </div>

                                <div class="form-group col-md-3">
                                    <input type="checkbox" class="custom-control-input" id="item_sales_channel"
                                        name="item_sales_channel" checked>
                                    <label class="custom-control-label" for="item_sales_channel">
                                        Sales channel
                                    </label>
                                </div>

                                <div class="form-group col-md-3">
                                    <input type="checkbox" class="custom-control-input" id="item_ecommerce"
                                        name="item_ecommerce">
                                    <label class="custom-control-label" for="item_ecommerce">
                                        Kiosk
                                    </label>
                                </div>

                                <div class="form-group col-md-3">
                                    <input type="checkbox" class="custom-control-input" id="item_negative_stock"
                                        name="item_negative_stock">
                                    <label class="custom-control-label" for="item_negative_stock">
                                        Negative stock
                                    </label>
                                </div>

                                <!-- Shown only when the weight-machine hardware module is on -
                                     the sales side only honours the flag then (items.js gates it). -->
                                <div class="form-group col-md-3" id="item_weight_flag_wrap" style="display:none;">
                                    <input type="checkbox" class="custom-control-input" id="item_weight_machine_based"
                                        name="item_weight_machine_based">
                                    <label class="custom-control-label" for="item_weight_machine_based">
                                        Weight Scale Item
                                    </label>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <!-- End col -->
                <!-- Start col -->
                <div class="col-lg-4 col-xl-4 loader-item">
                    <div class="card m-b-30">
                        <div class="card-header">
                            <h5 class="card-title">
                                <lang class="lang_choosecategory_title"> Select Category </lang><span
                                    class="text-danger">*</span>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <select id='items_category' name="items_category" style='width: 200px;'
                                        class="select2 items_category items_choose_error" required>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a data-module="category" data-access="write" href="#/items/categories/new"
                                class="btn btn-primary-rgba btn-lg btn-block">
                                <lang class="lang_add_category">Add Category</lang>
                            </a>
                        </div>
                    </div>

                    <div class="card m-b-30">
                        <div class="card-header">
                            <h5 class="card-title">
                                <lang class="lang_choosesupplier_title"> Select Supplier </lang>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <!-- Optional (IC1): items routinely arrive without a known
                                         supplier; receiving is the supplier system of record. -->
                                    <input type="text" class="form-control" id="items_supplier" name="items_supplier"
                                        maxlength="50" placeholder="Choose a Supplier (optional)" autocomplete="off">
                                    <input type="hidden" name="items_supplier_id" id="items_supplier_id">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a data-module="supplier" data-access="write" href="#/items/suppliers/new"
                                class="btn btn-primary-rgba btn-lg btn-block">
                                <lang class="lang_add_supply">Add Supplier</lang>
                            </a>
                        </div>
                    </div>

                    <div class="card m-b-30">
                        <div class="card-header">
                            <h5 class="card-title">
                                <lang class="lang_tax_title"> Tax </lang>
                            </h5>
                        </div>

                        <div class="col-md-12 m-t-10">
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="item_tax_default" name="hsntax_radio_value"
                                    class="custom-control-input click-tax-value" value="default" checked="checked">
                                <label class="custom-control-label" for="item_tax_default">
                                    <lang class="lang_default"> Default </lang><span class="text-danger">*</span>
                                </label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="item_tax_hsncode" name="hsntax_radio_value"
                                    class="custom-control-input click-tax-value" value="hsncode">
                                <label class="custom-control-label" for="item_tax_hsncode">
                                    <lang class="lang_hsn"> Hsn Code </lang>
                                </label>
                            </div>
                        </div>

                        <div class="form-group col-md-12" id="hsn_code_show" style="display: none;">
                            <div class="card-header">
                            </div>
                            <div class="">
                                <input type="text" class="form-control border-control hsnCode" id="items_hsncode"
                                    name="items_hsncode" maxlength="8" placeholder="Enter the HSN Code" autocomplete="off">
                                <input type="hidden" id="items_hsndescription">
                            </div>
                        </div>

                        <div class="col-md-12">
                            <input type="text" class="form-control" id="hsn_tax" name="hsn_tax" minlength="1"
                                maxlength="20" placeholder="Enter Hsn Tax" autocomplete="off">
                        </div>

                        <div class="col-md-12 m-t-10" id="default_tax">
                            <select class="form-control select2 pricing-field items_tax items_choose_error"
                                name="items_tax" id="items_tax" required>
                            </select>
                        </div>

                        <div class="col-md-12 m-t-10 m-b-10">
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="item_tax_inclusive" name="tax_radio_value"
                                    class="custom-control-input" value="inclusive" checked="checked">
                                <label class="custom-control-label" for="item_tax_inclusive">
                                    <lang class="lang_inclusive_title"> Inclusive </lang>
                                </label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="item_tax_exclusive" name="tax_radio_value" value="exclusive"
                                    class="custom-control-input">
                                <label class="custom-control-label" for="item_tax_exclusive">
                                    <lang class="lang_exclusive_title"> Exclusive </lang>
                                </label>
                            </div>
                        </div>
                    </div>


                    <div class="card m-b-30" id="show-hide-item-discount" style="display:none;">
                        <div class="card-header">
                            <h5 class="card-title">
                                <lang class="lang_discount_title"> Discount </lang>
                                <span id="item_discount" data-toggle="tooltip" data-placement="top" title=""
                                    data-original-title="This changes does not apply to Existing products">
                                    <i class="feather icon-help-circle"></i>
                                </span>
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="form-row">
                                <div class="form-group col-md-12">
                                    <div class="row">
                                        <div class="col-md-9">
                                            <div class="custom-control custom-radio custom-control-inline">
                                                <input type="radio" id="item_radio_discount_amount"
                                                    name="radio_discount" class="custom-control-input"
                                                    checked="checked">
                                                <label class="custom-control-label" for="item_radio_discount_amount">
                                                    <lang class="lang_amount_title"> Amount </lang>( <span
                                                        class="display-currency"></span> )
                                                </label>
                                            </div>
                                            <div class="custom-control custom-radio custom-control-inline">
                                                <input type="radio" id="item_radio_discount_percentage"
                                                    name="radio_discount" class="custom-control-input">
                                                <label class="custom-control-label"
                                                    for="item_radio_discount_percentage">
                                                    <lang class="lang_percentages"> Percentage </lang>( % )
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-3" style="padding: 0 !important;">
                                            <div class="floating-label">
                                                <input name="items_discount_amount" id="items_discount_amount"
                                                    type="text" aria-describedby="basic-addon1"
                                                    class="form-control border-control allow_decimal text-right" min="0"
                                                    minlength="1" maxlength="10" value="0">

                                                <input name="items_discount_percentage" id="items_discount_percentage"
                                                    type="number" aria-describedby="basic-addon1"
                                                    class="form-control border-control text-right" min="0" max="100"
                                                    minlength="1" maxlength="4"
                                                    onkeyup="this.value = PosnicPro.minmax(this.value, 0, 100)"
                                                    onkeypress="return PosnicPro.isNumber(event)" value="0">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="text-center">
                            <button type="button" class="btn btn-outline-secondary infobar-settings-reset"
                                id="items_reset" onclick="PosnicPro.items.itemClearForm();"><i
                                    class="feather icon-refresh-ccw mr-2"></i>
                                <lang class="lang_clear_title"> Clear</lang>
                            </button>
                            <button type="button"
                                class="btn btn-outline-secondary infobar-settings-reset items_edit_reset"
                                id="items_edit_reset"
                                onclick="PosnicPro.items.resetEditButton(this.getAttribute('data-id'));"><i
                                    class="feather icon-refresh-ccw mr-2"></i>
                                <lang class="lang_reset_title"> Reset</lang>
                            </button>
                            <button type="button" class="btn btn-outline-danger infobar-settings-close" data-id="item">
                                <i class="feather icon-x-circle mr-2"></i>
                                <lang class="lang_close_title"> Close</lang>
                            </button>
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="feather icon-save"></i>
                                <span id="item_button_title">
                                    <lang class="lang_save_title"> Save</lang>
                                </span>
                            </button>
                        </div>
                    </div>
                    <div class="form-row mt-3" id="show_last_created_item" style="display: none;">
                        <div class="form-group col-md-12">
                            <div class="text-center">
                                <h6>Last Created Record <a href="#" id="last_created_item">View</a></h6>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- End col -->
            </div>
        </form>
        <!-- End row -->
    </div>
</div>
