<!-- start change Password modal -->
<div class="modal fade" id="password_new" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><lang class="lang_changepassword_title">Change Password</lang></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" data-t-aria-label="lang_close_title">
                    <span aria-hidden="true"><lang class="lang_text">&times;</lang></span>
                </button>
            </div>
            <form id="changed_password">
                <div class="modal-body">                                                               
                    <input type='hidden' name='setting_status' id='setting_status'>
                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="old_password"><lang class="lang_currentpassword_title"> Current Password </lang> <span class="text-danger">*</span> </label>                            
                            <div class="input-group">
                                <input type="password" class="form-control border-control pass_valid" name="old_password" id="old_password" placeholder="Enter the password" data-t-placeholder="lang_entermobilenumber_title" autocomplete="new-password" required>
                                <div class="input-group-append current-show_hide_password">
                                    <span class="btn">
                                        <i class="fa fa-eye-slash"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="new_password"><lang class="lang_newpassword_title"> New Password </lang> <span class="text-danger">*</span> </label>                           
                            <div class="input-group">
                                <input type="password" class="form-control border-control pass_valid" name="new_password" id="new_password" placeholder="Enter the new password" data-t-placeholder="lang_enter_the_new_password" required autocomplete="new-password">
                                <div class="input-group-append new-show_hide_password">
                                    <span class="btn">
                                        <i class="fa fa-eye-slash"></i>
                                    </span>
                                </div>
                            </div> 
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="confirm_password"><lang class="lang_confirmpassword_title"> Confirm Password </lang> <span class="text-danger">*</span> </label>
                            <div class="input-group">
                                <input type="password" class="form-control border-control pass_valid" name="confirm_password" id="confirm_password" placeholder="Enter the confirm password" data-t-placeholder="lang_enter_the_confirm_password" required autocomplete="new-password">
                                <div class="input-group-append confirm-show_hide_password">
                                    <span class="btn">
                                        <i class="fa fa-eye-slash"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>                     
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" id="password_close" data-dismiss="modal">
                        <i class="feather icon-x-circle mr-2"></i> <lang class="lang_close_title"> Close</lang>
                    </button>
                    <button type="submit" class="btn btn-outline-primary"><i class="feather icon-save mr-2"></i><lang class="lang_save_title"> Save</lang></button>               
                </div>
            </form>
        </div>
    </div>
</div>
<!-- end changePassword modal -->

<div class="modal fade show" id="session-timeout-dialog" data-backdrop="static" data-keyboard="false" tabindex="-1" role="dialog" aria-hidden="true">              
    <div class="modal-dialog">                
        <div class="modal-content">                  
            <div class="modal-header">                                      
                <h4 class="modal-title"><lang class="lang_logging_out">Logging out...</lang></h4>                   
            </div>                   
            <div class="modal-body">                       
                <div class="pad_progress">  
                    <p class="fontt_style"><lang class="lang_redirecting_in">Redirecting in</lang> <span class="countdown-holder fontt_style">5s</span> <lang class="lang_seconds">seconds.</lang></p>    
                    <div class="progress">                  
                        <div class="progress-bar progress-bar-striped countdown-bar active" role="progressbar" style="min-width: 15px; width: 78%;">       
                            <span class="countdown-holder">25s</span>                   
                        </div>                
                    </div>    
                </div>
            </div>                 
        </div>              
    </div>              
</div>
