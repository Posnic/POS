name: Verify v1.6.2 release metadata
on:
  workflow_dispatch:
permissions:
  contents: write
  attestations: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download the draft macOS packages
        run: |
          test "$(gh api repos/Posnic/POS/releases/391685875 --jq .draft)" = true
          gh release download v1.6.2 --repo Posnic/POS --dir verified --pattern '*macos*' --pattern latest-mac.yml --pattern SHA256SUMS.txt
      - name: Verify package and inventory provenance
        run: |
          for file in verified/*.dmg verified/*.zip verified/*.cdx.json; do
            gh attestation verify "$file" --repo Posnic/POS --signer-workflow Posnic/POS/.github/workflows/release.yml --signer-digest 7ba57b5d7d7e7a312ac9a4f2b2b646f8a130b105 --deny-self-hosted-runners
          done
      - name: Verify final bytes and refresh DMG metadata
        run: node scripts/verify-release-162-metadata.cjs
      - name: Attach corrected update metadata to the draft
        run: |
          test "$(gh api repos/Posnic/POS/releases/391685875 --jq .draft)" = true
          gh release upload v1.6.2 --repo Posnic/POS corrected/latest-mac.yml corrected/*.blockmap --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: verified-mac-metadata
          path: corrected/*
          if-no-files-found: error
