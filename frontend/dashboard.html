<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            The shop's theme, before the first paint.

            themeManager applies it too, but it runs after five scripts and a
            stylesheet have loaded - long enough that a dark till flashed the
            default light theme on every navigation. The attribute is all the
            CSS needs, and it is one synchronous read of a value that is
            already on this machine.

            Deliberately does nothing but set an attribute. themeManager
            remains the only thing that decides what a theme means; this only
            stops the wrong one being visible while it gets there.
        -->
        <!-- BOOT FLIGHT RECORDER (owner: "add some temporary system and find
             out... i want know very exact reason"). An iOS memory-kill is
             silent and instant: no error event, no beacon, nothing. So the
             page stamps every boot stage and a 2s heartbeat (with the current
             hash) into localStorage - which SURVIVES the kill - and the NEXT
             open reads the previous session's record and beacons exactly
             where and when it died. First script in the page on purpose. -->
        <script>
            (function () {
                try {
                    var K = 'posnic_boot_flight';
                    var prev = null;
                    try { prev = JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { }
                    var now = Date.now();
                    var rec = { started: now, stages: ['head:0'], hash: location.hash, ua: navigator.userAgent.slice(0, 120), clean: false, booted: false };
                    /* set FIRST - the bisect trigger below reads it, and the
                       first shipped order had it defined only later, which
                       silently disarmed the whole search */
                    window.__mobileSafeMode = Math.min(screen.width || 9999, screen.height || 9999) < 820
                        && 'ontouchstart' in window;
                    window.__flight = {
                        stamp: function (name) {
                            try {
                                rec.stages.push(name + ':' + (Date.now() - rec.started));
                                if (name === 'booted-ok') { rec.booted = true; }
                                if (rec.stages.length > 40) { rec.stages.splice(1, rec.stages.length - 40); }
                                rec.hash = location.hash;
                                localStorage.setItem(K, JSON.stringify(rec));
                            } catch (e) { }
                        }
                    };
                    localStorage.setItem(K, JSON.stringify(rec));
                    /* Owner: "keep record everything ... every movement of
                       browser. when i refresh send previous records." Every
                       route, every tap, every background/foreground and
                       connectivity flip rides the record, so the report
                       reads as the device's last minutes, not one number. */
                    rec.moves = [];
                    function move(what) {
                        try {
                            rec.moves.push(Math.round((Date.now() - rec.started) / 100) / 10 + 's ' + what);
                            if (rec.moves.length > 25) { rec.moves.splice(0, rec.moves.length - 25); }
                            localStorage.setItem(K, JSON.stringify(rec));
                        } catch (e) { }
                    }
                    window.addEventListener('hashchange', function () { move('nav ' + location.hash.slice(0, 40)); });
                    /* Sentry-style capture INTO the record (owner: "any js
                       error or console error we can record like sentry
                       stuff?"): errors, rejections and console.error lines
                       ride the death report. Registered here, first script,
                       so nothing can throw earlier than we listen. */
                    window.addEventListener('error', function (ev) {
                        /* name the thing: a resource error has no message,
                           but its target says what failed to load - and four
                           nameless ones preceded every recorded death */
                        var t = ev && ev.target;
                        var what = (ev && ev.message)
                            || (t && t !== window && t.tagName
                                ? t.tagName + ' ' + String(t.currentSrc || t.src || t.href || '').slice(-55)
                                : 'err');
                        move('ERR ' + String(what).slice(0, 70));
                    }, true);
                    window.addEventListener('unhandledrejection', function (ev) {
                        var r = (ev && ev.reason) || {};
                        move('REJ ' + String(r.message || r).slice(0, 60));
                    });
                    try {
                        var origErr = console.error.bind(console);
                        console.error = function () {
                            try { move('CON ' + Array.prototype.join.call(arguments, ' ').slice(0, 60)); } catch (e12) { }
                            return origErr.apply(null, arguments);
                        };
                    } catch (e13) { }
                    /* API calls ride the record too (owner: "we can record
                       api calls etc?") - method, path, status, duration.
                       The one call still marked pending when a record ends
                       is the call that was in flight at death. */
                    try {
                        var origOpen = XMLHttpRequest.prototype.open;
                        var origSend = XMLHttpRequest.prototype.send;
                        XMLHttpRequest.prototype.open = function (m, u) {
                            try {
                                this.__fl = m + ' ' + String(u).replace(location.origin, '').split('?')[0].slice(0, 45);
                            } catch (e14) { }
                            return origOpen.apply(this, arguments);
                        };
                        XMLHttpRequest.prototype.send = function () {
                            var x = this, t0 = Date.now();
                            try {
                                /* boot-ladder rung: with noapi active nothing
                                   leaves the device - the skeleton boots
                                   alone, and its survival or death splits
                                   parse code from its API callbacks */
                                if (window.__posnicSkip === 'noapi' && String(x.__fl || '').indexOf('client-errors') === -1) {
                                    move('api-BLOCKED ' + x.__fl);
                                    return;
                                }
                                if (x.__fl && String(x.__fl).indexOf('client-errors') === -1) {
                                    move('api> ' + x.__fl);
                                    x.addEventListener('loadend', function () {
                                        move('api< ' + x.status + ' ' + (Date.now() - t0) + 'ms ' + x.__fl.split(' ')[1]);
                                    });
                                }
                            } catch (e15) { }
                            return origSend.apply(this, arguments);
                        };
                    } catch (e16) { }
                    document.addEventListener('click', function (ev) {
                        var t = ev.target || {};
                        var d = (t.tagName || '?') + (t.id ? '#' + t.id : '') +
                            (!t.id && t.className && t.className.slice ? '.' + String(t.className).split(' ')[0] : '');
                        move('tap ' + d.slice(0, 45));
                    }, true);
                    document.addEventListener('visibilitychange', function () {
                        move(document.hidden ? 'BACKGROUNDED' : 'foregrounded');
                    });
                    /*
                     * PHANTOM IMAGE GUARD, mechanism-level. An image whose
                     * src is empty resolves to THE PAGE URL: the browser
                     * fetches 900KB of HTML into its image decoder, per
                     * image, per render - and on iPhones that storm rides
                     * shotgun with every recorded death. Template audits
                     * keep missing sites (static, dynamic, single-quoted,
                     * attr()-assigned), so the DOCUMENT enforces it: any
                     * img born with or mutated to an empty-ish src becomes
                     * the transparent pixel before the fetch can matter.
                     */
                    try {
                        var PIXEL = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                        var healImg = function (el) {
                            try {
                                if (!el || el.tagName !== 'IMG') { return; }
                                var a = el.getAttribute('src');
                                if (a === '' || a === null || a === 'undefined' || a === 'null') { el.src = PIXEL; }
                            } catch (eh) { }
                        };
                        new MutationObserver(function (muts) {
                            for (var mi = 0; mi < muts.length; mi++) {
                                var mu = muts[mi];
                                if (mu.type === 'attributes') { healImg(mu.target); continue; }
                                for (var ni = 0; ni < mu.addedNodes.length; ni++) {
                                    var nd = mu.addedNodes[ni];
                                    if (!nd || nd.nodeType !== 1) { continue; }
                                    healImg(nd);
                                    if (nd.querySelectorAll) {
                                        var ims = nd.querySelectorAll('img');
                                        for (var ki = 0; ki < ims.length; ki++) { healImg(ims[ki]); }
                                    }
                                }
                            }
                        }).observe(document.documentElement, {
                            childList: true, subtree: true,
                            attributes: true, attributeFilter: ['src']
                        });
                    } catch (eo) { }
                    window.addEventListener('offline', function () { move('OFFLINE'); });
                    window.addEventListener('online', function () { move('online'); });
                    /* The record says death lands between bundle-parse
                       (~0.8s) and the first heartbeat (2s). These stamps
                       split that window: DOMContentLoaded and load bound
                       the script side; rAF ticks bound the RENDER side -
                       a record whose last word is dom-ready with no raf1
                       died in WebKit's first layout/paint of our CSS, not
                       in our JavaScript. Plus a 250ms micro-heartbeat for
                       the first six seconds. */
                    document.addEventListener('DOMContentLoaded', function () {
                        __flight.stamp('dom-ready');
                        var n = 0;
                        (function raf() {
                            n += 1;
                            if (n <= 3) { __flight.stamp('raf' + n); requestAnimationFrame(raf); }
                        })();
                    });
                    window.addEventListener('load', function () { __flight.stamp('win-load'); });
                    /* Mobile browsers fire resizes at boot that desktops
                       never see; a handler that re-triggers layout can storm.
                       Count them - a record ending in a huge resize count IS
                       the diagnosis. */
                    var resizes = 0;
                    window.addEventListener('resize', function () {
                        resizes += 1;
                        if (resizes <= 5 || resizes === 20 || resizes === 100 || resizes === 1000) {
                            move('resize#' + resizes + ' ' + window.innerWidth + 'x' + window.innerHeight);
                        }
                    });
                    var micro = setInterval(function () {
                        try {
                            rec.alive = Date.now() - rec.started;
                            if (rec.alive > 6000) { clearInterval(micro); return; }
                            localStorage.setItem(K, JSON.stringify(rec));
                        } catch (e) { }
                    }, 250);
                    setInterval(function () {
                        try {
                            rec.alive = Date.now() - rec.started;
                            rec.hash = location.hash;
                            if (window.performance && performance.memory) {
                                rec.mem = Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB';
                            }
                            localStorage.setItem(K, JSON.stringify(rec));
                        } catch (e) { }
                    }, 2000);
                    window.addEventListener('pagehide', function () {
                        try { rec.clean = true; localStorage.setItem(K, JSON.stringify(rec)); } catch (e) { }
                    });
                    /* PROBE: boots with every stylesheet disabled before
                       first paint. A device that dies at frame 2 normally
                       but SURVIVES naked proves the killer lives in CSS
                       layout/paint. Manual via ?nocss=1 - and AUTOMATIC:
                       storage was wiped by safe mode and the deaths kept
                       coming, so after three straight deaths the next boot
                       runs the probe by itself and reports both the attempt
                       and the outcome. */
                    var cd = 0;
                    try { cd = parseInt(localStorage.getItem(K + '_cdeaths') || '0', 10) || 0; } catch (e9) { }
                    if (prev && prev.started !== now && !prev.clean) { cd += 1; }
                    try { localStorage.setItem(K + '_cdeaths', String(cd)); } catch (e10) { }
                    /*
                     * SELF-DRIVING CSS BISECT, in the REAL page. The bare
                     * harness proved css+bundle alone survive - the kill
                     * needs the full DOM at first layout. So the search runs
                     * here: after 3 straight deaths, every boot disables the
                     * real sheets and applies HALF the candidate rules. Die =
                     * that half is guilty (iOS reloads us; the unfinished
                     * range narrows). Survive 12s = innocent half; advance
                     * and self-reload. ~14 crashes from ~10k rules to ONE,
                     * with a beacon at every step and a VERDICT at the end.
                     */
                    function beaconMsg(msg) {
                        try {
                            var pl = JSON.stringify({ message: '[boot-flight] ' + msg, at: 'boot-flight' });
                            if (navigator.sendBeacon) { navigator.sendBeacon('client-errors', new Blob([pl], { type: 'application/json' })); }
                        } catch (eb) { }
                    }
                    /*
                     * FUNCTION PROBER. The css bisect convicted different
                     * ranges on different runs - its kill signal was noise,
                     * and css is acquitted (naked boots die too). What every
                     * death shares is the RENDER of the boot responses. So
                     * the probe now cycles through skipping one render per
                     * death - sale menu, overview, store/features - set
                     * synchronously at head so the gate is armed before any
                     * response lands. A skip that survives 20s NAMES the
                     * killer render. Manual ?nocss=1 remains for css tests.
                     */
                    if (location.search.indexOf('nocss=1') !== -1) {
                        rec.probe = 'nocss';
                        document.addEventListener('DOMContentLoaded', function () {
                            try {
                                for (var si = 0; si < document.styleSheets.length; si++) {
                                    try { document.styleSheets[si].disabled = true; } catch (e2) { }
                                }
                                __flight.stamp('nocss-applied');
                            } catch (e3) { }
                        });
                    } else if (window.__mobileSafeMode && cd >= 3
                            && !localStorage.getItem('posnic_fresh_boot')) {
                        try {
                            var FP = 'posnic_fn_probe';
                            var SKIPS = ['noapi', 'hold', 'all', 'menu', 'overview', 'store'];
                            var fpi = parseInt(localStorage.getItem(FP) || '0', 10) || 0;
                            localStorage.setItem(FP, String(fpi + 1));
                            var skipName = SKIPS[fpi % SKIPS.length];
                            window.__posnicSkip = skipName;
                            rec.probe = 'skip-' + skipName;
                            beaconMsg('FNPROBE boot #' + fpi + ' skipping the "' + skipName + '" render');
                        } catch (efp) { }
                    }
                    /* A fresh build resets the streak and probes - the fix
                       it may carry deserves clean boots. Checked at DCL,
                       where the asset links exist. */
                    document.addEventListener('DOMContentLoaded', function () {
                        try {
                            var link = document.querySelector('link[href*="style/dashboard."]');
                            var jsEl = document.querySelector('script[src*="script/dashboard."]');
                            var buildId = (link ? link.getAttribute('href') : '') + '+' + (jsEl ? jsEl.getAttribute('src') : '');
                            if (localStorage.getItem('posnic_css_seen') !== buildId) {
                                localStorage.setItem('posnic_css_seen', buildId);
                                localStorage.setItem(K + '_cdeaths', '0');
                                localStorage.setItem('posnic_fn_probe', '0');
                                localStorage.setItem('posnic_fresh_boot', '1');
                                beaconMsg('FRESH BUILD ' + buildId.slice(-30) + ' - streak and probes reset');
                            }
                        } catch (efb) { }
                    });
                    /* Twenty seconds alive in a NORMAL boot resets the
                       death streak. */
                    setTimeout(function () {
                        try {
                            localStorage.setItem(K + '_cdeaths', '0');
                            localStorage.removeItem('posnic_fresh_boot');
                            if (rec.probe && rec.probe.indexOf('skip-') === 0) {
                                beaconMsg('FNPROBE "' + rec.probe.slice(5) + '" SURVIVED 20s - THE KILLER RENDER IS ' + rec.probe.slice(5).toUpperCase());
                            }
                        } catch (e11) { }
                    }, 20000);
                    /*
                     * MOBILE SAFE MODE (owner's order: "local storage or
                     * indexed db or service workers. those just stop and
                     * check first."). On phones, UNCONDITIONALLY at 0ms:
                     * unregister every worker, delete every cache, delete
                     * every IndexedDB database, and say so once per session.
                     * Every crash-free reproduction ran with these stores
                     * empty; the dying iPhone runs with months of them.
                     * If the deaths stop here, the storage layer is
                     * convicted and the subsystems return one at a time.
                     */
                    try {
                        var phoneish = window.__mobileSafeMode;
                        if (phoneish) {
                            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                                navigator.serviceWorker.getRegistrations().then(function (rs) {
                                    rs.forEach(function (r) { r.unregister().catch(function () { }); });
                                }).catch(function () { });
                            }
                            if (window.caches && caches.keys) {
                                caches.keys().then(function (ks) {
                                    ks.forEach(function (k) { caches.delete(k).catch(function () { }); });
                                }).catch(function () { });
                            }
                            try {
                                if (window.indexedDB && indexedDB.databases) {
                                    indexedDB.databases().then(function (dbs) {
                                        (dbs || []).forEach(function (d) {
                                            if (d && d.name) { try { indexedDB.deleteDatabase(d.name); } catch (e5) { } }
                                        });
                                    }).catch(function () { });
                                }
                            } catch (e6) { }
                            if (!sessionStorage.getItem('posnic_safemode_said')) {
                                sessionStorage.setItem('posnic_safemode_said', '1');
                                try {
                                    var payloadS = JSON.stringify({ message: '[boot-flight] SAFE-MODE active: worker unregistered, caches + indexeddb wiped on this phone boot', at: 'boot-flight' });
                                    if (navigator.sendBeacon) { navigator.sendBeacon('client-errors', new Blob([payloadS], { type: 'application/json' })); }
                                } catch (e7) { }
                            }
                        }
                    } catch (eq) { /* safe mode must never be a new failure */ }
                    /* A browser restoring a dead session brings its old URL
                       back with it - which greeted the owner with an empty
                       Add form after login ("why first showing add category
                       form after login?"). A restored ADD route is nobody's
                       intent: strip it to the list before the router runs. */
                    try {
                        /* panel-add routes only - never sales/new or
                           kotorder/new, which are real destinations */
                        if (/^#\/(customercategory|customers|suppliers|users|expenses|categories|variants)\/new$/.test(location.hash)) {
                            history.replaceState(null, '', location.pathname + location.search + location.hash.replace(/\/new$/, ''));
                        }
                    } catch (e8) { }
                    /* The previous session's verdict: died without pagehide =
                       the OS or the browser took the tab. Say precisely where. */
                    if (prev && prev.started !== now && !prev.clean) {
                        try { localStorage.removeItem('posnic_fresh_boot'); } catch (efr) { }
                        var line = '[boot-flight] previous session DIED ' +
                            (prev.booted ? 'AFTER booting' : 'DURING boot') +
                            ' at ~' + (prev.alive || 0) + 'ms on "' + (prev.hash || '?') + '"' +
                            (prev.mem ? ' heap ' + prev.mem : '') +
                            ' stages: ' + (prev.stages || []).slice(-6).join(' > ') +
                            ' moves: ' + (prev.moves || []).slice(-8).join(' | ') +
                            ' ua: ' + (prev.ua || '');
                        /* IMMEDIATELY - a session dying faster than any delay
                           would lose the previous session's report forever
                           (it did: four opens beaconed resource noise, zero
                           flight records arrived). sendBeacon is fire-and-
                           forget; it cannot slow the boot it rides on. */
                        try {
                            var payload = JSON.stringify({ message: line, at: 'boot-flight' });
                            if (navigator.sendBeacon) { navigator.sendBeacon('client-errors', new Blob([payload], { type: 'application/json' })); }
                            else {
                                var x = new XMLHttpRequest();
                                x.open('POST', 'client-errors', true);
                                x.setRequestHeader('Content-Type', 'application/json');
                                x.send(payload);
                            }
                        } catch (e) { }
                    }
                } catch (e) { /* the recorder must never be a failure itself */ }
            })();
        </script>
        <script>
            (function () {
                try {
                    var saved = JSON.parse(localStorage.getItem('posnic_theme_settings') || '{}');
                    if (saved && saved.preset && saved.preset !== 'default' && saved.preset !== 'custom') {
                        document.documentElement.setAttribute('data-theme', saved.preset);
                    }
                } catch (e) { /* the app applies it a moment later */ }
            }());
        </script>
        <!--
            The boot watchdog: a failed boot must never be a silent white page.

            Owner, after recovering one by clearing his own browser data:
            "i dont want users to face these kind of errors."

            The white page it answers: an uncaught throw inside a ready
            handler killed the code that reveals the layout, every request
            answered 200, and the only witness was a console nobody had open.
            The user's screen said NOTHING - not broken, not loading, just
            white - and the working recovery (clear this origin's data) is
            something no shopkeeper could guess.

            So: dependency-free, inline in the head - it must work when the
            bundle itself is what died. It captures the first uncaught error,
            posts it to the shop's own log (api/client-errors), and if the
            layout has not appeared after fifteen seconds it draws a plain
            recovery card: keep waiting, reload, or reset cached data - the
            exact fix the owner performed by hand, as one button. Resetting
            signs the till out; server data is untouched, and the card says
            so.
        -->
        <script>
            (function () {
                var firstError = null;
                var reported = false;
                /* Every capture, not just the first. Owner, staring at a card
                   with no error line: "i want to know exact exception and or
                   coding part of cause." One line was never going to answer
                   that; the journal below is what View details shows. */
                var journal = [];

                function note(kind, message, at, stack) {
                    var msg = String(message || 'unknown').slice(0, 300);
                    var refresh = function () {
                        var box = document.getElementById('pbh_details_body');
                        if (box) { box.textContent = detailsText(); }
                    };
                    /* Identical repeats collapse into one line with a count.
                       The first journal the owner pasted was twelve copies of
                       two missing images - noise that filled the book and
                       EVICTED whatever the real exception was. */
                    for (var i = 0; i < journal.length; i++) {
                        if (journal[i].kind === kind && journal[i].message === msg) {
                            journal[i].times += 1;
                            refresh();
                            return;
                        }
                    }
                    /* And resource noise never crowds out real exceptions:
                       failed loads get half the book at most. */
                    if (kind === 'resource') {
                        var resources = 0;
                        for (var j = 0; j < journal.length; j++) {
                            if (journal[j].kind === 'resource') { resources += 1; }
                        }
                        if (resources >= 6) { return; }
                    }
                    if (journal.length >= 12) { return; }
                    journal.push({
                        kind: kind,
                        message: msg,
                        at: String(at || '').slice(0, 240),
                        stack: String(stack || '').slice(0, 1500),
                        times: 1
                    });
                    refresh();
                }

                function report(err, at) {
                    if (reported) { return; }
                    reported = true;
                    try {
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', 'api/client-errors', true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.send(JSON.stringify({
                            message: String((err && err.message) || err || 'unknown').slice(0, 300),
                            stack: String((err && err.stack) || '').slice(0, 1200),
                            at: String(at || location.href).slice(0, 200),
                            /* The same journal View details shows, so the
                               shop's own log carries the exact exception and
                               place - readable remotely, no screenshot
                               round-trip. */
                            journal: journal.slice(0, 3).map(function (e) {
                                return e.kind + ' ' + e.message.slice(0, 120) + ' @ ' + e.at.slice(0, 120);
                            })
                        }));
                    } catch (e) { /* reporting must never add a second failure */ }
                }

                /* CAPTURE phase, one listener, two different failures:
                   a JS error (target is window, has a message) and a resource
                   that failed to LOAD - a script or stylesheet 404ing after a
                   deploy - which never reaches window.onerror at all and was
                   this watchdog's blind spot: the whole app missing, the card
                   showing, and not one line saying why. */
                window.addEventListener('error', function (ev) {
                    var t = ev.target;
                    if (t && t !== window && (t.src || t.href)) {
                        /* A dynamic img whose src ended up '' or 'undefined'
                           resolves to the PAGE URL and "fails". That is our
                           own template bug, not an outage: heal it to the
                           placeholder pixel and keep it out of the journal -
                           this noise once burned the whole beacon budget
                           while a real stylesheet 404 waited behind it. */
                        var u = String(t.src || t.href);
                        if (t.tagName === 'IMG' && (
                                u === '' || u === location.href ||
                                u === location.origin + '/' ||
                                /\/(undefined|null)$/.test(u) ||
                                /\/dashboard\.html$/.test(u))) {
                            t.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
                            return;
                        }
                        var what = (t.tagName || 'resource').toLowerCase() + ' failed to load: ' + (t.src || t.href);
                        /* THIRD-PARTY scripts (Cloudflare Insights, blocked
                           by every content blocker) are not our outage and
                           must not spend the beacon budget - four of them
                           once crowded out the flight records this page
                           exists to deliver. Journal locally, never beacon. */
                        var sameOrigin = String(t.src || t.href).indexOf(location.origin) === 0;
                        if (!firstError) { firstError = what; }
                        note('resource', what, location.href, '');
                        if (sameOrigin) { report(what, 'resource-load'); }
                        /* A page whose own STYLESHEET or main SCRIPT died is
                           holding a bundle pairing that no longer exists (a
                           deploy passed under an open tab, or a wedged cache
                           served half a build). One fresh navigation re-pairs
                           it with the current build; the sessionStorage guard
                           makes it ONE - a still-broken origin never loops. */
                        try {
                            var isOwn = /\/(style|script)\/(dashboard|login)\.[0-9a-f]{8}\.(css|js)/.test(String(t.href || t.src));
                            if (isOwn && !sessionStorage.getItem('posnic_repair_reload')) {
                                sessionStorage.setItem('posnic_repair_reload', '1');
                                location.reload();
                            }
                        } catch (e) { /* storage blocked: stay put, the card will tell */ }
                        return;
                    }
                    if (!firstError) { firstError = ev.message || 'Script error'; }
                    note('error', ev.message || 'Script error',
                        (ev.filename || '') + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0),
                        ev.error && ev.error.stack);
                    report(ev.error || ev.message, ev.filename + ':' + ev.lineno);
                }, true);
                window.addEventListener('unhandledrejection', function (ev) {
                    var r = ev.reason || {};
                    if (!firstError) { firstError = String(r.message || r); }
                    note('rejection', r.message || r, 'unhandled promise rejection', r.stack);
                    report(r, 'unhandledrejection');
                });

                function detailsText() {
                    if (!journal.length) {
                        return 'No JavaScript exception was caught.\n\n' +
                            'The layout never appeared, which usually means a network call ' +
                            'that never answered, or this browser is holding a page from an ' +
                            'older update (Reset cached data fixes that).\n\n' +
                            'Page: ' + location.href;
                    }
                    var out = '';
                    for (var i = 0; i < journal.length; i++) {
                        var e = journal[i];
                        out += (i + 1) + '. [' + e.kind + '] ' + e.message +
                            (e.times > 1 ? '  (×' + e.times + ')' : '') +
                            '\n   at ' + e.at + '\n';
                        if (e.stack) { out += e.stack.split('\n').slice(0, 6).join('\n') + '\n'; }
                        out += '\n';
                    }
                    return out + 'Page: ' + location.href;
                }

                /* Booted = the sidebar is actually PAINTED. It exists in the
                   markup from the start, so visibility is the test - during
                   the white page it measured 0 high.

                   ANY sidebar, not the first: the layout carries one
                   .vertical-menu per SECTION (dashboard, sale, Manage,
                   reports) and shows exactly one. The first belongs to the
                   dashboard - so on a direct load of a settings route this
                   watchdog measured a menu that was legitimately hidden,
                   declared the boot dead at 15s, and dropped its opaque card
                   over a working page. Reload landed on settings again, 15
                   seconds, card again - the owner's "every few seconds its
                   breaking, whenever i go to module page" WAS THIS WATCHDOG,
                   crying wolf on a page that was fine underneath. */
                function booted() {
                    var menus = document.querySelectorAll('.vertical-menu, .vertical-menu-icon');
                    for (var i = 0; i < menus.length; i++) {
                        if (menus[i].offsetHeight > 0) { return true; }
                    }
                    return false;
                }

                function resetData() {
                    try { localStorage.clear(); } catch (e) { }
                    try { sessionStorage.clear(); } catch (e) { }
                    try {
                        if (indexedDB && indexedDB.databases) {
                            indexedDB.databases().then(function (dbs) {
                                (dbs || []).forEach(function (d) {
                                    try { indexedDB.deleteDatabase(d.name); } catch (e) { }
                                });
                                location.reload();
                            });
                            setTimeout(function () { location.reload(); }, 1500);
                            return;
                        }
                    } catch (e) { }
                    location.reload();
                }

                function show() {
                    if (document.getElementById('posnic_boot_help')) { return; }
                    /* Say so in the console: the rig greps for this, and a
                       card that appears silently cannot be told apart from a
                       page that hung. */
                    try { console.log('[watchdog] boot card shown at ' + location.hash); } catch (e) { }
                    var card = document.createElement('div');
                    card.id = 'posnic_boot_help';
                    /* TRANSLUCENT, deliberately. The solid backdrop made every
                       card look like a dead white page - including the false
                       alarm above, where the page behind it was working. */
                    card.setAttribute('style',
                        'position:fixed;inset:0;z-index:2147483000;background:rgba(244,245,247,.9);display:flex;' +
                        'align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Arial,sans-serif;');
                    card.innerHTML =
                        '<div style="max-width:460px;background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:26px 28px;box-shadow:0 12px 34px rgba(0,0,0,.12);">' +
                        '<div style="font-size:18px;font-weight:600;color:#16203a;margin-bottom:6px;">The till is taking too long to load</div>' +
                        '<p style="font-size:14px;color:#3a4459;line-height:1.5;margin:0 0 14px;">This can happen on a slow connection, or after an update. Reloading usually fixes it. If it keeps happening, reset the cached data - that signs this browser out, and nothing on the server is touched.</p>' +
                        (firstError
                            ? '<div style="font-size:11.5px;color:#8a94a6;font-family:ui-monospace,Consolas,monospace;background:#f6f7fb;border-radius:6px;padding:8px 10px;margin-bottom:14px;word-break:break-all;">' + String(firstError).slice(0, 160).replace(/[<>&]/g, '') + '</div>'
                            : '') +
                        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                        '<button id="pbh_wait" style="min-height:40px;padding:0 14px;border:1px solid #dfe3e8;border-radius:8px;background:#fff;color:#16203a;font-size:14px;cursor:pointer;">Keep waiting</button>' +
                        '<button id="pbh_reload" style="min-height:40px;padding:0 14px;border:0;border-radius:8px;background:#506fe4;color:#fff;font-size:14px;cursor:pointer;">Reload</button>' +
                        '<button id="pbh_reset" style="min-height:40px;padding:0 14px;border:1px solid #f04438;border-radius:8px;background:#fff;color:#f04438;font-size:14px;cursor:pointer;">Reset cached data &amp; reload</button>' +
                        '<button id="pbh_details" style="min-height:40px;padding:0 14px;border:1px solid #dfe3e8;border-radius:8px;background:#fff;color:#54627f;font-size:14px;cursor:pointer;">View details</button>' +
                        '</div>' +
                        '<div id="pbh_details_wrap" style="display:none;margin-top:12px;">' +
                        '<pre id="pbh_details_body" style="max-height:220px;overflow:auto;font-size:11px;line-height:1.45;font-family:ui-monospace,Consolas,monospace;background:#16203a;color:#dbe3f4;border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-all;margin:0 0 8px;"></pre>' +
                        '<button id="pbh_copy" style="min-height:32px;padding:0 12px;border:1px solid #dfe3e8;border-radius:6px;background:#fff;color:#16203a;font-size:12.5px;cursor:pointer;">Copy details</button>' +
                        '</div></div>';
                    document.body.appendChild(card);
                    document.getElementById('pbh_wait').addEventListener('click', function () {
                        card.parentNode.removeChild(card);
                        setTimeout(function () { if (!booted()) { show(); } }, 20000);
                    });
                    document.getElementById('pbh_reload').addEventListener('click', function () { location.reload(); });
                    document.getElementById('pbh_reset').addEventListener('click', resetData);
                    /* "add some button or option view details. i want to know
                       exact exception and or coding part of cause" - the
                       journal, verbatim: every caught exception with its
                       file:line:column and stack, every resource that failed
                       to load, or an honest sentence when nothing was caught. */
                    document.getElementById('pbh_details').addEventListener('click', function () {
                        var wrap = document.getElementById('pbh_details_wrap');
                        var open = wrap.style.display !== 'none';
                        wrap.style.display = open ? 'none' : 'block';
                        this.textContent = open ? 'View details' : 'Hide details';
                        if (!open) { document.getElementById('pbh_details_body').textContent = detailsText(); }
                    });
                    document.getElementById('pbh_copy').addEventListener('click', function () {
                        var text = detailsText();
                        var done = function () { document.getElementById('pbh_copy').textContent = 'Copied'; };
                        try {
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(text).then(done, function () {});
                                return;
                            }
                        } catch (e) { }
                        try {
                            var ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                            done();
                        } catch (e) { }
                    });
                }

                setTimeout(function () { if (!booted()) { show(); } }, 15000);
                /* flight recorder: note the moment boot visibly succeeded */
                var bootedPoll = setInterval(function () {
                    if (booted()) {

                        try { window.__flight && __flight.stamp('booted-ok'); } catch (e) { }
                    }
                }, 1000);
            }());

        <!--
            Cover the till before it draws anything.

            The lock used to go up after the page had loaded, so whoever picked
            the machine up saw the dashboard - takings, customer names, the last
            sale - for as long as the scripts took to run, and only then got
            asked who they were. A lock you can read behind is not a lock.

            This runs first, before any stylesheet or script, and decides from
            localStorage alone: no network, no IPC, nothing to wait for. It is
            deliberately pessimistic - it hides on what it knew last time and
            lets lock-screen.js uncover once it has decided properly.

            The timeout is the important part. If lock-screen.js never runs -
            an error, a missing file, a shop that turned the lock off on
            another machine - the cover comes off by itself. A till that will
            not draw is worse than one that draws too early.
        -->
        <script>
            (function () {
                if (navigator.userAgent.indexOf('Electron') === -1) return;
                try {
                    var settings = JSON.parse(localStorage.getItem('general_settings') || '{}');
                    if (settings.till_lock_enable !== true) return;
                    if (localStorage.getItem('lock.enrolled') !== 'yes') return;
                } catch (e) {
                    return;
                }
                document.documentElement.className += ' lock-pending';
                var style = document.createElement('style');
                style.id = 'lock_pending_style';
                style.textContent =
                    'html.lock-pending body > *:not(#posnic-lock){visibility:hidden !important;}'
                    + 'html.lock-pending{background:#101725;}';
                document.head.appendChild(style);
                window.__posnicUncover = function () {
                    document.documentElement.className =
                        document.documentElement.className.replace(/\s*lock-pending\b/, '');
                };
                setTimeout(window.__posnicUncover, 5000);
            }());
        </script>

                    addItem('☁️ Cloud Sync', 'cloud');
                }).catch(() => {});

                fab.querySelector('.fab-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    fab.classList.toggle('open');
                });
                document.addEventListener('click', () => fab.classList.remove('open'));

                // --- Tray branch switching ---------------------------------
                // Mirror the header's branch dropdown into the tray menu, and
                // run the app's own switch flow (incl. open-register guard)
                // when a branch is picked from the tray.
                if (window.electronAPI.tray) {
                    const harvestBranches = () => {
                        const items = document.querySelectorAll('#change_branch_list a[data-id]');
                        if (!items.length) return;
                        const branches = Array.from(items).map((a) => ({
                            id: a.getAttribute('data-id'),
                            name: (a.textContent || '').trim()
                        })).filter((b) => b.id && b.name);
                        const currentName = (document.querySelector('.branch-name, #current_branch_name')?.textContent || '').trim() || null;
                        if (branches.length) {
                            window.electronAPI.tray.setBranches({ branches, currentName });
                        }
                    };
                    const list = () => document.getElementById('change_branch_list');
                    const arm = () => {
                        const el = list();
                        if (!el) return setTimeout(arm, 2000);
                        new MutationObserver(harvestBranches).observe(el, { childList: true, subtree: true });
                        harvestBranches();
                    };
                    arm();

                    window.electronAPI.tray.onSwitchBranch((id) => {
                        if (window.PosnicPro?.branches?.showChange) {
                            PosnicPro.branches.showChange(id);
                        } else {
                            window.location.hash = '#/branches/' + id + '/change';
                        }
                    });
                }
            })();
        </script>
        <script>
        /* Static-asset service worker (web / LAN counters only). The desktop
           shell is skipped: its assets are local files owned by the installer
           and asset-updater. Cache invalidation is the worker's own contract -
           its cache name carries the build hash, so a server deploy replaces
           every cached bundle on the next navigation. */
        /* MOBILE SAFE MODE (owner: "local storage or indexed db or service
           workers. those just stop and check first."): phones get NO worker
           until the iOS crash is closed - and window.__mobileSafeMode (set
           by the flight recorder, which also wipes the stores) is the flag. */
        if ('serviceWorker' in navigator && navigator.userAgent.indexOf('Electron') === -1
                && !window.__mobileSafeMode) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
            });
        }
    </script>
