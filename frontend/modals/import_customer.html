<!-- start import customer-->
<div class="modal fade close_on_esc" id="import_modal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <!-- start import customer form -->
            <form enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title"><lang class="lang_importtitle">Import <span id="importHeading"></span> Details</lang></h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row justify-content-center">
                        <!-- Start col -->
                        <div class="col-md-12 col-lg-10 col-xl-10">                  
                            <!-- start row-->
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="file-upload">
                                        <div class="file-select">
                                            <div class="file-select-button" id="fileName"><lang class="lang_choosefile_title">Choose File </lang></div>
                                            <div class="file-select-name" id="noFile"><lang class="lang_nofilechosen_title">No file chosen...</lang></div>
                                            <input type="file" name="files" class="files"
                                                   accept=".csv"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="progressBar" style="display:none;">
                                <div id="loadingBar"></div>
                            </div>
                            <br>
                            <div class="hide-import-table" style="max-height: 200px; width: auto; overflow-y: scroll; display: none;">
                                <table class="table import-table">
                                    <thead class="import-datatable-thead"></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <!-- End row-->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" data-dismiss="modal"><i class="feather icon-x-circle mr-2"></i><lang class="lang_close_title">Close </lang>
                    </button>
                    <a href='#' class="importFileFormat">
                        <button type="button" class="btn btn-outline-primary">
                            <span> <lang class="lang_csvsample_title"> <i class="feather icon-download mr-2"></i> CSV Sample</lang></span>
                        </button>
                    </a>
                </div>
                <div id="errorMessages" class="text-danger"></div>
                <table class="table table-bordered" id="errorTable" style="display:none;">
                    <thead>
                        <tr>
                            <th class="hide-import-tables text-danger">Row</th>
                            <th class="hide-import-tables text-danger">Item Name</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </form>
            <!-- end import customer form  -->
        </div>
    </div>

</div>
<!-- end import customer  -->
