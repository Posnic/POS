# Contributor Licence Agreement check.
#
# Why this exists: the DCO we already require certifies provenance under
# AGPL-3.0-only. It grants no right to distribute a contribution under any other
# terms, so it cannot support a paid edition. The CLA adds the sublicense right
# and nothing else; contributors keep their copyright.
#
# Signatures are stored in this repository on a branch of their own, so there is
# no third-party service holding the record and no external account to lose.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on pull requests, and on comments that belong to one.
    if: >
      github.event.issue.pull_request ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Posnic/POS/blob/develop/.github/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],sridharkalaibala,sridharposnic
          custom-notsigned-prcomment: >
            Thank you for this. Before it can be merged we need a one-line
            signature on our
            [Contributor Licence Agreement](https://github.com/Posnic/POS/blob/develop/.github/CLA.md).
            You keep the copyright in your work; the agreement lets Posnic ship
            your contribution in the paid edition alongside the AGPL release.
            To sign, reply to this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
          lock-pullrequest-aftermerge: false
