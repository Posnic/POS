<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can't reach the till server</title>
<style>
  /* Self-contained on purpose: this page is served from the service worker
     cache when the network is down, so it can depend on nothing. */
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#f2f3f7; color:#16203a; }
  .card { max-width:420px; background:#fff; border-radius:12px; padding:32px 36px;
          box-shadow:0 10px 30px rgba(0,0,0,.10); text-align:center; }
  h1 { font-size:20px; margin:0 0 12px; }
  p  { font-size:14px; line-height:1.55; color:#3a4459; margin:0 0 10px; }
  button { margin-top:14px; padding:10px 22px; font-size:14px; font-weight:600; color:#fff;
           background:#506fe4; border:0; border-radius:8px; cursor:pointer; }
  @media (prefers-color-scheme: dark) {
    body { background:#141824; color:#e8eaf0; }
    .card { background:#1d2333; box-shadow:0 10px 30px rgba(0,0,0,.4); }
    p { color:#aab2c5; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach the till server</h1>
    <p>This screen lost its connection to the shop's till. <strong>Sales continue
       normally on the till itself</strong>, so nothing is lost.</p>
    <p>This page retries by itself and will recover the moment the connection
       is back.</p>
    <button onclick="location.reload()">Try now</button>
  </div>
  <script>setInterval(function () { location.reload(); }, 7000);</script>
</body>
</html>
