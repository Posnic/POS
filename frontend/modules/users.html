<div class="vertical-layout page_loader" id="users" style="display: none">
    <!-- Start Containerbar -->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-auto mr-auto d-flex align-items-center">
                    <h4 class="page-title mb-0 mr-3"> <lang class="lang_user_title">Employees</lang></h4>
                    <!-- Users and Roles are one place now: two tabs, one
                         subject - styled like the Core Settings tabs. -->
                    <ul class="nav nav-tabs users-roles-tabs">
                        <li class="nav-item"><a class="nav-link active" href="#/users"><i class="feather icon-users mr-2"></i><lang class="lang_user_title">Employees</lang></a></li>
                        <li class="nav-item"><a class="nav-link" data-module="user" data-access="write" href="#/roles"><i class="feather icon-shield mr-2"></i><lang class="lang_roles_title">Roles</lang></a></li>
                    </ul>
                </div>
                <div class="col-auto show-button-action"></div>
                <div class="col-lg-3 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <div id="view_users_daterange" class="form-control pull-right daterange-timepicker-all daterange-style date-align">
                        <i class="feather icon-calendar"></i>&nbsp;
                        <span></span>
                    </div>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <select class="custom-select border-control" id="view_users_fields" data-id="users" onchange="PosnicPro.changePlaceholder(this)" aria-label="View users fields">
                        <option value="username" selected>
                        <lang class="lang_name_title">Name</lang>
                        </option>
                        <option value="email">
                        <lang class="lang_email_title">Email</lang>
                        </option>
                    </select>
                </div>
                <div class="col-lg-2 col-xl-2 hide-button-action tb_filter" style="display:none;">
                    <input type="text" class="form-control border-control custom_search_input" id="view_users_input"
                           placeholder="Enter Name" data-id="users" maxlength="25"  autocomplete="off">
                </div>
                <div class="col-md-2 col-lg-2 col-xl-2 adjuce_left tb_search hide-button-action" style="display:none;">
                    <button type="button" class="btn btn-danger-rgba" data-id="users" onclick="PosnicPro.dateRangefilterClear(this)">
                        <lang class="lang_clear_title">Clear</lang>
                    </button>
                    <button type="button" class="btn btn-primary-rgba" data-id="users" onClick="PosnicPro.search(this, 'Table')">
                        <lang class="lang_filter_title">Apply</lang>
                    </button>
                </div>
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" class="btn btn-round btn-primary-rgba click-action-button adjuce_left" data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                        <a data-module="user" data-access="write" href='#/users/new' onClick="PosnicPro.users.addUserButton();" class="btn btn-primary-rgba dash_sale_count add_new_tooltip" data-toggle="tooltip" title="New User">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>                       
                    </div>
                </div>                        
            </div> 
            <div class="row">
                <div class="col-md-3"></div>
                <div class="col-md-6 col-xl-9 mobile-hide tb_date_range">
                    <p>
                        <span class="badge badge-secondary-inverse hide_date_filetr" style="display:none;">
                            <span class="view_users_date_filter_value"></span>
                        </span>
                        <span class="badge badge-secondary-inverse hide_value_filetr" style="display:none;">
                            <span class="view_users_filter_value"></span>

                        </span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Contentbar -->
    <div class="contentbar">
        <!-- Start row -->
        <div class="row">
            <!-- Start col -->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header user_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_users_per_page" data-id="users" onChange="PosnicPro.setPerPage(this, 'Table');" aria-label="View users per page">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item">
                                                <a data-module="user" data-access="read" href="#/users" id="users_exportbtn" class="sale_color" onClick="PosnicPro.users.exportUsers();" data-toggle="tooltip" title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a data-module="user" data-access="delete" href="#/users" id="users_deletebtn" class="sale_color" onclick="PosnicPro.users.deleteSelectedUsers();" data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a href="javascript:PosnicPro.refreshDatatable('users')" data-id="suppliers" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-user">
                        <div class="table-responsive">
                            <table class="table table-borderless m-cards" id="view_users">
                                 <div class="col-sm-6 col-md-12 col-lg-12" id="user_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid" style="opacity: 0.6;width: 100%;height: 250px;" alt="" loading="lazy" decoding="async">
                                </div>
                                <div class="user_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>
                                <thead class="datatable-thead-tbody table-header user_header"></thead>
                                <tbody class="datatable-thead-tbody table-body user_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 user_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing 
                                    <b><span id="view_users_page_total"></span></b> 
                                    to 
                                    <b><span id="view_users_page_perpage_total"></span></b> 
                                    of 
                                    <b><span id="view_users_total"></span></b> 
                                    entries 
                                    <span class="showing-hide-show-users" style="display:none;"> &nbsp;&nbsp;&nbsp;&nbsp; 
                                        <span class="showing-value-users text-dark"> 0 </span>&nbsp; 
                                        rows selected  
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="users" onclick="PosnicPro.previousPage(this, 'Table')" aria-label="Previous page"> <i class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="users" onclick="PosnicPro.nextPage(this, 'Table')" aria-label="Next page"> <i class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>                                
                    </div>
                </div>
            </div>
            <!-- End col -->
        </div>
        <!-- End row -->
    </div>
    <!-- End Contentbar -->
</div>
<!-- End Containerbar -->
