<div class="vertical-layout page_loader" id="expiryreport" style="display:none"><div id="containerbar"><div class="breadcrumbbar crumbbar_padding">
<div class="d-flex justify-content-between align-items-center mb-3"><h4><lang class="lang_expiry_report">Expiring products report</lang></h4><a class="btn btn-outline-primary" href="#/itemsettings"><lang class="lang_item_settings">Item settings</lang></a></div></div></div><div class="contentbar">
<div class="card"><div class="card-body"><p><lang class="lang_expiry_report_help">Products with stock and a saved expiry date. Available even when reminders are off.</lang></p>
