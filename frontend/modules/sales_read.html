<div class="vertical-layout page_loader" id="sales" style="display: none">
    <!--Start Containerbar-->
    <div id="containerbar">
        <div class="breadcrumbbar crumbbar_padding">
            <div class="row align-items-center row_filter">
                <div class="col-lg-2 col-xl-2">
                    <h4 class="page-title">
                        <lang class="lang_salehistory_title">Sales History</lang>
                    </h4>
                </div>
                <div class="col-md-8 col-lg-8"></div>

                <!--
                    The shared filter bar (list-filter.js), same as the item
                    list. It replaces a date range, a field selector, a search
                    box and an Apply/Clear pair that were revealed as a group by
                    the Filter button.

                    That arrangement could not say a filter was ON: the panel
                    closes and takes the controls with it, so a history narrowed
                    to one customer looks like a shop with one customer. The
                    count on the button shows whether or not the panel is open.

                    The old ids are REMOVED, not hidden. Leaving #view_sales_input
                    in the markup with nothing writing to it is how the quotes
                    search bug worked - a selector still reading, from an input
                    nobody can see.
                -->
                <div class="col-lg-12 col-xl-2 tb_widget">
                    <div class="widgetbar">
                        <button type="button" id="sales_filter_btn"
                            class="btn btn-round btn-primary-rgba adjuce_left add_new_tooltip lf-btn"
                            data-toggle="tooltip" title="Filter">
                            <i class="feather icon-filter" aria-hidden="true"></i>
                        </button>
                        <a id="sales_new_button" data-module="sales" data-access="write" href='#/sales/new'
                            class="btn btn-primary-rgba dash_sale_count" data-toggle="tooltip" title="New Sale">
                            <i class="feather icon-plus mr-2"></i>
                            <lang class="lang_addvariant_title">New</lang>
                        </a>

                    </div>
                </div>

            </div>
            <div class="row">
                <div class="col-12">
                    <div id="sales_filter_panel" class="lf-panel" style="display:none;"></div>
                </div>
            </div>
            <!--
                KEPT DELIBERATELY, and not a filter control any more.

                Twenty other modules - branches, lowstock, receiving_add and
                every report - read THIS element to label their own empty
                states: $('#view_sales_daterange span span[data-toggle=tooltip]')
                .attr('data-original-title'), rendered as "No Records on <range>".
                It became the shared date label because it carries
                .daterange-timepicker-all, which PosnicPro.dashboard.datePicker
                keeps in step across pages.

                So deleting it with the rest of the old filter row would not have
                broken this screen - it would have put "No Records on undefined"
                on twenty others, none of which are being touched here. That is
                a worse trade than keeping one hidden element, and untangling it
                (each screen should label with its OWN range, or say nothing) is
                its own piece of work rather than a side effect of this one.

                Hidden rather than removed for exactly that reason. The bar owns
                the date filtering on this page now; this only carries the label.
            -->
            <div id="view_sales_daterange"
                 class="daterange-timepicker-all daterange-style" style="display:none;">
                <span></span>
            </div>
            <!--
                The "filtering by X" badges are gone with the controls that fed
                them - PosnicPro.search was the only thing that ever wrote them,
                and the button's count states the same fact where it can be seen
                with the panel closed.
            -->
        </div>
    </div>

    <!--Start Contentbar-->
    <div class="contentbar">
        <!--Start row-->
        <div class="row">
            <!--Start col-->
            <div class="col-lg-12">
                <div class="card m-b-30">
                    <div class="card-header sales_header">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <ul class="list-inline-group text-left mb-0 pl-0">
                                    <li class="list-inline-item">
                                        <div class="form-group mb-0 amount-spent-select selecct-align">
                                            <select class="form-control select_page" id="view_sales_per_page"
                                                data-id="sales" onChange="PosnicPro.setPerPage(this, 'Table');" aria-label="View sales per page">
                                                <option value="5" selected>5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="50">50</option>
                                                <option value="100">100</option>
                                            </select>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <div class="col-8">
                                <div class="email-rightbar">
                                    <div class="card-header header_icon">
                                        <ul class="list-inline mb-0 pl-0 float-right">
                                            <li class="list-inline-item">
                                                <a data-module="sales" data-access="read" href="#/sales"
                                                    id="sales_exportbtn" class="sale_color"
                                                    onClick="PosnicPro.sales.view.exportSales();" data-toggle="tooltip"
                                                    title="Export Selected">
                                                    <i class="feather icon-share font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a data-module="sales" data-access="delete" href="#/sales"
                                                    id="sales_deletebtn" class="sale_color"
                                                    onclick="PosnicPro.sales.view.deleteSelectedSales();"
                                                    data-toggle="tooltip" title="Delete">
                                                    <i class="feather icon-trash font-20"></i>
                                                </a>
                                            </li>
                                            <li class="list-inline-item">
                                                <a href="javascript:PosnicPro.refreshDatatable('sales')" data-id="sales"
                                                    class="add_new_tooltip" data-toggle="tooltip" title="Refresh">
                                                    <i class="feather icon-refresh-cw font-20"></i>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-body loader-table-sale">
                        <div class="table-responsive">
                            <table class="table table-borderless m-cards" id="view_sales">
                                <div class="col-sm-6 col-md-12 col-lg-12" id="sales_img_hide" style="display:none;">
                                    <img src="static/images/general/nodata.svg" class="img-fluid"
                                        style="opacity: 0.6;width: 100%;height: 250px;" alt="" loading="lazy" decoding="async">
                                </div>
                                <div class="sales_norecord col-sm-6 col-md-12 col-lg-12" style="display:none;">
                                </div>

                                <thead class="datatable-thead-tbody table-header sales_header"></thead>
                                <tbody class="datatable-thead-tbody table-body sales_header"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card m-b-30 sales_header">
                    <div class="card-body ecommerce-pagination page_padding">
                        <div class="row align-items-center">
                            <div class="col-8">
                                <div class="hint-text">
                                    Showing
                                    <b><span id="view_sales_page_total"></span></b>
                                    to
                                    <b><span id="view_sales_page_perpage_total"></span></b>
                                    of
                                    <b><span id="view_sales_total"></span></b>
                                    entries
                                    <span class="showing-hide-show-sales" style="display:none;">
                                        &nbsp;&nbsp;&nbsp;&nbsp;
                                        <span class="showing-value-sales text-dark"> 0 </span>&nbsp;
                                        rows selected
                                    </span>
                                </div>
                            </div>
                            <div class="col-4">
                                <nav aria-label="Page navigation example">
                                    <ul class="pagination mb-0">
                                        <button class="btn previous page-item text-dark-gradient f-w-7" data-id="sales"
                                            onclick="PosnicPro.previousPage(this, 'Table')"> <i
                                                class="fa fa-angle-left font-20"></i> </button>
                                        <button class="btn next page-item text-dark-gradient f-w-7" data-id="sales"
                                            onclick="PosnicPro.nextPage(this, 'Table')"> <i
                                                class="fa fa-angle-right font-20"></i> </button>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--End col-->
        </div>
        <!--End row-->
    </div>
    <!--End Contentbar-->
</div>
<!--End Containerbar-->
