<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--
        WHERE EVERY RELATIVE PATH ON THIS PAGE POINTS.

        A printed code can be three segments deep - /order/AZ100/venue/RC/123
        for a hotel room - and without this the browser looks for each asset
        under /order/AZ100/venue/, a directory that does not exist. The page
        loads and shows nothing, which is the worst kind of broken: a blank
        screen with no error anybody sees.

        Pinned to the mount rather than left to the arriving URL, so one file
        serves the shop address, a table and a venue alike.
    -->
    <base href="/order/" />
    <title>Thank You - Receipt</title>
    <link href="assets/bootstrap.min.css" rel="stylesheet">
    <link href="assets/thankyou/style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="assets/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="config.js"></script>
    <link href="assets/channel-state.css" rel="stylesheet">
    <script src="assets/channel-state.js"></script>
    <script src="assets/service-point.js"></script>
</head>

<body>
    <!-- Full height flex container -->
    <div class="d-flex justify-content-center align-items-center mb-4 bg-light center-wrapper">
        <div class="thank-you-box text-center bg-white p-4 rounded shadow">
            <div class="success-circle display-1 text-success mb-3">✓</div>
            <h1 class="text-danger fw-bold">Payment Successful</h1>
            <p class="lead">Your order has been placed. We’re preparing your food 🍗</p>
            <h2 class="token-number">Token No: <span id="tokenId">--</span></h2>
            <p class="order-time" id="orderTime">Order Time: --</p>

            <div class="mt-4 d-flex justify-content-center gap-3 flex-wrap button-group">
                <button class="btn btn-danger" onclick="clearReceiptAndGo('products.html')">🍟 Order More</button>
                <button class="btn btn-danger" onclick="clearReceiptAndGo('home.html')">🏁 Finish</button>
            </div>
        </div>
    </div>

    <div class="receipt-section">
        <div class="center" id="branch-name"><strong>POS</strong></div>
        <div class="center">Token: <strong><span id="token-id"></span></strong></div>
        <div class="center">Date: <strong><span id="orderDate">2024-03-24</span></strong></div>
        <div class="receipt-line"></div>
        <div class="center">
            <div>Order: <strong id="orderTypePrint">DINE IN</strong> | Pay: <strong id="paymentTypePrint">Upi</strong>
            </div>
        </div>
        <div class="receipt-line"></div>

        <div id="items"></div>

        <div class="receipt-line"></div>

        <div class="totals">
            <div class="item"><span>Subtotal</span><span><strong id="subtotal">₹0.00</strong></span></div>
            <div class="item"><span>Discount</span><span><strong id="discount">-₹0.00</strong></span></div>
            <div class="item"><span>Tax</span><span><strong id="tax">₹0.00</strong></span></div>
            <div class="item"><span>Total</span><span><strong id="total">₹0.00</strong></span></div>
        </div>

        <div class="receipt-line"></div>
        <div class="center">Thank you! Visit again.</div>
        <div class="powered"><b>Powered by <strong>Posnic</strong><br /><span>https://www.posnic.com</span></b></div>
        <!-- <div class="text-center mt-4">
            <button class="btn btn-outline-dark" onclick="generatePdfFromHtmlFile();">Pdf</button>
        </div> -->
    </div>

    <script src="assets/thankyou/script.js?v=20260708-successfix"></script>
</body>

</html>
